async function registerBatchFile(file, date) {
  refreshBizMap();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' })
    .filter(r => digits(r[1]).length >= 8 && num(r[2]) > 0);
  if (!rows.length) throw new Error('은행코드·계좌번호·금액 순서의 이체 행을 찾지 못했어요');
  const open = IV.invs.filter(i => i.kind === 'buy' && (i.status === 'unpaid' || i.status === 'review'));
  const used = new Set(), items = [], learn = [];
  for (const r of rows) {
    const code = digits(r[0]).padStart(3, '0'), acct = String(r[1]).trim(), amt = num(r[2]), holder = String(r[3] || '').trim(), memo = String(r[7] || '').trim();
    let inv = open.find(i => !used.has(i.id) && num(i.total) === amt && bankOf(i) && digits(bankOf(i).acct) === digits(acct));
    if (!inv) inv = open.find(i => !used.has(i.id) && num(i.total) === amt && invNames(i, vendorOf(i)).some(n => n === normName(holder) || normName(holder).includes(n) || n.includes(normName(holder))));
    if (inv) {
      used.add(inv.id);
      const v = vendorOf(inv); if (v && !v.acct) { v.acct = acct; v.bankCode = code; v.holder = v.holder || holder; learn.push(v); }
    }
    items.push({ invId: inv ? inv.id : null, amt, code, acct, holder, memo });
  }
  const total = items.reduce((s, x) => s + x.amt, 0), ref = db.collection('batches').doc();
  const b = { ym: IV.ym, date, items, total, status: 'planned', createdAt: TS(), by: S.user.email, fileName: file.name };
  await ref.set(b);
  await commitBatches([...used].map(id => x => x.update(db.collection('invoices').doc(id), { status: 'planned', batchId: ref.id })));
  await commitBatches(learn.map(v => x => x.update(db.collection('vendors').doc(v.id), { acct: v.acct, bankCode: v.bankCode, holder: v.holder })));
  used.forEach(id => { const i = IV.invs.find(v => v.id === id); i.status = 'planned'; i.batchId = ref.id; });
  IV.batches.push({ id: ref.id, ...b }); IV.batchReg = false;
  await doMatch(true);
  toast(`${rows.length}줄 중 ${used.size}건을 계산서와 연결해 묶음으로 등록했어요${learn.length ? ` · 거래처 계좌 ${learn.length}곳 자동 등록` : ''}`);
  renderInv();
}

/* ---------- 목록 엑셀 (지금 파일 모양 + 결과 열) ---------- */
async function exportInvList(silent) {
  const cur = IV.invs.filter(i => i.ym === IV.ym);
  const sheets = [...new Set(cur.map(i => i.sheet))];
  const hdrDocs = await Promise.all(sheets.map(sn => db.collection('invoiceHeaders').doc(sn.replace(/\//g, '-')).get()));
  const wb = new ExcelJS.Workbook();
  const txOf = id => IV.txns.find(t => t.id === id);
  const order = ['고지서', '매입세금', '매입계산서', '매출세금', '매출계산서'];
  sheets.sort((a, b) => (order.findIndex(k => a.includes(k)) + 99) % 99 - (order.findIndex(k => b.includes(k)) + 99) % 99);
  sheets.forEach((sn, si) => {
    const H = hdrDocs[si].exists ? [...hdrDocs[si].data().headers] : [];
    const isManual = cur.some(i => i.sheet === sn && i.type === '수기');
    const kind = (cur.find(i => i.sheet === sn) || {}).kind;
    const need = isManual ? ['완료여부'] : ['미지급외 처리', '기지급여부', '계정명'];
    need.forEach(n => { if (!H.includes(n)) H.push(n); });
    const extra = [kind === 'sell' ? '입금일' : '지급일', '매칭 내역', '상태', '품의서 확인', ...(kind === 'buy' ? ['이체 메모'] : [])];
    const ws = wb.addWorksheet(sn.slice(0, 31), { views: [{ state: 'frozen', ySplit: 1 }] });
    const hr = ws.addRow([...H, ...extra]);
    hr.eachCell((c, k) => { c.font = { bold: true }; c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: k > H.length ? 'FFE3F4F2' : 'FFFFFF00' } }; c.border = { bottom: { style: 'thin' } }; });
    const L = kind === 'sell' ? STATUS_LABEL_SELL : STATUS_LABEL;
    cur.filter(i => i.sheet === sn).sort((a, b) => String(a.date).localeCompare(b.date)).forEach(i => {
      const vals = H.map((h, k) => (i.raw || [])[k] ?? '');
      const set = (n, v) => { const k = H.indexOf(n); if (k >= 0) vals[k] = v; };
      if (isManual) { set('완료여부', i.status === 'paid' ? 'V' : ''); set('이체금액', num(i.total) || ''); }
      else { set('기지급여부', i.status === 'paid' ? 'V' : ''); set('미지급외 처리', i.status === 'excluded' ? (i.manualNote || 'V') : ''); set('계정명', i.account || ''); }
      const tx = txOf((i.matchTxIds || [])[0]);
      const row = ws.addRow([...vals, i.status === 'paid' ? (i.matchDate || (tx && tx.date) || '') : '', i.status === 'excluded' ? (i.manualNote || '') : (i.matchText || '') + (i.matchType === 'manual' ? (i.bankMatch ? ' · 은행 내역 일치' : ' · 은행 내역 없음') : ''), L[i.status] || '', i.approval ? `V (${initialOf(i.approval.by)} ${shortTime(i.approval.at)})` : '', ...(kind === 'buy' ? [i.memo || ''] : [])]);
      if (i.status === 'unpaid' || i.status === 'review') row.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF7F1D4' } });
    });
    ['합계금액', '공급가액', '세액', '이체금액', '품목공급가액', '품목세액'].forEach(n => { const k = H.indexOf(n); if (k >= 0) ws.getColumn(k + 1).numFmt = '#,##0'; });
    ws.columns.forEach((c, k) => c.width = k >= H.length ? 22 : Math.min(28, Math.max(9, String(([...H, ...extra])[k] || '').length * 2 + 2)));
    ws.autoFilter = { from: 'A1', to: colL(H.length + extra.length) + '1' };
  });
  // 요약 시트
  const summary = (title, kind, statuses, withBank) => {
    const ws = wb.addWorksheet(title); const by = {};
    cur.filter(i => i.kind === kind && statuses.includes(i.status)).forEach(i => { const k = i.vendorName; const x = by[k] = by[k] || { n: 0, amt: 0, inv: i }; x.n++; x.amt += num(i.total); });
    const cols = withBank ? ['거래처', '건수', '금액', '은행코드', '계좌번호', '예금주'] : ['거래처', '건수', '금액'];
    const hr = ws.addRow(cols); hr.font = { bold: true }; hr.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } });
    let tot = 0;
    Object.entries(by).sort((a, b) => b[1].amt - a[1].amt).forEach(([k, x]) => { const bk = withBank ? bankOf(x.inv) : null; tot += x.amt; ws.addRow(withBank ? [k, x.n, x.amt, bk ? bk.code : '계좌 없음', bk ? bk.acct : '', bk ? bk.holder : ''] : [k, x.n, x.amt]); });
    const tr = ws.addRow(['합계', '', tot]); tr.font = { bold: true };
    ws.getColumn(3).numFmt = '#,##0'; [30, 8, 16, 10, 22, 26].forEach((w, k) => ws.getColumn(k + 1).width = w);
  };
  summary('미지급 요약', 'buy', ['unpaid', 'review', 'planned'], true);
  summary('미수 요약', 'sell', ['unpaid', 'review'], false);
  await saveWb(wb, `_${+IV.ym.slice(5)}월_미지급비용_QUETTA.xlsx`);
  if (!silent) toast('목록 엑셀을 만들었어요');
}

/* =========================================================
   거래처 계좌
   ========================================================= */
const VD = { q: '', pending: null, limit: 200 };
async function renderVendors() {
  const el = $('#v-vendors');
  await busy(() => loadVendorsCfg());
  const q = normName(VD.q);
  const acctCount = {}; VENDORS.forEach(v => { const k = digits(v.acct); if (k) acctCount[k] = (acctCount[k] || 0) + 1; });
  const list = VENDORS.filter(v => !q || [v.name, v.holder, ...(v.aliases || []), ...(v.bizNos || []), v.acct].some(x => normName(x).includes(q) || digits(x).includes(VD.q.replace(/\D/g, '') || '#')));
  const shown = list.slice(0, VD.limit);
  el.innerHTML = `
  <div class="panel">
    <h2>거래처 계좌 <span class="hint">${VENDORS.length}곳</span></h2>
    <p class="hint">사업자번호로 세금계산서와, 출금·입금 표시명으로 은행 내역과, 계좌번호로 대량이체 파일과 이어져요. 표시명은 매칭 화면에서 ‘맞음’을 누르면 자동으로 쌓여요.</p>
    <div class="row">
      <input class="in" id="vdQ" style="flex:1;min-width:220px" placeholder="거래처명·사업자번호·계좌번호 검색" value="${esc(VD.q)}">
      <button class="btn" id="vdAdd">거래처 추가</button>
      <label class="btn">엑셀로 일괄 등록<input type="file" id="vdFile" accept=".xlsx,.xls" hidden></label>
      <button class="btn" id="vdDl">목록 엑셀 받기</button>
    </div>
    ${VD.pending ? `<div class="warn">${esc(VD.pending.fileName)}: 새 거래처 <b>${VD.pending.creates.length}</b>곳, 기존 거래처에 이름 추가 <b>${VD.pending.merges}</b>건, 같은 계좌로 합친 중복 <b>${VD.pending.dupes}</b>건.
      <div class="row" style="margin-top:8px"><button class="btn primary sm" id="vdSave">등록하기</button><button class="btn ghost sm" id="vdCancel">취소</button></div></div>` : ''}
  </div>
  <div class="panel" style="padding:0"><div class="scroll"><table class="t">
    <thead><tr><th>거래처명</th><th>다른 이름</th><th>사업자번호</th><th>은행</th><th>코드</th><th>계좌번호</th><th>예금주(받는분)</th><th>출금 표시명</th><th>입금 표시명</th><th>계정명</th><th></th></tr></thead>
    <tbody>${shown.map(v => {
      const f = (k, w, val) => `<input class="in" style="width:${w}px" data-vd="${k}" data-id="${v.id}" value="${esc(val ?? v[k] ?? '')}">`;
      const dup = digits(v.acct) && acctCount[digits(v.acct)] > 1;
      return `<tr><td>${f('name', 170)}</td><td>${f('aliases', 140, (v.aliases || []).join(', '))}</td><td>${f('bizNos', 120, (v.bizNos || []).join(', '))}</td>
        <td>${f('bank', 60)}</td><td>${f('bankCode', 50)}</td><td>${f('acct', 150)}${dup ? '<div class="diff" style="font-size:11px">같은 계좌 중복</div>' : ''}</td><td>${f('holder', 140)}</td>
        <td>${f('outNames', 130, (v.outNames || []).join(', '))}</td><td>${f('inNames', 130, (v.inNames || []).join(', '))}</td><td>${f('account', 90)}</td>
        <td><button class="btn ghost sm" data-vdel="${v.id}">삭제</button></td></tr>`;
    }).join('') || '<tr><td colspan="11" class="empty">등록된 거래처가 없어요. 지금 쓰시는 계좌번호 엑셀을 일괄 등록하세요.</td></tr>'}</tbody></table></div>
    ${list.length > shown.length ? `<div class="row" style="padding:12px"><span class="hint">${list.length}곳 중 ${shown.length}곳 표시</span><button class="btn sm" id="vdMore">더 보기</button></div>` : ''}
  </div>`;
}
const vdEl = document.getElementById('v-vendors');
vdEl.addEventListener('input', e => { if (e.target.id === 'vdQ') { VD.q = e.target.value; clearTimeout(VD.t); VD.t = setTimeout(() => renderVendors().then(() => { const q = $('#vdQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }), 300); } });
vdEl.addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'vdMore') { VD.limit += 300; return renderVendors(); }
  if (t.id === 'vdCancel') { VD.pending = null; return renderVendors(); }
  if (t.id === 'vdSave') return busy(saveVendorImport);
  if (t.id === 'vdDl') return busy(async () => {
    const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('계좌번호');
    ws.addRow(['거래처명', '은행', '은행코드', '계좌번호', '예금주', '사업자번호', '다른 이름', '출금 표시명', '입금 표시명', '계정명']).font = { bold: true };
    VENDORS.forEach(v => { const r = ws.addRow([v.name, v.bank, v.bankCode, v.acct, v.holder, (v.bizNos || []).join(', '), (v.aliases || []).join(', '), (v.outNames || []).join(', '), (v.inNames || []).join(', '), v.account]); r.getCell(3).numFmt = '@'; r.getCell(4).numFmt = '@'; });
    [26, 8, 8, 20, 20, 16, 24, 20, 20, 12].forEach((w, k) => ws.getColumn(k + 1).width = w);
    await saveWb(wb, `거래처_계좌번호_${today().replace(/-/g, '')}.xlsx`);
  });
  if (t.id === 'vdAdd') {
    const name = prompt('거래처명을 입력하세요'); if (!name || !name.trim()) return;
    return busy(async () => { const ref = db.collection('vendors').doc(); const v = { name: name.trim(), aliases: [], bizNos: [], bank: '', bankCode: '', acct: '', holder: '', outNames: [], inNames: [], account: '', createdAt: TS() }; await ref.set(v); VENDORS.push({ id: ref.id, ...v }); VD.q = name.trim(); refreshBizMap(); renderVendors(); });
  }
  if (t.dataset.vdel) {
    const v = vById(t.dataset.vdel); if (!confirm(`${v.name} 거래처를 삭제할까요?`)) return;
    return busy(async () => { await db.collection('vendors').doc(v.id).delete(); VENDORS = VENDORS.filter(x => x.id !== v.id); refreshBizMap(); toast('삭제했어요'); renderVendors(); });
  }
});
vdEl.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'vdFile' && t.files[0]) return busy(() => parseVendorFile(t.files[0]));
  const k = t.dataset.vd; if (!k) return;
  const v = vById(t.dataset.id), listKeys = ['aliases', 'bizNos', 'outNames', 'inNames'];
  let val = t.value.trim();
  if (listKeys.includes(k)) val = val.split(/\s*,\s*/).filter(Boolean).map(x => k === 'outNames' || k === 'inNames' ? learnName(x) : x);
  if (k === 'bankCode') val = bankCodeOf('', val);
  const p = { [k]: val };
  if (k === 'bank' && !v.bankCode) p.bankCode = bankCodeOf(val, '');
  await db.collection('vendors').doc(v.id).update(p); Object.assign(v, p); refreshBizMap(); toast('저장했어요');
  if (p.bankCode && k === 'bank') renderVendors();
});
async function parseVendorFile(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let rows = null, H = null, hi = -1;
  for (const sn of wb.SheetNames) {
    const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
    const i = r.findIndex(x => x.map(y => String(y).trim()).includes('거래처명') && x.map(y => String(y).trim()).includes('계좌번호'));
    if (i >= 0) { rows = r; hi = i; H = r[i].map(y => String(y).trim()); break; }
  }
  if (!rows) throw new Error('거래처명·계좌번호 머리글이 있는 시트를 찾지 못했어요');
  const c = n => H.indexOf(n), extraCodes = {};
  const ci = c('대표코드'), ni = c('참가기관명');
  if (ci >= 0) rows.slice(hi + 1).forEach(r => { const nm = String(r[ci - 1] || '').trim(); if (nm && r[ci]) extraCodes[nm] = digits(r[ci]).padStart(3, '0'); });
  const byAcct = new Map(VENDORS.filter(v => digits(v.acct)).map(v => [digits(v.acct), v]));
  const creates = new Map(); let merges = 0, dupes = 0; const mergeOps = [];
  for (const r of rows.slice(hi + 1)) {
    const name = String(r[c('거래처명')] || '').trim(), acct = String(r[c('계좌번호')] || '').trim(); if (!name || !acct) continue;
    const bank = String(r[c('은행')] || '').trim(), code = bankCodeOf(bank, r[c('은행코드')]) || extraCodes[bank] || '';
    const holder = c('예금주') >= 0 ? String(r[c('예금주')] || '').trim() : '';
    const key = digits(acct), ex = byAcct.get(key);
    if (ex) { if (normName(ex.name) !== normName(name) && !(ex.aliases || []).some(a => normName(a) === normName(name))) { ex.aliases = [...(ex.aliases || []), name]; mergeOps.push(ex); merges++; } continue; }
    if (creates.has(key)) { const x = creates.get(key); if (normName(x.name) !== normName(name) && !x.aliases.includes(name)) x.aliases.push(name); dupes++; continue; }
    creates.set(key, { name, aliases: [], bizNos: [], bank, bankCode: code, acct, holder, outNames: [], inNames: [], account: '' });
  }
  VD.pending = { fileName: file.name, creates: [...creates.values()], merges, dupes, mergeOps: [...new Set(mergeOps)] };
  renderVendors();
}
async function saveVendorImport() {
  const p = VD.pending;
  const ops2 = p.creates.map(v => { const ref = db.collection('vendors').doc(); return b => b.set(ref, { ...v, createdAt: TS() }); });
  await commitBatches([...ops2, ...p.mergeOps.map(v => b => b.update(db.collection('vendors').doc(v.id), { aliases: v.aliases }))]);
  VD.pending = null; VENDORS = null; refreshBizMap();
  toast(`${p.creates.length}곳을 등록했어요`); renderVendors();
}
