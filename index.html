<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUETTA 자금일보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#EEF3F2; --paper:#FFFFFF; --ink:#1B2928; --muted:#5E716F; --line:#D5E0DE; --line2:#E6EDEC;
  --teal:#2BADA0; --teal-deep:#0F5C55; --teal-soft:#E3F4F2;
  --gold:#D4BE52; --gold-deep:#8A7618; --gold-soft:#F7F1D4;
  --navy:#34507A; --navy-soft:#E7ECF4;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--teal-deep);color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;height:56px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:500;opacity:.7;margin-left:6px}
.top nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.top nav button{background:none;border:0;color:#cfe9e5;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.top nav button[aria-current="true"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.top nav button:hover{color:#fff}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:#cfe9e5;white-space:nowrap}
.who button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}

main{max-width:1320px;margin:0 auto;padding:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 12px}
.panel h3{font-size:14px;margin:18px 0 8px}
.hint{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.btn.primary:hover{background:#249a8e}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}
input.in,select.in{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;min-width:0}
input.in:focus,select.in:focus,.btn:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

/* day header */
.dayhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.dayhead h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dayhead .navbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.spacer{flex:1}

/* bankbook strip */
.book{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.book-top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line2)}
.book-top b{font-size:15px}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;border:3px double var(--gold);color:var(--gold-deep);font-weight:800;font-size:13px;line-height:1.15;text-align:center;transform:rotate(-12deg);background:var(--gold-soft)}
.stamp.pending{border-color:var(--line);color:var(--muted);background:#f6f8f8}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:#F8FAFA;white-space:nowrap}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t th.num,table.t td.num{text-align:right}
table.t tr.sum td{font-weight:700;background:#F8FAFA}
.inC{color:var(--teal-deep)}
.outC{color:var(--navy)}
.diff{color:var(--gold-deep);font-weight:600}
.okC{color:var(--teal-deep)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.tag.cash{background:var(--gold-soft);color:var(--gold-deep)}

/* ledgers */
.ledgers{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.ledgers{grid-template-columns:1fr}.top{gap:12px;padding:0 12px}main{padding:14px}}
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.ledger-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:3px solid var(--teal)}
.ledger.out .ledger-h{border-bottom-color:var(--navy)}
.ledger-h b{font-size:15px}
.ledger-h .num{font-size:16px;font-weight:700}
.entry{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;padding:10px 16px;border-bottom:1px solid var(--line2);align-items:center}
.entry.sel{background:var(--teal-soft)}
.entry .meta{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .lbl{grid-column:2/3}
.entry .lbl input{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 8px;background:#F6F9F9;font-weight:600}
.entry .lbl input:hover{border-color:var(--line)}
.entry .lbl input:focus{background:#fff;border-color:var(--teal);outline:none}
.entry .lbl input.edited{background:var(--gold-soft)}
.entry .amt{font-weight:700;font-variant-numeric:tabular-nums}
.entry .src{font-size:11px;padding:0 6px;border-radius:4px}
.src.manual{background:var(--gold-soft);color:var(--gold-deep)}
.src.rule{background:var(--teal-soft);color:var(--teal-deep)}
.entry.group{background:#FAFCFC}
.members{grid-column:2/4;font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-top:4px}
.members div{display:flex;justify-content:space-between;gap:10px}
.ledger-f{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.manualform{display:grid;grid-template-columns:130px 1fr 130px auto;gap:6px;padding:10px 16px;border-top:1px dashed var(--line);background:#FBFCFC}
@media (max-width:600px){.manualform{grid-template-columns:1fr 1fr}}

.toolbar{position:sticky;top:64px;z-index:10;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;margin-bottom:12px}
.toolbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

details.extra summary{cursor:pointer;font-weight:600;padding:4px 0}
.grid-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid-in label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.grid-in input{text-align:right}

.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;background:#FBFCFC;cursor:pointer;margin:14px 0}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.filechips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mpanel h2{display:flex;align-items:center;gap:10px}
.mlist{width:100%;border-collapse:collapse;margin-bottom:12px}
.mlist td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.mlist td.item{white-space:nowrap;color:var(--muted);font-size:13px;width:1%}
.mlist input{width:100%}
.mlist td.amt{width:150px}
.madd{display:grid;grid-template-columns:minmax(180px,240px) auto 140px 1fr auto;gap:8px;align-items:center;background:var(--teal-soft);border-radius:10px;padding:10px}
.madd .acct[hidden]{display:none}
@media (max-width:760px){.madd{grid-template-columns:1fr 1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(27,41,40,.35);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:14px;padding:22px;width:min(460px,100%);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal h3{margin:0 0 12px;font-size:16px}
.people{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 20px;margin-bottom:18px}
.people.todo{background:var(--gold-soft);border-color:#E8DA9A}
.people b{font-size:15px}
.people label{display:flex;align-items:center;gap:6px}
.people input{width:80px;text-align:right}
.people .todo-msg{color:var(--gold-deep);font-weight:600;font-size:13px}
.entry.auto{background:#FAFCFC}
.entry.auto.checked{background:#F3FAF9}
.members .mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0}
.members .mrow .btn{padding:0 8px}
.checked-badge{color:var(--teal-deep);font-weight:700}
.recheck{color:var(--gold-deep);font-weight:600}
.sugg{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow:auto;min-width:200px}
.sugg div{padding:7px 12px;cursor:pointer;white-space:nowrap}
.sugg div.on,.sugg div:hover{background:var(--teal-soft)}
.sugg mark{background:none;color:var(--teal-deep);font-weight:700}
.mrows{display:flex;flex-direction:column;gap:8px}
.mrows .madd{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mrows .madd .gname{width:76px;flex:none}
.mrows .madd [data-m=item]{width:150px;flex:none}
.mrows .madd [data-m=acct]{width:130px;flex:none}
.mrows .madd [data-m=amt]{width:120px;flex:none}
.mrows .madd [data-m=label]{flex:1 1 320px;min-width:200px}
.mrows .madd .btn{flex:none;width:auto;padding:6px 12px;font-size:13px;line-height:1.3}
.pdin{width:128px;padding:4px 6px;font-size:12.5px}
.pdin.pdset{background:var(--gold-soft);border-color:#E8DA9A;font-weight:600}
.mrows .madd .gname{font-weight:700;color:var(--teal-deep);font-size:13px}
@media (max-width:760px){.mrows .madd{grid-template-columns:1fr 1fr}}
.newb{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);border-radius:4px;padding:0 5px;vertical-align:1px}
.ivt td{padding:9px 10px}
.ivt th{padding:8px 10px}
.dcell{font-size:12.5px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.dcell.main{color:var(--ink);font-weight:600}
.vcell{min-width:170px;max-width:240px}
.vname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.vsub .warnt{color:var(--gold-deep)}
.icell{max-width:200px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.vform label.full{grid-column:1/3}
.vform .req::after{content:' *';color:var(--gold-deep)}
.vform input,.vform select{text-align:left}
.dupwarn{background:var(--gold-soft);border:1px solid #E8DA9A;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#5d500f;margin-top:10px}
.missing{color:var(--gold-deep);font-size:12px}
.duebox{background:var(--gold-soft);border:1px solid #E8DA9A;border-radius:var(--radius);padding:12px 16px;margin-bottom:18px}
.duebox table{background:#fff;border-radius:8px}
tr.voided td{text-decoration:line-through;opacity:.55}
tr.voided td:last-child,tr.voided td:nth-last-child(2){text-decoration:none;opacity:1}
.pager{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px;flex-wrap:wrap}
.pager button{min-width:34px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;cursor:pointer}
.pager button[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.entry .lead{display:flex;align-items:center;gap:4px;grid-row:1/3;align-self:start;padding-top:2px}
.dh{cursor:grab;color:#9AABA9;font-size:13px;letter-spacing:-2px;padding:2px 3px;border-radius:4px;user-select:none}
.dh:hover{background:var(--line2);color:var(--ink)}
.entry.drop-before{box-shadow:inset 0 3px 0 var(--teal)}
.entry.drop-after{box-shadow:inset 0 -3px 0 var(--teal)}
.entry.dragging{opacity:.4}
.dayconfirm{display:inline-flex;align-items:center;gap:8px;background:var(--teal-soft);border:1px solid #BFE5E0;border-radius:99px;padding:4px 6px 4px 12px;font-size:13px}
.sugbox{background:var(--teal-soft);border:1px solid #BFE5E0;border-radius:8px;padding:6px 8px;margin-top:4px;color:var(--ink);font-size:12px}
.txt td{padding:7px 9px;font-size:13px}
.txt tr.sel td{background:var(--teal-soft)}
.txt tr.dayrow td{background:#F3F7F6;border-top:2px solid var(--line);padding:8px 10px;font-size:13px}
.thsel{width:auto;max-width:76px;padding:3px 2px;font-size:12px;font-weight:600;color:var(--muted);border-color:transparent;background:transparent;cursor:pointer}
.chkon{border:1px solid #BFE5E0;background:var(--teal-soft);color:var(--teal-deep);font-weight:700;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.chkoff{border:1px dashed var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.chkoff:hover{border-color:var(--teal);color:var(--teal-deep)}
.newn{color:#fff;background:var(--teal);border-radius:3px;font-size:9px;font-weight:800;padding:0 3px;margin-left:3px;vertical-align:4px}
.mcell{max-width:220px;white-space:nowrap}
.mtxt{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.sugi{font-size:16px;cursor:help;vertical-align:middle}
.sugbtn{padding:2px 9px!important;font-size:12px!important;vertical-align:middle}
.sugx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;vertical-align:middle}
.sugx:hover{color:var(--ink)}
.thsort{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;padding:0;white-space:nowrap}
.thsort:hover{color:var(--ink)}
.bulist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.burow{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.burow.eq{border-color:var(--teal);background:var(--teal-soft)}
.txt tr.bulkrow td{background:#FBFCFC;font-size:12px;padding:4px 9px}
.stamps{display:flex;gap:6px;align-items:center}
.stamp.gray{border-color:#B9C6C4;color:#5E716F;background:#F4F7F6;transform:rotate(8deg)}
.stamp small{font-size:10.5px;font-weight:700}
.stamp.warn{border-color:#E39A3B;color:#B5651D;background:#FFF1DE;transform:rotate(8deg);cursor:help}
.stamp.gray{cursor:help}
.entry.pend{background:repeating-linear-gradient(45deg,#FFFDF3,#FFFDF3 8px,#FBF6DE 8px,#FBF6DE 16px);border-left:3px solid var(--gold)}
.pendtag{background:var(--gold);color:#fff;font-size:11px;font-weight:800;border-radius:4px;padding:0 6px}
.ivc{table-layout:fixed;width:100%}
.ivc th,.ivc td{padding:7px 6px;vertical-align:middle}
.ivc .c-sel{width:28px}.ivc .c-date{width:64px}.ivc .c-amt{width:104px}.ivc .c-chk{width:62px;text-align:center}.ivc .c-fit{width:104px}
.ivc .vcell{min-width:0;max-width:none}.ivc .icell{max-width:none}
.ivc th{font-size:12px;white-space:nowrap}
.ivc .sub{font-size:11px;color:var(--muted);line-height:1.3}
.ck{display:inline-flex;align-items:center;gap:3px;cursor:pointer;font-size:12px;font-weight:700;color:var(--teal-deep)}
.ck input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
input.fit{width:100%;padding:4px 6px;font-size:13px}
input.fit:focus{position:relative;z-index:5;width:240px;font-size:13px!important;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.sugw{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:2px}
.sugi{border:0;background:none;font-size:16px;cursor:pointer;padding:0 2px}
.sugi:hover{transform:scale(1.2)}
.acchip{border:1px solid var(--line);cursor:pointer;background:#fff}
.acchip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.presets button{border:1px solid var(--teal);background:#fff;color:var(--teal-deep);border-radius:99px;padding:5px 12px;cursor:pointer}
.presets button:hover{background:var(--teal-soft)}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--line2);border-radius:99px;padding:4px 12px;font-size:12.5px}
.chip b{font-variant-numeric:tabular-nums}
.warn{background:var(--gold-soft);border:1px solid #E8DA9A;color:#5d500f;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:600}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px;max-width:420px;width:100%}
.login h1{margin:0 0 6px;font-size:22px}
.login .btn{width:100%;margin-top:18px;padding:11px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.busy{position:fixed;inset:0;background:rgba(238,243,242,.6);display:grid;place-items:center;z-index:50;font-weight:600}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <h1>QUETTA 자금일보</h1>
    <p class="hint">행정실에 등록된 Google 계정으로 로그인하세요.</p>
    <p id="loginMsg" class="warn" hidden></p>
    <button id="loginBtn" class="btn primary">Google 계정으로 로그인</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">QUETTA 자금일보<small>강남대성기숙</small></div>
    <nav id="nav">
      <button data-view="day">일보</button>
      <button data-view="txns">입출금내역</button>
      <button data-view="vpay">업체별 이체</button>
      <button data-view="upload">업로드</button>
      <button data-view="inv">세금계산서</button>
      <button data-view="vendors">거래처</button>
      <button data-view="export">엑셀 다운로드</button>
      <button data-view="settings">설정</button>
    </nav>
    <div class="who"><span id="who"></span><button id="logoutBtn">로그아웃</button></div>
  </header>
  <main>
    <div id="dueBanner"></div>
    <section id="v-day"></section>
    <section id="v-txns" hidden></section>

/* 우리 계좌끼리 오간 돈: 같은 날·같은 금액으로 A계좌 출금 ↔ B계좌 입금 (시간 순으로 짝), 유안타 등 지정한 곳으로 보낸 출금 */
const XFER = new Map(), XKIND = new Map();   // XKIND: cma(유안타 등 내역 없는 계좌) · cash(현금)
function computeTransfers(list) {
  const ours = new Set(S.accounts.map(a => a.acct6)), names = String(S.xferNames || '').split(/\s*,\s*/).map(x => x.trim()).filter(Boolean);
  const own = String(S.ownNames || '').split(/\s*,\s*/).map(normName).filter(x => x.length >= 2);
  const ownHit = t => { const p = normName(t.party || t.memo1); return own.some(n => p.includes(n)); };
  const similar = (a, b) => { a = normName(a); b = normName(b); if (a.length < 4 || b.length < 4) return false; for (let i = 0; i + 4 <= a.length; i++) if (b.includes(a.slice(i, i + 4))) return true; return false; };
  const looksOurs = (o, i) => ownHit(o) || ownHit(i) || similar(o.party || o.memo1, i.party || i.memo1);
  const byDate = {};
  list.forEach(t => { if (ours.has(t.acct6)) (byDate[t.date] = byDate[t.date] || []).push(t); });
  Object.values(byDate).forEach(day => {
    day.forEach(t => { XFER.delete(t.id); XKIND.delete(t.id); });
    const sorted = day.slice().sort(cmpTx), used = new Set();
    sorted.filter(t => num(t.outAmt) > 0).forEach(o => {
      const i = sorted.find(x => !used.has(x.id) && num(x.inAmt) === num(o.outAmt) && x.acct6 !== o.acct6 && looksOurs(o, x));
      if (i) { used.add(i.id); used.add(o.id); XFER.set(o.id, 'out'); XFER.set(i.id, 'in'); }
    });
    sorted.filter(t => !used.has(t.id)).forEach(o => {
      const txt = `${o.party || ''} ${o.memo1 || ''}`.normalize('NFKC'), memo = `${o.memo || ''} ${o.memo1 || ''} ${o.memo2 || ''}`.normalize('NFKC');
      const dir = num(o.outAmt) > 0 ? 'out' : 'in';
      if (names.some(n => txt.includes(n))) { XFER.set(o.id, dir); XKIND.set(o.id, 'cma'); }
      else if (memo.includes('현금')) { XFER.set(o.id, dir); XKIND.set(o.id, 'cash'); }
    });
  });
}
const bankShort = a => String(a.bank || '').replace(/은행|증권/g, '').trim() || '';
const accName = a => a ? `${bankShort(a)} ${a.acct6}`.trim() : '';
const accNameOf = acct6 => { const a = S.accounts.find(x => x.acct6 === acct6); return a ? accName(a) : acct6; };
const PREFIX_BY_SCHOOL = { '기숙 QUETTA': '학원_', '퀀텀1': '퀀텀1_', '퀀텀2': '퀀텀2_', '이천DS연수원': '이천DS_', '양양DS연수원': '양양DS_' };
const defaultPrefix = a => PREFIX_BY_SCHOOL[String(a.school || '').trim()] || '';
const prefixOfAcc = a => a ? (a.prefix !== undefined && a.prefix !== null ? a.prefix : defaultPrefix(a)) : '';
const allPrefixes = () => [...new Set(S.accounts.map(prefixOfAcc).filter(Boolean))];
PREFIX_OF.fn = t => {
  const a = S.accounts.find(x => x.acct6 === t.acct6), p = prefixOfAcc(a), d = defaultLabel(t);
  if (!p || allPrefixes().some(x => d.startsWith(x))) return '';
  return p;
};
const RULE_MONTH = { cur: 0, prev: -1, next: 1 };
const ruleMonthTag = (rule, t) => { const off = RULE_MONTH[rule.month]; if (off === undefined || !t.date) return ''; const d = new Date(+t.date.slice(0, 4), +t.date.slice(5, 7) - 1 + off, 1); return `${d.getMonth() + 1}월 `; };
const ruleLabelFor = (rule, t) => (rule.pfx ? prefixOfAcc(S.accounts.find(x => x.acct6 === t.acct6)) : '') + ruleMonthTag(rule, t) + rule.label;
const accOrder = () => new Map(S.accounts.map((a, i) => [a.acct6, i]));

async function getMonth(ym, force) {
  if (S.months[ym] && !force) return S.months[ym];
  const days = daysOf(ym), from = days[0], to = days[days.length - 1];
  const docId = firebase.firestore.FieldPath.documentId();
  const [ts, ms, op, sl] = await Promise.all([
    db.collection('txns').where('date', '>=', from).where('date', '<=', to).get(),
    db.collection('manual').where(docId, '>=', from).where(docId, '<=', to).get(),
    db.collection('openings').doc(ym).get(),
    db.collection('sales').where(docId, '>=', from).where(docId, '<=', to).get()
  ]);
  const m = { txns: new Map(), manual: {}, sales: {}, opening: op.exists ? op.data() : null };
  sl.forEach(d => m.sales[d.id] = d.data());
  ts.forEach(d => m.txns.set(d.id, { id: d.id, ...d.data() }));
  ms.forEach(d => m.manual[d.id] = d.data());
  S.months[ym] = m; computeTransfers([...m.txns.values()]); return m;
}
function findTx(id) { for (const m of Object.values(S.months)) if (m.txns.has(id)) return m.txns.get(id); if (S.tx.list) return S.tx.list.find(t => t.id === id); }

/* ---------- 하루치 집계 ---------- */
function dayFlows(ym, date) {
  const m = S.months[ym], am = accMap(), order = accOrder();
  const txs = [...m.txns.values()].filter(t => t.date === date && am.has(t.acct6)).sort(cmpTx);
  const man = m.manual[date] || {};
  const acctIn = {}, acctOut = {}; let cashIn = 0, cashOut = 0;
  const inRows = [], outRows = [], groups = {};
  for (const t of txs) {
    const a = am.get(t.acct6);
    for (const [dir, amt, rows, bucket] of [['in', num(t.inAmt), inRows, acctIn], ['out', num(t.outAmt), outRows, acctOut]]) {
      if (!amt) continue;
      bucket[t.acct6] = (bucket[t.acct6] || 0) + amt;
      const ar = !t.groupId && !t.autoOut ? (S.autoGroups.rules || []).find(x => autoRuleHit(x, t, dir, S.autoGroups)) : null;
      if (ar) {
        const k = `auto:${t.acct6}:${dir}:${ar.name}`;
        if (!groups[k]) { groups[k] = { dir, subject: a.subject, label: ar.name, acct6: t.acct6, amt: 0, ord: order.get(t.acct6), time: t.time, members: [], autoKey: k, ckey: `${t.acct6}:${dir}:${ar.name}`, kind: (ar.match || 'card') === 'card' ? '카드 입금' : `‘${ar.word}’ ${dir === 'in' ? '입금' : '출금'}` }; rows.push(groups[k]); }
        groups[k].amt += amt; groups[k].members.push(t);
      } else if (t.groupId) {
        const k = dir + t.groupId;
        if (!groups[k]) { groups[k] = { dir, subject: a.subject, label: t.groupLabel || rowLabel(t), acct6: t.acct6, amt: 0, ord: order.get(t.acct6), time: t.time, members: [], groupId: t.groupId }; rows.push(groups[k]); }
        groups[k].amt += amt; groups[k].members.push(t);
      } else rows.push({ dir, subject: a.subject, label: rowLabel(t), acct6: t.acct6, amt, ord: order.get(t.acct6), time: t.time, members: [t], pulledOut: !!t.autoOut });
    }
  }
  for (const [dir, list, rows, bucket] of [['in', man.inRows || [], inRows, acctIn], ['out', man.outRows || [], outRows, acctOut]]) {
    for (const r of list) {
      const amt = num(r.amt); if (!amt && !r.label) continue;
      const isCash = r.acct6 === 'cash' || !am.has(r.acct6);
      if (isCash) { if (dir === 'in') cashIn += amt; else cashOut += amt; }
      else bucket[r.acct6] = (bucket[r.acct6] || 0) + amt;
      rows.push({ dir, subject: isCash ? '현금' : am.get(r.acct6).subject, label: r.label || '', acct6: isCash ? '' : r.acct6, amt, ord: isCash ? 999 : order.get(r.acct6), time: '99', manual: r });
    }
  }
  const sorter = (a, b) => a.ord - b.ord || String(a.time).localeCompare(String(b.time));
  inRows.sort(sorter); outRows.sort(sorter);
  // 직접 정한 순서가 있으면 그 순서로 (새로 생긴 줄은 뒤에)
  for (const [dir, rows] of [['in', inRows], ['out', outRows]]) {
    const ord = ((man.order || {})[dir] || []), pos = new Map(ord.map((k, i) => [k, i]));
    if (!ord.length) continue;
    const base = new Map(rows.map((r, i) => [r, i]));
    rows.sort((a, b) => (pos.has(rowKeyOf(a)) ? pos.get(rowKeyOf(a)) : 1e6 + base.get(a)) - (pos.has(rowKeyOf(b)) ? pos.get(rowKeyOf(b)) : 1e6 + base.get(b)));
  }
  const ex = { sales: clone(man.sales || {}), people: clone(man.people || {}), bond: clone(man.bond || {}), loan: clone(man.loan || {}), borrow: clone(man.borrow || {}) };
  (man.entries || []).forEach(en => {
    const [top, ...rest] = en.key.split('.'), keys = rest.map(decodeURIComponent);
    let o = ex[top]; if (!o) return;
    keys.slice(0, -1).forEach(k => o = o[k] = o[k] || {});
    const last = keys[keys.length - 1]; o[last] = num(o[last]) + num(en.amt);
  });
  const up = (m.sales || {})[date];
  if (up) SALES_ROWS.forEach(([k]) => { if (up[k]) ex.sales[k] = { cash: num(up[k].cash), dep: num(up[k].dep), card: num(up[k].card) }; });
  // 현금·유안타와 오간 대체 → 반대편을 '가입력'으로 (확인 전에는 합계에 들어가지 않아요)
  const pendIn = [], pendOut = [], done = new Set([...(man.inRows || []), ...(man.outRows || [])].map(r => r.srcTx).filter(Boolean)), dismissed = new Set(man.dismissXfer || []);
  const cmaAcct = (S.accounts.find(a => a.acct6 === '320112') || S.accounts.find(a => a.subject === '기타제예금') || {}).acct6;
  txs.forEach(t => {
    const kind = XKIND.get(t.id); if (!kind || done.has(t.id) || dismissed.has(t.id)) return;
    const bankDir = XFER.get(t.id), dir = bankDir === 'out' ? 'in' : 'out', amt = num(bankDir === 'out' ? t.outAmt : t.inAmt);
    const pfx = prefixOfAcc(am.get(t.acct6));
    const row = { dir, pending: true, srcTx: t.id, kind, amt, acct6: kind === 'cash' ? '' : cmaAcct, subject: kind === 'cash' ? '현금' : ((am.get(cmaAcct) || {}).subject || '기타제예금'), label: pfx + (dir === 'in' ? '대체입금' : '대체출금'), from: t };
    (dir === 'in' ? pendIn : pendOut).push(row);
  });
  return { acctIn, acctOut, cashIn, cashOut, inRows, outRows, pendIn, pendOut, ...ex, txs, man, salesUp: up || null };
}

function timeline(ym) {
  const m = S.months[ym], op = m.opening || {};
  const acc = {}; S.accounts.forEach(a => acc[a.acct6] = num((op.accts || {})[a.acct6]));
  let cash = num(op.cash), bond = num(op.bond), loan = num(op.loan), people = num(op.people);
  const sales = {}; SALES_ROWS.forEach(([k]) => { const c = (op.salesCum || {})[k] || {}; sales[k] = { cash: num(c.cash), dep: num(c.dep), card: num(c.card) }; });
  const bor = {}; S.borrow.forEach(b => bor[b.name] = num((op.borrow || {})[b.name]));
  const days = {};
  for (const date of daysOf(ym)) {
    const f = dayFlows(ym, date);
    days[date] = { date, f, open: { acc: { ...acc }, cash, bond, loan, people, salesCum: clone(sales), bor: { ...bor } } };
    S.accounts.forEach(a => acc[a.acct6] += num(f.acctIn[a.acct6]) - num(f.acctOut[a.acct6]));
    cash += f.cashIn - f.cashOut;
    bond += num(f.bond.in) - num(f.bond.out); loan += num(f.loan.in) - num(f.loan.out);
    people += num(f.people.reg) - num(f.people.refund);
    SALES_ROWS.forEach(([k]) => ['cash', 'dep', 'card'].forEach(x => sales[k][x] += num((f.sales[k] || {})[x])));
    S.borrow.forEach(b => { const io = f.borrow[b.name] || {}; bor[b.name] += num(io.in) - num(io.repay); });
  }
  return { days, close: { acc, cash, bond, loan, people, bor }, hasOpening: !!m.opening };
}
function lastBalances(ym, date) {
  const out = {};
  [...S.months[ym].txns.values()].filter(t => t.date === date).sort(cmpTx).forEach(t => out[t.acct6] = num(t.bal));
  return out;
}

/* 예전에 쓴 내역 이름 (자동 추천) */
function labelHints() {
  const s = new Set();
  Object.values(S.rules).forEach(r => r.label && s.add(r.label));
  (S.groupNames || []).forEach(x => s.add(x));
  (S.autoGroups.rules || []).forEach(r => r.name && s.add(r.name));
  Object.values(S.months).forEach(m => {
    m.txns.forEach(t => { if (t.label) s.add(t.label); if (t.groupLabel) s.add(t.groupLabel); });
    Object.values(m.manual).forEach(d => ['inRows', 'outRows', 'entries'].forEach(k => (d[k] || []).forEach(r => r.label && s.add(r.label))));
  });
  return [...s];
}
/* 두 글자 이상 치면 예전에 쓴 내역 추천 */
const SG = { el: null, input: null, idx: -1, items: [] };
function hideSugg() { if (SG.el) SG.el.remove(); SG.el = null; SG.input = null; SG.idx = -1; }
function showSugg(input) {
  const v = input.value.trim();
  if (v.length < 2) return hideSugg();
  const low = v.toLowerCase();
  const src = input.dataset.suggest === 'parties' ? [...new Set([...(S.searchAlias || []).map(a => a.term), ...(VP.parties || [])])] : input.dataset.suggest === 'vendors' ? [...new Set([...(S.searchAlias || []).map(a => a.term), ...(VENDORS || []).flatMap(v => [v.name, ...(v.aliases || [])]), ...((typeof IV !== 'undefined' && IV.invs) || []).map(i => i.vendorName)].filter(Boolean))] : labelHints();
  const items = src.filter(x => x.toLowerCase().includes(low) && x !== v)
    .sort((a, b) => (a.toLowerCase().indexOf(low) - b.toLowerCase().indexOf(low)) || a.length - b.length).slice(0, 8);
  if (!items.length) return hideSugg();
  if (!SG.el) { SG.el = document.createElement('div'); SG.el.className = 'sugg'; document.body.appendChild(SG.el); }
  SG.input = input; SG.items = items; SG.idx = -1;
  const r = input.getBoundingClientRect();
  Object.assign(SG.el.style, { left: (r.left + window.scrollX) + 'px', top: (r.bottom + window.scrollY + 2) + 'px', minWidth: r.width + 'px' });
  SG.el.innerHTML = items.map((x, i) => { const k = x.toLowerCase().indexOf(low); return `<div data-i="${i}">${esc(x.slice(0, k))}<mark>${esc(x.slice(k, k + v.length))}</mark>${esc(x.slice(k + v.length))}</div>`; }).join('');
  SG.el.onmousedown = e => { const d = e.target.closest('[data-i]'); if (!d) return; e.preventDefault(); pickSugg(+d.dataset.i); };
}
function pickSugg(i) {
  const input = SG.input, val = SG.items[i]; hideSugg();
  if (!input) return;
  input.value = val; input.focus();
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('[data-suggest]')) showSugg(e.target); });
document.addEventListener('focusout', e => { if (e.target === SG.input) setTimeout(() => { if (document.activeElement !== SG.input) hideSugg(); }, 120); });
document.addEventListener('keydown', e => {
  if (!SG.el || e.target !== SG.input) return;
  const n = SG.items.length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SG.idx = (SG.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; SG.el.querySelectorAll('[data-i]').forEach((d, i) => d.classList.toggle('on', i === SG.idx)); }
  else if (e.key === 'Enter' && SG.idx >= 0) { e.preventDefault(); e.stopImmediatePropagation(); pickSugg(SG.idx); }
  else if (e.key === 'Escape') hideSugg();
}, true);
window.addEventListener('scroll', hideSugg, true);

/* 직접 입력 항목 목록 */
function manualItems() {
  const g = [
    ['현금·계좌', [['cashIn', '현금입금'], ['cashOut', '현금출금'], ['acctIn', '계좌입금 (은행 내역 없는 계좌)'], ['acctOut', '계좌출금 (은행 내역 없는 계좌)']]],
    ['차입금', S.borrow.flatMap(b => { const k = encodeURIComponent(b.name); return [[`borrow.${k}.in`, `차입금 · ${b.name} · 차입`], [`borrow.${k}.repay`, `차입금 · ${b.name} · 상환`], [`borrow.${k}.interest`, `차입금 · ${b.name} · 이자`]]; })]
  ];
  return g;
}
const itemLabel = key => { const sm = String(key).match(/^sales\.(\w+)\.(\w+)$/); if (sm) return `매출 · ${(SALES_ROWS.find(x => x[0] === sm[1]) || [, sm[1]])[1]} · ${({ cash: '현금', dep: '예금', card: '카드' })[sm[2]] || sm[2]}`; if (key === 'people.reg') return '인원 · 등록'; if (key === 'people.refund') return '인원 · 환불'; for (const [, list] of manualItems()) for (const [k, l] of list) if (k === key) return l; return key; };

function manualPanelHtml(f, op) {
  const man = f.man || {}, am = accMap(), v = x => wonOrBlank(x);
  const rows = [];
  (man.inRows || []).forEach(r => rows.push({ kind: 'in', r, item: r.acct6 === 'cash' || !am.has(r.acct6) ? '현금입금' : `계좌입금 · ${accNameOf(r.acct6)}` }));
  (man.outRows || []).forEach(r => rows.push({ kind: 'out', r, item: r.acct6 === 'cash' || !am.has(r.acct6) ? '현금출금' : `계좌출금 · ${accNameOf(r.acct6)}` }));
  (man.entries || []).forEach(r => rows.push({ kind: 'entry', r, item: itemLabel(r.key) }));
  // 이전 방식으로 입력한 값 (칸 입력)
  const legacy = [];
  const walk = (obj, path) => Object.entries(obj || {}).forEach(([k, val]) => { if (val && typeof val === 'object') walk(val, [...path, k]); else if (num(val)) legacy.push({ key: [path[0], ...path.slice(1).map(encodeURIComponent), encodeURIComponent(k)].join('.'), amt: num(val) }); });
  ['sales', 'borrow'].forEach(t => walk(man[t], [t]));
  const isPeople = k => String(k).startsWith('people.');
  const list = rows.map(({ kind, r, item }) => {
    const amtAttr = kind === 'entry' ? `data-act="e-amt" data-id="${r.id}"` : `data-act="m-amt" data-dir="${kind}" data-id="${r.id}"`;
    const lblAttr = kind === 'entry' ? `data-act="e-label" data-id="${r.id}"` : `data-act="m-label" data-dir="${kind}" data-id="${r.id}"`;

  }).concat(legacy.map(l => `<tr><td class="item">${esc(itemLabel(l.key))}</td><td class="hint">이전 방식으로 입력한 값</td><td class="amt num">${won(l.amt)}${isPeople(l.key) ? '명' : ''}</td><td><button class="btn ghost sm" data-act="legacy-del" data-key="${l.key}">삭제</button></td></tr>`)).join('');
  S.mItems = S.mItems || {};
  const acctOpts = S.accounts.slice().sort((a, b) => (b.acct6 === '320112') - (a.acct6 === '320112')).map(a => `<option value="${a.acct6}" ${S.mAcct === a.acct6 ? 'selected' : ''}>${esc(accName(a))}</option>`).join('');
  const lines = manualItems().filter(([, items]) => items.length).map(([g, items], gi) => {
    const sel = S.mItems[gi] || items[0][0], needAcct = sel === 'acctIn' || sel === 'acctOut';

    return `<div class="madd" data-g="${gi}">

      <button class="btn primary sm" data-act="m-add" data-g="${gi}">추가</button>
    </div>`;
  }).join('');
  return `<div class="mpanel">
    <h2>직접 입력 <span class="hint" style="font-weight:400">현금·매출·채권처럼 은행 내역에 없는 항목</span></h2>
    ${rows.length || legacy.length ? `<div class="scroll"><table class="mlist"><tbody>${list}</tbody></table></div>` : '<p class="hint">아직 직접 입력한 항목이 없어요.</p>'}

  else if (act === 'day-unconfirm') unconfirmDay();

  else if (act === 'acheck') setAutoCheck(b.dataset.acct, { by: S.user.email, at: Date.now(), count: +b.dataset.count, sum: +b.dataset.sum }, b.dataset.key);
  else if (act === 'auncheck') setAutoCheck(b.dataset.acct, null, b.dataset.key);

function normDate(v) {
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; }
  const s = String(v).trim(), m = s.match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
}
function normTime(v) {
  if (typeof v === 'number') { const t = Math.round((v % 1) * 86400); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; }
  return String(v || '').trim();
}

async function startBulk(files) {
  await loadVendorsCfg();
  BU.queue = [];
  for (const file of files) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' })
      .filter(r => digits(r[1]).length >= 8 && num(r[2]) > 0)
      .map(r => ({ code: digits(r[0]).padStart(3, '0'), acct: String(r[1]).trim(), amt: num(r[2]), holder: String(r[3] || '').trim(), memo: String(r[7] || '').trim() }));
    if (!rows.length) { toast(`${file.name}: 은행코드·계좌번호·금액 순서의 이체 줄이 없어요`); continue; }
    BU.queue.push({ name: file.name, rows, total: rows.reduce((s, x) => s + x.amt, 0) });
  }
  const s = await db.collection('txns').where('date', '==', BU.date).get();
  BU.txs = []; s.forEach(d => BU.txs.push({ id: d.id, ...d.data() }));
  nextBulk();
}
function nextBulk() {
  const f = BU.queue.shift(); if (!f) return;
  const isBulk = t => /대량|다계좌/.test(`${t.party || ''} ${t.memo || ''} ${t.memo1 || ''} ${t.memo2 || ''}`);
  const outs = BU.txs.filter(t => num(t.outAmt) > 0 && !t.bulkFile);
  const cands = outs.filter(isBulk).sort((a, b) => (num(b.outAmt) === f.total) - (num(a.outAmt) === f.total));

  };
}
async function linkBulk(f, tx) {
  refreshBizMap();
  const key = r => `${digits(r.acct)}|${num(r.amt)}`;
  const fileKeys = f.rows.map(key);
  // 1) 세금계산서 화면에서 만든 '이체 예정' 묶음 찾기: 합계가 같거나 줄이 가장 많이 겹치는 것
  const bs = []; (await db.collection('batches').where('status', 'in', ['planned', 'file']).get()).forEach(d => bs.push({ id: d.id, ...d.data() }));
  const overlap = b => { const left = [...fileKeys]; let n = 0; (b.items || []).forEach(it => { const k = key(it), i = left.indexOf(k); if (i >= 0) { n++; left.splice(i, 1); } }); return n; };
  let b = bs.find(x => num(x.total) === f.total) || bs.map(x => [x, overlap(x)]).filter(([, n]) => n >= Math.max(1, f.rows.length * 0.5)).sort((a, c) => c[1] - a[1]).map(x => x[0])[0];
  const ops = [], paidIds = [];
  if (b) {
    const left = [...fileKeys];
    b.items.forEach(it => { const i = left.indexOf(key(it)); if (i >= 0) { left.splice(i, 1); if (it.invId) paidIds.push(it.invId); } else if (it.invId) ops.push(x => x.update(db.collection('invoices').doc(it.invId), { status: 'unpaid', batchId: null })); });
  } else {
    // 2) 묶음이 없으면 파일 줄로 미지급 계산서를 찾아 새 묶음을 만들어요
    const pool = []; (await db.collection('invoices').where('status', 'in', ['unpaid', 'review', 'planned']).get()).forEach(d => { const x = { id: d.id, ...d.data() }; if (x.kind === 'buy' && !x.voided) pool.push(x); });
    pool.sort((a, c) => String(a.date).localeCompare(c.date));
    const used = new Set(), items = [];
    for (const r of f.rows) {
      const nh = normName(r.holder);
      let inv = pool.find(i => !used.has(i.id) && num(i.total) === r.amt && bankOf(i) && digits(bankOf(i).acct) === digits(r.acct));
      if (!inv) inv = pool.find(i => !used.has(i.id) && num(i.total) === r.amt && nh && invNames(i, vendorOf(i)).some(n => n === nh || nh.includes(n) || n.includes(nh)));
      if (inv) { used.add(inv.id); paidIds.push(inv.id); }
      items.push({ invId: inv ? inv.id : null, ...r });
    }
    const ref = db.collection('batches').doc();
    b = { id: ref.id, ym: ymOf(BU.date), date: BU.date, items, total: f.total, status: 'planned', fileName: f.name, createdAt: TS(), by: S.user.email };
    const { id, ...data } = b; ops.push(x => x.set(ref, data));
  }
  const p = { status: 'paid', matchType: 'batch', lock: true, matchTxIds: [tx.id], matchDate: tx.date, bankMatch: true, suggest: null, batchId: b.id,
    matchText: `대량이체 ${f.rows.length}건 (${tx.date}) · 확인 ${initialOf(S.user.email)}`, payWay: '대량이체', checkedBy: S.user.email, checkedAt: Date.now() };
  ops.push(x => x.update(db.collection('batches').doc(b.id), { status: 'paid', manual: true, txId: tx.id, payDate: tx.date, fileName: f.name }));
  paidIds.forEach(id => ops.push(x => x.update(db.collection('invoices').doc(id), p)));
  ops.push(x => x.update(db.collection('txns').doc(tx.id), { bulkItems: f.rows, bulkFile: f.name, bulkBatchId: b.id }));
  await commitBatches(ops);
  tx.bulkFile = f.name; tx.bulkItems = f.rows;
  IV.invs = null; S.tx.list = null; S.months = {}; refreshDue();
  return paidIds.length;
}

async function parseSalesFiles(files) {
  const out = [];
  for (const file of files) {
    const f = { name: file.name, site: SALES_SITE(file.name), byDate: {}, cash: 0, dep: 0, card: 0, days: 0, lastAt: '' };
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
      const hi = rows.findIndex(r => r.map(x => String(x).trim()).includes('결제일자') && r.map(x => String(x).trim()).includes('가상계좌'));
      if (hi < 0) throw new Error('결제일자·가상계좌 머리글이 없어요');
      const H = rows[hi].map(x => String(x).trim()), c = n => H.indexOf(n);
      rows.slice(hi + 1).forEach(r => {
        const raw = r[c('결제일자')], d = normDate(raw); if (!d) return;   // 소계 줄은 날짜가 없어서 빠져요
        const at = typeof raw === 'number' ? XLSX.SSF.format('yyyy-mm-dd hh:mm:ss', raw) : String(raw).trim();
        if (at > f.lastAt) f.lastAt = at;
        const x = f.byDate[d] = f.byDate[d] || { cash: 0, dep: 0, card: 0 };
        x.cash += num(r[c('현금')]); x.dep += num(r[c('가상계좌')]) + num(r[c('은행')]); x.card += num(r[c('카드')]);
      });
      const ds = Object.keys(f.byDate).sort(); f.days = ds.length; f.from = ds[0]; f.to = ds[ds.length - 1];
      ds.forEach(d => { f.cash += f.byDate[d].cash; f.dep += f.byDate[d].dep; f.card += f.byDate[d].card; });
    } catch (e) { f.err = e.message; }
    out.push(f);
  }
  S.salesPending = { files: out }; renderSalesUpload();
}
async function saveSales() {
  const ops = [];
  S.salesPending.files.filter(f => f.site && f.days).forEach(f => Object.entries(f.byDate).forEach(([d, x]) => {
    ops.push(b => b.set(db.collection('sales').doc(d), { [f.site]: { cash: Math.round(x.cash), dep: Math.round(x.dep), card: Math.round(x.card), file: f.name, at: Date.now(), by: S.user.email } }, { merge: true }));

}

async function parseOneUpload(file, fi) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  const hi = rows.findIndex(r => r.map(x => String(x).trim()).includes('계좌번호') && r.map(x => String(x).trim()).includes('입금액'));
  if (hi < 0) throw new Error('계좌번호·입금액 머리글이 없어요');
  const H = rows[hi].map(h => String(h).trim()), col = n => H.indexOf(n);
  const data = rows.slice(hi + 1).filter(r => String(r[col('계좌번호')] || '').trim() && String(r[col('거래일자')] || '').trim());
  const N = data.length, seen = new Set();
  return data.map((r, i) => {
    const g = n => { const k = col(n); return k < 0 ? '' : r[k]; }, s = n => String(g(n) ?? '').trim();
    const t = { site: s('사업장'), bank: s('금융기관'), acctNo: s('계좌번호'), acct6: acct6(g('계좌번호')), alias: s('계좌별칭'),
      date: normDate(g('거래일자')), time: normTime(g('거래시간')), inAmt: num(g('입금액')), outAmt: num(g('출금액')), bal: num(g('잔액')),
      dayBal: num(g('일자잔액')), periodBal: num(g('기간잔액')), memo: s('적요'), memo1: s('적요1'), memo2: s('적요2'), branch: s('취급점'),
      party: s('의뢰인/수취인'), note: s('비고'), ord: N - i, fi };
    let id = makeId(t); while (seen.has(id)) id += '_d'; seen.add(id); t.id = id;
    return t;
  }).filter(t => t.date);
}
async function parseUploads(fileList) {
  const am = accMap(), unknown = new Set(), files = [], errors = [], byId = new Map();
  for (const [fi, file] of fileList.entries()) {
    try {
      const txs = await parseOneUpload(file, fi);
      files.push({ name: file.name, count: txs.length });
      txs.forEach(t => { if (!byId.has(t.id)) byId.set(t.id, t); if (!am.has(t.acct6)) unknown.add(`${t.acctNo}${t.alias ? ' (' + t.alias + ')' : ''}`); });
    } catch (e) { errors.push(`${file.name} (${e.message})`); files.push({ name: file.name, count: 0 }); }
  }
  const txs = [...byId.values()].sort((a, b) => -cmpTx(a, b));
  if (!txs.length) throw new Error('읽을 수 있는 거래가 없어요. 수시입출계좌 원본 파일인지 확인해 주세요');
  const dates = txs.map(t => t.date).sort(), min = dates[0], max = dates[dates.length - 1];
  const exist = new Set(); (await db.collection('txns').where('date', '>=', min).where('date', '<=', max).get()).forEach(d => exist.add(d.id));
  const newIds = new Set(txs.filter(t => !exist.has(t.id)).map(t => t.id));
  S.pending = { files, errors, txs, newIds, newCount: newIds.size, min, max, unknown: [...unknown] };
  renderUpload();
}

      ${e.mode === 'range' ? `<input type="date" class="in" id="expFrom" value="${e.from}"> ~ <input type="date" class="in" id="expTo" value="${e.to}">` : ''}
      ${e.mode === 'month' ? `<input type="month" class="in" id="expYm" value="${e.ym}"><span class="hint">1일부터 말일까지 일자별 시트 + 자금현황 시트</span>` : ''}
    </div>
    <label class="row"><input type="checkbox" id="expLedger" ${e.ledger ? 'checked' : ''}> 해당 기간 수시입출 내역을 ‘통합내역’ 시트로 함께 넣기</label>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="expGo">엑셀 만들기</button></div>
  </div>`;
  $('#expMode').onclick = ev => { const b = ev.target.closest('button'); if (b) { e.mode = b.dataset.m; renderExport(); } };
  $('#expGo').onclick = () => {
    if ($('#expDate')) e.date = $('#expDate').value;
    if ($('#expFrom')) { e.from = $('#expFrom').value; e.to = $('#expTo').value; }
    if ($('#expYm')) e.ym = $('#expYm').value;
    e.ledger = $('#expLedger').checked;
    busy(doExport);
  };
}

async function doExport() {
  const e = S.exp; let from, to;
  if (e.mode === 'day') from = to = e.date;
  else if (e.mode === 'range') { from = e.from; to = e.to; }
  else { const d = daysOf(e.ym); from = d[0]; to = d[d.length - 1]; }
  if (!from || !to || from > to) return toast('날짜를 확인해 주세요');
  const dates = []; for (let d = from; d <= to; d = addDays(d, 1)) dates.push(d);
  if (dates.length > 92) return toast('한 번에 92일까지 받을 수 있어요');
  const yms = [...new Set(dates.map(ymOf))];
  for (const ym of yms) await getMonth(ym);
  const tls = Object.fromEntries(yms.map(ym => [ym, timeline(ym)]));
  const multiMonth = yms.length > 1;
  const wb = new ExcelJS.Workbook(); wb.creator = 'QUETTA 자금일보'; wb.calcProperties.fullCalcOnLoad = true;
  let prev = null, L = null; const names = [];
  for (const date of dates) {
    const ym = ymOf(date), day = tls[ym].days[date], [, mm, dd] = date.split('-').map(Number);
    const name = multiMonth ? `${mm}.${dd}` : String(dd);
    const prevName = prev && ymOf(prev.date) === ym && addDays(prev.date, 1) === date ? prev.name : null;
    L = writeDaySheet(wb, name, { date, prevName, accounts: S.accounts, borrow: S.borrow, extra: S.extra, open: day.open, f: day.f });
    prev = { date, name }; names.push(name);
  }
  if (e.mode === 'month') await addTemplateSheets(wb, { names, lastDate: to, L, accounts: S.accounts });
  if (e.ledger) {
    const list = []; yms.forEach(ym => S.months[ym].txns.forEach(t => { if (t.date >= from && t.date <= to) list.push(t); }));
    list.sort((a, b) => -cmpTx(a, b));
    writeLedgerSheet(wb, '통합내역', list, true);
  }
  const [y, m] = from.split('-');
  const fname = e.mode === 'month' ? `강남대성_QUETTA_${y.slice(2)}년_${+m}월_자금일보.xlsx`
    : e.mode === 'day' ? `강남대성_QUETTA_자금일보_${from.replace(/-/g, '')}.xlsx`
    : `강남대성_QUETTA_자금일보_${from.replace(/-/g, '')}-${to.replace(/-/g, '')}.xlsx`;
  await saveWb(wb, fname);
  if (yms.some(ym => !tls[ym].hasOpening)) toast('월초 이월잔액이 없는 달이 있어 전일이월이 0원으로 들어갔어요');
}
async function saveWb(wb, name) {
  try { alignMiddle(wb); } catch (e) { console.error(e); }
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* 규칙이 바뀌면 이미 자동으로 들어간 내역도 다시 맞춰요 (확인한 자금일보 날짜는 그대로) */
async function reapplyRule(k) {
  const r = S.rules[k]; if (!r || !r.acct6) return 0;
  const txs = []; (await db.collection('txns').where('memo1', '==', r.memo1).where('party', '==', r.party).get()).forEach(d => txs.push({ id: d.id, ...d.data() }));
  const hit = txs.filter(t => t.acct6 === r.acct6 && txDir(t) === r.dir && t.labelSrc === 'rule');
  const dates = [...new Set(hit.map(t => t.date))], locked = new Set();
  for (const d of dates) { const m = await db.collection('manual').doc(d).get(); if (m.exists && m.data().confirmed) locked.add(d); }
  const upd = hit.filter(t => !locked.has(t.date) && t.label !== ruleLabelFor(r, t));
  await commitBatches(upd.map(t => b => b.update(db.collection('txns').doc(t.id), { label: ruleLabelFor(r, t) })));
  if (upd.length) { S.months = {}; S.tx.list = null; }
  return upd.length;
}

/* 예전 규칙(계좌 없음) → 직접 고친 계좌의 규칙으로 바꾸고, 다른 계좌에 잘못 들어간 내역 되돌리기 */
async function fixLegacyRules() {
  const legacy = Object.entries(S.rules).filter(([, r]) => !r.acct6);
  const plan = await busy(async () => {
    const out = { create: [], del: [], reset: [], left: [] };
    for (const [k, r] of legacy) {
      const txs = [];
      (await db.collection('txns').where('memo1', '==', r.memo1).where('party', '==', r.party).get()).forEach(d => txs.push({ id: d.id, ...d.data() }));
      if (!txs.length) (await db.collection('txns').where('memo', '==', r.memo1).where('party', '==', r.party).get()).forEach(d => txs.push({ id: d.id, ...d.data() }));
      const src = new Map(); txs.filter(t => t.labelSrc === 'manual').forEach(t => src.set(`${t.acct6}|${txDir(t)}`, t));
      if (!src.size) { out.left.push(r); continue; }
      src.forEach(t => out.create.push({ key: ruleKey(t), rule: { ...r, acct6: t.acct6, dir: txDir(t), updatedAt: TS() } }));
      txs.filter(t => t.labelSrc === 'rule' && !src.has(`${t.acct6}|${txDir(t)}`)).forEach(t => out.reset.push(t));
      out.del.push(k);
    }
    return out;
  });
  if (!plan) return;
  const msg = `예전 규칙 ${legacy.length}개를 정리할게요.\n\n· 계좌별 규칙으로 바꿈: ${plan.create.length}개\n· 다른 계좌에 잘못 들어간 내역 되돌림: ${plan.reset.length}건 (은행 내역 그대로로)\n· 직접 고친 기록을 못 찾은 규칙: ${plan.left.length}개 (자동 적용 안 함, 삭제하거나 다시 고쳐 주세요)\n\n진행할까요?`;
  if (!confirm(msg)) return;
  await busy(async () => {
    await commitBatches([
      ...plan.create.map(c => b => b.set(db.collection('rules').doc(c.key), c.rule)),
      ...plan.del.map(k => b => b.delete(db.collection('rules').doc(k))),
      ...plan.reset.map(t => b => b.update(db.collection('txns').doc(t.id), { label: null, labelSrc: null }))
    ]);
    plan.del.forEach(k => delete S.rules[k]); plan.create.forEach(c => S.rules[c.key] = c.rule);
    S.months = {}; S.tx.list = null;
    toast(`정리했어요 · 규칙 ${plan.create.length}개, 되돌린 내역 ${plan.reset.length}건`);
  });
  renderSettings();
}

<script>
// ==MATCH START==
/* ---------- 세금계산서 매칭 핵심 로직 ---------- */
const BANK_CODES = { '산업': '002', '기업': '003', '국민': '004', '수협': '007', '농협': '011', '지역농협': '012', '농축협': '012', '우리': '020', 'SC제일': '023', '제일': '023', '씨티': '027', '대구': '031', '부산': '032', '광주': '034', '제주': '035', '전북': '037', '경남': '039', '새마을': '045', '새마을금고': '045', '신협': '048', '저축': '050', '우체국': '071', '하나': '081', '신한': '088', '케이뱅크': '089', '카카오': '090', '카카오뱅크': '090', '토스': '092', '토스뱅크': '092', '산림': '064' };
const DEFAULT_MATCH = {
  buyDay: 10, sellDay: 31, myDisplay: '기숙QUETTA',
  ourBiz: [
    { biz: '607-85-41094', name: '강남대성기숙학원', accts: '' },
    { biz: '729-85-01903', name: '이천DS퀀텀라이브러리2', accts: '' },
    { biz: '711-85-01557', name: '이천DS연수원', accts: '566238' },
    { biz: '476-85-01673', name: '양양DS연수원', accts: '566225' }
  ]
};
const bizKey = s => String(s || '').replace(/\D/g, '');
const digits = s => String(s || '').replace(/\D/g, '');
const normName = s => String(s || '').normalize('NFKC').toLowerCase()
  .replace(/주식회사|유한회사|사단법인|재단법인|\(주\)|\(유\)|\(사\)|\(재\)|^주\)|^주\s|\s주\)|주\)$/g, '')
  .replace(/외\s*\d+\s*인/g, '').replace(/[\s()\[\]{}.,·:;\-_/\\'"&]+/g, '');
const learnName = s => normName(s).replace(/\d+$/, '');
const codeTokens = note => [...new Set((String(note || '').normalize('NFKC').toUpperCase().match(/[A-Z]\d{5,}/g) || []).map(t => t.slice(0, 5)))];
const txCodeText = t => `${t.party || ''}${t.memo1 || ''}${t.memo2 || ''}`.normalize('NFKC').toUpperCase().replace(/[\s()（）]/g, '');
const bankCodeOf = (name, code) => { const c = digits(code); if (c) return c.padStart(3, '0'); const n = String(name || '').replace(/은행$/, '').trim(); return BANK_CODES[n] || ''; };
const nextMonthDay = (date, day) => { const [y, m] = date.split('-').map(Number); const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1; const last = new Date(ny, nm, 0).getDate(); return `${ny}-${String(nm).padStart(2, '0')}-${String(Math.min(day, last)).padStart(2, '0')}`; };
function invWindow(inv, cfg) { const start = inv.date || `${inv.ym}-01`; return [start, nextMonthDay(start, inv.kind === 'sell' ? cfg.sellDay : cfg.buyDay)]; }

function invNames(inv, v) {
  const list = [inv.vendorName, inv.holder, ...String(inv.ceo || '').split(/[,/]/)];
  if (v) list.push(v.name, v.holder, ...(v.aliases || []), ...(inv.kind === 'sell' ? (v.inNames || []) : (v.outNames || [])));
  return [...new Set(list.map(normName).filter(n => n.length >= 2))];
}
function nameHit(names, t) {
  const fields = [normName(t.party), normName(t.memo1)];
  return names.some(n => fields.some((f, i) => f && (f.includes(n) || (f.length >= 3 && n.includes(f) && (i === 0 || f.length >= 4)))));
}
function codeHit(inv, t) { const toks = codeTokens(inv.note); if (!toks.length) return false; const tx = txCodeText(t); return toks.some(k => tx.includes(k)); }

/* invs: 해당 월 계산서 / txns: 기간 내 거래 / vendorOf(inv) / batches / cfg
   반환: { inv: Map(id→patch), batch: Map(id→patch), suggest: {batchId:[{txId,amt,missing:[invIds]}]} } */
function runMatch(invs, txns, vendorOf, batches, cfg) {
  const out = { inv: new Map(), batch: new Map(), suggest: {} };
  const st = new Map(invs.map(i => [i.id, { ...i }]));
  const patch = (id, p) => { Object.assign(st.get(id), p); out.inv.set(id, { ...(out.inv.get(id) || {}), ...p }); };
  const used = new Set();
  invs.forEach(i => { if (i.status === 'paid') (i.matchTxIds || []).forEach(x => used.add(x)); });
  batches.forEach(b => { if (b.txId) used.add(b.txId); });
  const sorted = [...txns].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || (a.ord || 0) - (b.ord || 0));
  const outs = sorted.filter(t => t.outAmt > 0), ins = sorted.filter(t => t.inAmt > 0);
  const amtOf = (t, kind) => kind === 'sell' ? t.inAmt : t.outAmt;
  const siteAccts = biz => { const o = (cfg.ourBiz || []).find(x => bizKey(x.biz) === bizKey(biz)); return o && o.accts ? String(o.accts).split(/[,\s]+/).filter(Boolean) : null; };
  const txOk = (inv, t) => { if (inv.kind !== 'sell') return true; const a = siteAccts(inv.ourBiz); return !a || a.includes(t.acct6); };
  const descr = t => `${t.date} ${t.party || t.memo1 || ''} ${Number(amtOf(t, t.inAmt > 0 ? 'sell' : 'buy')).toLocaleString('ko-KR')}`;

  // 0단계: 대량이체 묶음 = 합계와 같은 출금 한 줄
  for (const b of batches) {
    if (b.status !== 'planned') continue;
    const from = addDays(b.date, -45), to = addDays(b.date, 45);
    const inRange = t => !used.has(t.id) && t.date >= from && t.date <= to;
    const hit = outs.find(t => inRange(t) && t.outAmt === b.total);
    if (hit) {
      used.add(hit.id);
      out.batch.set(b.id, { status: 'paid', txId: hit.id, payDate: hit.date });
      b.items.forEach(it => { if (it.invId && st.has(it.invId)) patch(it.invId, { status: 'paid', matchType: 'batch', matchTxIds: [hit.id], matchDate: hit.date, matchText: `대량이체 ${b.items.length}건 일괄 (${hit.date})`, batchId: b.id }); });
      continue;
    }
    // 합계가 다르면: 빠진 건(1~2건) 추정
    const items = b.items.filter(it => it.invId);
    const sug = [];
    outs.filter(t => inRange(t) && t.outAmt < b.total && t.outAmt > b.total * 0.3).forEach(t => {
      const diff = b.total - t.outAmt;
      items.forEach((x, i) => { if (x.amt === diff) sug.push({ txId: t.id, txDate: t.date, amt: t.outAmt, missing: [x.invId] }); });
      if (!sug.some(s => s.txId === t.id)) for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) if (items[i].amt + items[j].amt === diff) sug.push({ txId: t.id, txDate: t.date, amt: t.outAmt, missing: [items[i].invId, items[j].invId] });
    });
    if (sug.length) out.suggest[b.id] = sug.slice(0, 5);
  }

  const open = () => [...st.values()].filter(i => !i.lock && (i.status === 'unpaid' || i.status === 'review' || !i.status));
  const vkey = i => { const v = vendorOf(i); return v ? 'v:' + v.id : 'n:' + normName(i.vendorName); };
  const prevYm = ym => { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; };
  // 계산서가 끊긴 달의 정기 이체일(1~N일) 무렵 출금 → 전월분일 수 있음
  const earlyRisk = (inv, t) => inv.kind === 'buy' && inv.type !== '수기' && t.date.slice(0, 7) === inv.ym && Number(t.date.slice(8, 10)) <= cfg.buyDay;
  const earlySafe = (inv, t) => {
    const prev = [...st.values()].filter(p => p.kind === inv.kind && p.ym === prevYm(inv.ym) && vkey(p) === vkey(inv) && p.total === inv.total);
    return prev.length > 0 && prev.every(p => p.status === 'paid' && !(p.matchTxIds || []).includes(t.id));
  };
  // 1단계: 단건 (이름·고객번호 + 금액) — 오래된 계산서부터
  const order = open().sort((a, b) => String(a.date).localeCompare(String(b.date)) || (codeTokens(b.note).length - codeTokens(a.note).length));
  for (const inv of order) {
    const [from, to] = invWindow(inv, cfg), names = invNames(inv, vendorOf(inv)), rej = new Set(inv.rejectTx || []);
    const pool = (inv.kind === 'sell' ? ins : outs).filter(t => !used.has(t.id) && !rej.has(t.id) && t.date >= from && t.date <= to && amtOf(t, inv.kind) === inv.total && txOk(inv, t));
    let best = null, score = 0;
    for (const t of pool) {
      let s = codeHit(inv, t) ? 3 : nameHit(names, t) ? 2 : 0;
      if (s && earlyRisk(inv, t) && !earlySafe(inv, t)) s = 0;
      if (s > score) { best = t; score = s; }
    }
    if (best) { used.add(best.id); patch(inv.id, { status: 'paid', matchType: score === 3 ? 'code' : 'single', matchTxIds: [best.id], matchDate: best.date, matchText: descr(best), reviewTxId: null }); }
  }
  // 2단계: 같은 거래처 여러 장 합산
  const groups = {};
  open().filter(i => i.status !== 'paid').forEach(i => { const v = vendorOf(i); const k = i.kind + '|' + (v ? v.id : normName(i.vendorName)); (groups[k] = groups[k] || []).push(i); });
  for (const list of Object.values(groups)) {
    if (list.length < 2) continue;
    const g = list.slice(0, 16), kind = g[0].kind, names = invNames(g[0], vendorOf(g[0]));
    const from = g.map(i => invWindow(i, cfg)[0]).sort()[0], to = g.map(i => invWindow(i, cfg)[1]).sort().pop();
    const sum = g.reduce((s, i) => s + i.total, 0);
    const pool = (kind === 'sell' ? ins : outs).filter(t => !used.has(t.id) && t.date >= from && t.date <= to && nameHit(names, t) && amtOf(t, kind) <= sum && txOk(g[0], t));
    const taken = new Set();
    for (const t of pool) {
      const target = amtOf(t, kind), n = g.length; let found = 0;
      for (let mask = 1; mask < (1 << n) && !found; mask++) {
        if ((mask & (mask - 1)) === 0) continue; // 2장 이상
        let s = 0, ok = true;
        for (let i = 0; i < n; i++) if (mask & (1 << i)) { if (taken.has(i)) { ok = false; break; } s += g[i].total; }
        if (ok && s === target) found = mask;
      }
      if (!found) continue;
      used.add(t.id);
      for (let i = 0; i < n; i++) if (found & (1 << i)) { taken.add(i); patch(g[i].id, { status: 'paid', matchType: 'combo', matchTxIds: [t.id], matchDate: t.date, matchText: `${descr(t)} (여러 장 합산)`, reviewTxId: null }); }
    }
  }
  // 3단계: 금액만 같은 건 → 확인 필요
  for (const inv of open()) {
    if (st.get(inv.id).status === 'paid') continue;
    const [from, to] = invWindow(inv, cfg), rej = new Set(inv.rejectTx || []);
    const c = (inv.kind === 'sell' ? ins : outs).find(t => !used.has(t.id) && !rej.has(t.id) && t.date >= from && t.date <= to && amtOf(t, inv.kind) === inv.total && txOk(inv, t));
    if (c) { const txt = descr(c) + (earlyRisk(inv, c) ? ' · 전월분일 수 있음' : ''); if (inv.status !== 'review' || inv.reviewTxId !== c.id || inv.matchText !== txt) patch(inv.id, { status: 'review', reviewTxId: c.id, matchText: txt }); }
    else if (inv.status !== 'unpaid') patch(inv.id, { status: 'unpaid', reviewTxId: null, matchText: '' });
  }
  return out;
}

/* 국민은행 대량이체 업로드 양식 (머리글 없음: A 은행코드, B 계좌번호, C 금액, D 받는분, E 내 표시, H 메모) */
function writeTransferSheet(wb, rows, myDisplay) {
  const ws = wb.addWorksheet('Sheet1');
  rows.forEach((r, i) => {
    const row = ws.getRow(i + 1);
    row.getCell(1).value = String(r.code || '').padStart(3, '0');
    row.getCell(2).value = String(r.acct || '');
    row.getCell(3).value = Number(r.amt) || 0; row.getCell(3).numFmt = '###,##0';
    row.getCell(4).value = String(r.holder || ''); row.getCell(4).numFmt = '@';
    row.getCell(5).value = String(myDisplay || ''); row.getCell(5).numFmt = '@';
    row.getCell(8).value = String(r.memo || '').slice(0, 20); row.getCell(8).numFmt = '@';
  });
  [6, 18, 12, 28, 12, 4, 4, 24].forEach((w, i) => ws.getColumn(i + 1).width = w);
  return ws;
}

<script>
/* =========================================================
   세금계산서 · 미지급금 · 미수금 / 거래처 계좌

const BANK_LIST = [['국민', '004'], ['신한', '088'], ['우리', '020'], ['하나', '081'], ['농협', '011'], ['지역농축협', '012'], ['기업', '003'], ['산업', '002'], ['수협', '007'], ['SC제일', '023'], ['씨티', '027'], ['대구', '031'], ['부산', '032'], ['광주', '034'], ['제주', '035'], ['전북', '037'], ['경남', '039'], ['새마을금고', '045'], ['신협', '048'], ['저축은행', '050'], ['산림조합', '064'], ['우체국', '071'], ['케이뱅크', '089'], ['카카오뱅크', '090'], ['토스뱅크', '092']];
const bankNameOf = code => { const b = BANK_LIST.find(x => x[1] === String(code || '').padStart(3, '0')); return b ? b[0] : String(code || ''); };
const md = d => d ? `${d.slice(5, 7)}.${d.slice(8, 10)}` : '';
const fmtBiz = s => { const d = digits(s); return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}` : String(s || '').trim(); };
const initialOf = email => (String(email || '').match(/[A-Za-z]/) || ['?'])[0].toUpperCase();
const shortTime = ms => { if (!ms) return ''; const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const STATUS_LABEL = { paid: '기지급', review: '확인 필요', unpaid: '미지급', planned: '이체 예정', excluded: '미지급외' };
const STATUS_LABEL_SELL = { paid: '입금완료', review: '확인 필요', unpaid: '미수', planned: '-', excluded: '미수외' };
const prevYm = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return ymOf(ymd(d)); };
const IV = { page: 0, ym: prevYm(), kind: 'buy', status: 'all', sortBy: 'date', onlyNew: false, lastUpload: null, q: '', sel: new Set(), invs: null, batches: null, txns: null, suggest: {}, pending: null, showCfg: false };
let VENDORS = null, MCFG = null;

async function loadVendorsCfg(force) {
  if (VENDORS && MCFG && !force) return;
  const [vs, cfg] = await Promise.all([db.collection('vendors').get(), db.collection('settings').doc('match').get()]);
  VENDORS = []; vs.forEach(d => VENDORS.push({ id: d.id, ...d.data() }));
  VENDORS.sort((a, b) => String(a.name).localeCompare(String(b.name)));
  MCFG = Object.assign(clone(DEFAULT_MATCH), cfg.exists ? cfg.data() : {});
}
const vById = id => VENDORS.find(v => v.id === id);
function bizMap() { const m = new Map(); VENDORS.forEach(v => (v.bizNos || []).forEach(b => m.set(bizKey(b), v))); return m; }
let _bizMap = null;
let _nameMap = null;
function nameMap() { const m = new Map(); VENDORS.forEach(v => [v.name, ...(v.aliases || [])].forEach(n => { const k = normName(n); if (k.length >= 2 && !m.has(k)) m.set(k, v); })); return m; }
const vendorOf = inv => (inv.vendorId && vById(inv.vendorId)) || (_bizMap || (_bizMap = bizMap())).get(bizKey(inv.vendorBiz)) || (_nameMap || (_nameMap = nameMap())).get(normName(inv.vendorName)) || null;
const refreshBizMap = () => { _bizMap = null; _nameMap = null; };
function bankOf(inv) {
  if (inv.acct) return { code: bankCodeOf(inv.bankName, inv.bankCode), acct: inv.acct, holder: inv.holder || inv.vendorName };
  const v = vendorOf(inv);
  if (v && v.acct) return { code: bankCodeOf(v.bank, v.bankCode), acct: v.acct, holder: v.holder || v.name };
  return null;
}

/* ---------- 데이터 로드 & 매칭 ---------- */
async function loadInvData() {
  await loadVendorsCfg();
  const shift = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const yms = [shift(IV.ym, -1), IV.ym, shift(IV.ym, 1)];
  const [is, bs, lu] = await Promise.all([
    db.collection('invoices').where('ym', 'in', yms).get(),
    db.collection('batches').where('ym', 'in', yms).get(),
    db.collection('invoiceUploads').orderBy('at', 'desc').limit(20).get()
  ]);
  IV.invs = []; is.forEach(d => IV.invs.push({ id: d.id, ...d.data() }));
  IV.batches = []; bs.forEach(d => IV.batches.push({ id: d.id, ...d.data() }));
  IV.uploads = []; lu.forEach(d => IV.uploads.push({ id: d.id, ...d.data() })); IV.lastUpload = IV.uploads[0] || null;
  const from = yms[0] + '-01';
  let to = nextMonthDay(nextMonthDay(IV.ym + '-01', 1), 31);
  IV.batches.forEach(b => { const e = addDays(b.date, 40); if (e > to) to = e; });
  const s = await db.collection('txns').where('date', '>=', from).where('date', '<=', to).get();
  IV.txns = []; s.forEach(d => IV.txns.push({ id: d.id, ...d.data() }));
  IV.sel.clear();
}
async function doMatch(silent) {
  refreshBizMap();
  const autoVoid = IV.invs.filter(i => i.voided && String(i.manualNote || '').startsWith('마이너스 계산서'));
  if (autoVoid.length) { const p = { status: 'unpaid', lock: false, voided: false, manualNote: '' }; await commitBatches(autoVoid.map(i => b => b.update(db.collection('invoices').doc(i.id), p))); autoVoid.forEach(i => Object.assign(i, p)); }
  // 발행 취소 후보: 마이너스 계산서와, 같은 업체·같은 금액의 원래 계산서 (자동 처리는 안 하고 모아서 보여주기만)
  IV.voidCands = new Set();
  const grp = {};
  IV.invs.forEach(i => { const k = `${i.kind}|${bizKey(i.vendorBiz)}|${Math.abs(num(i.total))}`; (grp[k] = grp[k] || []).push(i); });
  Object.values(grp).forEach(g => {
    const negs = g.filter(i => num(i.total) < 0); if (!negs.length) return;
    negs.forEach(i => IV.voidCands.add(i.id));
    const pos = g.filter(i => num(i.total) > 0);
    const near = d => Math.min(...negs.map(n => Math.abs(parseD(n.date || n.ym + '-01') - parseD(d || '2000-01-01'))));
    pos.sort((a, b) => near(a.date) - near(b.date) || String(a.date).localeCompare(b.date)).slice(0, negs.length).forEach(i => IV.voidCands.add(i.id));
  });
  // 예전에 자동으로 처리된 건은 미지급(또는 이체 예정)으로 되돌려요 — 이제 모든 처리는 담당자가 직접
  const AUTO = ['single', 'code', 'combo', 'batch'], mig = [];
  IV.invs.forEach(i => {
    let p = null;
    if (i.status === 'paid' && !i.lock && AUTO.includes(i.matchType)) p = { status: i.batchId ? 'planned' : 'unpaid', matchTxIds: [], matchText: '', matchType: null, matchDate: null };
    else if (i.status === 'review') p = { status: 'unpaid', reviewTxId: null };
    if (p) { mig.push(b => b.update(db.collection('invoices').doc(i.id), p)); Object.assign(i, p); }
  });
  IV.batches.forEach(b => { if (b.status === 'paid' && !b.manual) { const p = { status: 'planned', suggestTxId: b.txId || null, suggestDate: b.payDate || null, txId: null, payDate: null }; mig.push(x => x.update(db.collection('batches').doc(b.id), p)); Object.assign(b, p); } });

async function deleteInvUpload(id) {
  const u = (IV.uploads || []).find(x => x.id === id); if (!u) return;
  const invs = await busy(async () => {
    const out = []; (await db.collection('invoices').where('uploadId', '==', id).get()).forEach(d => out.push({ id: d.id, ...d.data() }));
    if (!out.length && u.at) {   // 예전 방식으로 올린 파일: 올린 시각 무렵에 같은 사람이 만든 계산서
      const at = u.at.toDate(), from = new Date(at.getTime() - 15 * 60000), to = new Date(at.getTime() + 60000);
      (await db.collection('invoices').where('createdAt', '>=', from).where('createdAt', '<=', to).get()).forEach(d => { const x = d.data(); if (x.by === u.by) out.push({ id: d.id, ...x }); });
    }
    return out;
  });
  if (!invs) return;
  if (!invs.length) { if (confirm(`이 업로드로 새로 들어온 계산서가 없어요 (모두 이미 있던 건).\n업로드 기록만 지울까요?`)) await busy(async () => { await db.collection('invoiceUploads').doc(id).delete(); IV.invs = null; renderInv(); }); return; }
  const sum = invs.reduce((s, i) => s + num(i.total), 0), paid = invs.filter(i => i.status === 'paid'), planned = invs.filter(i => i.status === 'planned');
  let msg = `‘${u.fileName}’로 새로 들어온 계산서 ${invs.length}건 (합계 ${won(sum)}원)을 삭제할까요?\n\n이미 있던 계산서는 그대로 두고, 이 파일로 처음 들어온 것만 지워요.`;
  if (paid.length) msg += `\n\n⚠ 이 중 ${paid.length}건은 이미 기지급으로 처리돼 있어요.`;
  if (planned.length) msg += `\n⚠ ${planned.length}건은 대량이체 묶음에 들어 있어요. 묶음에서 빼고 합계를 다시 계산해요.`;
  msg += '\n\n삭제하면 되돌릴 수 없어요.';
  if (!confirm(msg)) return;
  await busy(async () => {
    const ids = new Set(invs.map(i => i.id)), bs = [];
    (await db.collection('batches').get()).forEach(d => { const b = { id: d.id, ...d.data() }; if ((b.items || []).some(x => ids.has(x.invId))) bs.push(b); });
    const ops = bs.map(b => {
      const items = b.status === 'paid' ? b.items.map(x => ids.has(x.invId) ? { ...x, invId: null } : x) : b.items.filter(x => !ids.has(x.invId));
      return x => x.update(db.collection('batches').doc(b.id), { items, total: items.reduce((s, y) => s + num(y.amt), 0) });
    });
    await commitBatches([...ops, ...invs.map(i => x => x.delete(db.collection('invoices').doc(i.id))), x => x.delete(db.collection('invoiceUploads').doc(id))]);
    IV.invs = null; IV.sel.clear();
    toast(`${invs.length}건을 삭제했어요`);
  });
  renderInv(); refreshDue();
}

async function parseInvFiles(files) {

        const kind = sn.includes('매출') ? 'sell' : sn.includes('매입') ? 'buy' : (ourSet.has(bizKey(supBiz)) ? 'sell' : 'buy');
        const date = normDate(g('작성일자'));
        const flag = v => String(v || '').trim();
        invs.push({
          id: appr.replace(/\//g, '-'), approvalNo: appr, sheet: sn, kind, type: String(g('전자세금계산서분류') || (sn.includes('계산서') && !sn.includes('세금') ? '계산서' : '세금계산서')),

          vendorBiz: kind === 'sell' ? buyBiz : supBiz, vendorName: String(kind === 'sell' ? r[buyI] : r[supI]).trim(),
          ceo: String(kind === 'sell' ? (r[ceo2I] ?? '') : (r[ceoI] ?? '')).trim(),

          note: String(g('비고') || ''), item: String(g('품목명') || ''), raw: r.map(x => x === null || x === undefined ? '' : x),
          fileAccount: flag(g('계정명')), filePaid: flag(g('기지급여부')), fileExcl: flag(g('미지급외 처리'))
        });
      }
    } else if (mi >= 0) {
      const H = rows[mi].map(h => String(h).trim()), ix = n => H.indexOf(n); manualYm = IV.ym; headers[sn] = H;
      rows.slice(mi + 1).forEach((r, k) => {
        const g = n => { const c = ix(n); return c < 0 ? '' : r[c]; };
        const name = String(g('업체명')).trim(); if (!name) return;
        invs.push({
          id: `M-${IV.ym}-${String(g('NO') || k + 1)}-${normName(name).slice(0, 10)}`, sheet: sn, kind: 'buy', type: '수기', date: `${IV.ym}-01`, ym: IV.ym,

          raw: r.map(x => x === null || x === undefined ? '' : x), filePaid: String(g('완료여부') || '').trim(), fileExcl: '', fileAccount: ''
        });
      });

  }

}

  const ok = list.filter(bankOf), miss = list.filter(i => !bankOf(i)), zero = ok.filter(i => !num(i.total));

  const msg = `${use.length}건, ${won(total)}원으로 대량이체 파일을 만들까요?` + (miss.length ? `\n\n계좌가 없어 빠지는 건 ${miss.length}건: ${miss.slice(0, 5).map(i => i.vendorName).join(', ')}${miss.length > 5 ? ' 외' : ''}` : '') + (zero.length ? `\n금액이 0원인 ${zero.length}건도 빠져요.` : '');

    const items = use.map(i => { const bk = bankOf(i); return { invId: i.id, amt: num(i.total), code: bk.code, acct: bk.acct, holder: bk.holder, memo: i.memo || String(i.item || '').slice(0, 20) }; });
    const b = { ym: IV.ym, date: today(), items, total, status: 'file', createdAt: TS(), by: S.user.email };

    use.forEach(i => { i.fileBatchId = ref.id; i.fileAt = Date.now(); });

async function registerBatchFiles(files, date) {
  refreshBizMap();
  // 열려 있는 달과 상관없이, 아직 지급되지 않은 모든 매입 계산서에서 찾아요
  const snap = await db.collection('invoices').where('status', 'in', ['unpaid', 'review']).get();
  const pool = []; snap.forEach(d => { const loc = IV.invs.find(i => i.id === d.id); const x = loc || { id: d.id, ...d.data() }; if (x.kind === 'buy') pool.push(x); });
  pool.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const used = new Set(), results = [];
  for (const file of files) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' })
      .filter(r => digits(r[1]).length >= 8 && num(r[2]) > 0);
    if (!rows.length) { results.push({ name: file.name, rows: 0, linked: 0, total: 0, miss: ['은행코드·계좌번호·금액 순서의 이체 줄을 찾지 못했어요'] }); continue; }
    const items = [], learn = [], linkedIds = [], miss = [];
    for (const r of rows) {
      const code = digits(r[0]).padStart(3, '0'), acct = String(r[1]).trim(), amt = num(r[2]), holder = String(r[3] || '').trim(), memo = String(r[7] || '').trim();
      const nh = normName(holder);
      let inv = pool.find(i => !used.has(i.id) && num(i.total) === amt && bankOf(i) && digits(bankOf(i).acct) === digits(acct));
      if (!inv) inv = pool.find(i => !used.has(i.id) && num(i.total) === amt && nh && invNames(i, vendorOf(i)).some(n => n === nh || nh.includes(n) || n.includes(nh)));
      if (inv) {
        used.add(inv.id); linkedIds.push(inv.id);
        const v = vendorOf(inv); if (v && !v.acct) { v.acct = acct; v.bankCode = code; v.bank = v.bank || bankNameOf(code); v.holder = v.holder || holder; learn.push(v); }
      } else miss.push(`${holder} ${won(amt)}`);
      items.push({ invId: inv ? inv.id : null, amt, code, acct, holder, memo });
    }
    const total = items.reduce((s, x) => s + x.amt, 0), ref = db.collection('batches').doc();
    const yms = {}; linkedIds.forEach(id => { const y = pool.find(i => i.id === id).ym; yms[y] = (yms[y] || 0) + 1; });
    const ym = Object.entries(yms).sort((a, b) => b[1] - a[1])[0]?.[0] || IV.ym;
    const b = { ym, date, items, total, status: 'planned', createdAt: TS(), by: S.user.email, fileName: file.name };
    await ref.set(b);
    await commitBatches(linkedIds.map(id => x => x.update(db.collection('invoices').doc(id), { status: 'planned', batchId: ref.id })));
    await commitBatches([...new Set(learn)].map(v => x => x.update(db.collection('vendors').doc(v.id), { acct: v.acct, bankCode: v.bankCode, bank: v.bank, holder: v.holder })));
    linkedIds.forEach(id => { const i = pool.find(v => v.id === id); i.status = 'planned'; i.batchId = ref.id; });
    results.push({ name: file.name, rows: rows.length, linked: linkedIds.length, total, miss });
  }
  IV.batchResult = results; IV.invs = null;
  await loadInvData(); await doMatch(true);
  const linked = results.reduce((s, r) => s + r.linked, 0);
  toast(`${files.length}개 파일 · 계산서 ${linked}건을 묶음으로 등록했어요`);
  renderInv();
}

async function runVpay() {
  const name = VP.name.trim(); if (name.length < 2) return toast('업체명을 두 글자 이상 입력해 주세요');
  if (!VP.from || !VP.to || VP.from > VP.to) return toast('기간을 확인해 주세요');
  const nn = normName(name);
  const v = null;   // 거래처 목록이 아니라 은행 내역의 의뢰인/수취인에서 찾아요
  await loadAutoData();
  const aps = VP.dir === 'out' ? AP.list.filter(ap => normName(ap.name).includes(nn) || apNames(ap).some(n => n.includes(nn) || nn.includes(n))) : [];
  const alias = (S.searchAlias || []).filter(a => { const t = normName(a.term); return t.length >= 2 && (t === nn || nn.includes(t) || t.includes(nn)); }).flatMap(a => String(a.names || '').split(/\s*,\s*/));
  const names = [...new Set([...alias, name, ...aps.flatMap(apNames)].map(normName).filter(n => n.length >= 2))];
  const [ts, bs] = await Promise.all([
    db.collection('txns').where('date', '>=', VP.from).where('date', '<=', VP.to).get(),
    VP.dir === 'out' ? db.collection('batches').where('status', '==', 'paid').get() : Promise.resolve(null)
  ]);
  const list = [];
  ts.forEach(d => {
    const t = d.data(), amt = num(VP.dir === 'out' ? t.outAmt : t.inAmt); if (!amt) return;
    const pn = normName(t.party), mn = normName(t.memo1);
    if (!names.some(n => (pn && pn.includes(n)) || (mn && mn.includes(n)))) return;
    const auto = aps.some(ap => apHit(ap, t)) || /FBS|지로|CMS|자동/.test(`${t.memo || ''}`);
    list.push({ date: t.date, time: t.time || '', acct: accNameOf(t.acct6), amt, how: auto ? '자동이체' : '개별', party: t.party || t.memo1 || '', label: t.groupLabel || rowLabel(t) });
  });
  if (bs) bs.forEach(d => {
    const b = d.data(), date = b.payDate || b.date; if (!date || date < VP.from || date > VP.to) return;
    (b.items || []).forEach(it => {
      const hn = normName(it.holder), hit = names.some(n => hn && hn.includes(n));
      if (hit) list.push({ date, time: '', acct: '대량이체 묶음', amt: num(it.amt), how: '대량이체', party: it.holder, label: it.memo || '' });
    });
  });
  list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const months = []; for (let d = VP.from.slice(0, 7); d <= VP.to.slice(0, 7);) { months.push({ ym: d, n: 0, amt: 0 }); const [y, m] = d.split('-').map(Number); d = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; }
  list.forEach(x => { const m = months.find(k => k.ym === x.date.slice(0, 7)); if (m) { m.n++; m.amt += x.amt; } });
  VP.rows = { name: v ? v.name : name, v, from: VP.from, to: VP.to, dir: VP.dir, list, months };
  renderVpay();
}
async function exportVpay() {
