const ivEl = document.getElementById('v-inv');
ivEl.addEventListener('click', async e => {
  const t = e.target;
  const kb = t.closest('#ivKind button'); if (kb) { IV.kind = kb.dataset.k; IV.status = 'all'; IV.page = 0; IV.sel.clear(); return renderInv(); }
  const pg = t.closest('#ivPager [data-pg]'); if (pg && !pg.disabled) { IV.page = +pg.dataset.pg; await renderInv(); return document.querySelector('#v-inv .ivt')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  const sb = t.closest('#ivStatus button'); if (sb) { IV.status = sb.dataset.s; IV.page = 0; return renderInv(); }
  if (t.id === 'ivRematch') return busy(async () => { await loadInvData(); await doMatch(); renderInv(); });
  if (t.id === 'ivCfgBtn') { IV.showCfg = !IV.showCfg; return renderInv(); }
  if (t.id === 'ivBatchReg') { IV.batchReg = !IV.batchReg; return renderInv(); }
  if (t.id === 'brCancel') { IV.batchReg = false; return renderInv(); }
  if (t.id === 'ivList') return busy(exportInvList);
  if (t.id === 'ivPayAll') { IV.sel = new Set(IV.invs.filter(i => i.kind === 'buy' && i.ym === IV.ym && i.status === 'unpaid').map(i => i.id)); if (!IV.sel.size) return toast('이 달 미지급 건이 없어요'); return makeBatch(); }
  if (t.id === 'ivSelClear') { IV.sel.clear(); return renderInv(); }
  if (t.id === 'ivMakeBatch') return makeBatch();
  if (t.id === 'ivBulkPaid') return bulkPaidDialog([...IV.sel].map(id => IV.invs.find(i => i.id === id)).filter(i => i && !i.voided && i.status !== 'paid' && i.status !== 'excluded'));
  if (t.id === 'ivSaveUp') return busy(saveInvUpload);
  if (t.id === 'ivCancelUp') { IV.pending = null; return renderInv(); }
  if (t.id === 'ivLinkAll') return busy(linkAllSuggested);
  if (t.id === 'cfgAddBiz') return $('#cfgBiz').insertAdjacentHTML('beforeend', `<div class="row" style="margin-bottom:6px"><input class="in" data-c="biz" style="width:140px" placeholder="사업자번호"><input class="in" data-c="name" style="width:200px" placeholder="사업장명"><input class="in" data-c="accts" style="width:180px" placeholder="입금 계좌 끝 6자리"></div>`);
  if (t.id === 'cfgSave') return busy(async () => {
    const ourBiz = [...$('#cfgBiz').querySelectorAll('.row')].map(r => ({ biz: r.querySelector('[data-c=biz]').value.trim(), name: r.querySelector('[data-c=name]').value.trim(), accts: r.querySelector('[data-c=accts]').value.trim() })).filter(o => o.biz);
    MCFG = { buyDay: Math.min(31, Math.max(1, num($('#cfgBuy').value) || 10)), sellDay: Math.min(31, Math.max(1, num($('#cfgSell').value) || 31)), myDisplay: $('#cfgDisp').value.trim(), ourBiz };
    await db.collection('settings').doc('match').set({ ...MCFG, updatedAt: TS(), by: S.user.email });
    IV.showCfg = false; await doMatch(); renderInv();
  });
  const a = t.closest('[data-iv]');
  if (a && e.type === 'click' && a.tagName === 'BUTTON') {
    const inv = IV.invs.find(i => i.id === a.dataset.id), act = a.dataset.iv;
    if (act === 'ok') return busy(async () => {
      const tx = IV.txns.find(x => x.id === inv.reviewTxId);
      await setInv(inv, { status: 'paid', matchType: 'confirmed', matchTxIds: [inv.reviewTxId], matchDate: tx ? tx.date : '', lock: true, reviewTxId: null });
      await learnVendorName(inv, tx); toast('확정했어요. 다음부터 같은 이름의 출금은 자동으로 맞춰져요'); renderInv();
    });
    if (act === 'no') return busy(async () => { await setInv(inv, { status: 'unpaid', rejectTx: [...(inv.rejectTx || []), inv.reviewTxId], reviewTxId: null, matchText: '' }); await doMatch(true); renderInv(); });
    if (act === 'manualpaid') return manualPaidDialog(inv);
    if (act === 'sugok') return busy(async () => {
      const sg = inv.suggest, tx = IV.txns.find(t => t.id === (sg.txIds || [])[0]);
      await setInv(inv, { status: 'paid', matchType: 'confirmed', matchTxIds: sg.txIds || [], matchDate: sg.date, matchText: `${sg.text} · 확인 ${initialOf(S.user.email)}`, bankMatch: true, lock: true, suggest: null, checkedBy: S.user.email, checkedAt: Date.now() });
      if (tx) await learnVendorName(inv, tx); IV.sel.delete(inv.id); toast(`${sg.date} ${inv.kind === 'sell' ? '입금' : '지급'}으로 처리했어요`); await doMatch(true); renderInv();
    });
    if (act === 'sugno') return busy(async () => { await setInv(inv, { suggest: null, rejectTx: [...(inv.rejectTx || []), ...((inv.suggest || {}).txIds || [])] }); await doMatch(true); renderInv(); });
    if (act === 'exclude') {
      const note = prompt('미지급외 처리 사유를 적어 주세요', ''); if (note === null) return;
      return busy(async () => { await setInv(inv, { status: 'excluded', manualNote: note, lock: true }); renderInv(); });
    }
    if (act === 'void') {
      const b = inv.status === 'planned' && inv.batchId ? IV.batches.find(x => x.id === inv.batchId) : null;
      if (!confirm(`${inv.vendorName} ${won(inv.total)}원 계산서를 발행 취소(이체하지 않음)로 표시할까요?` + (b ? `\n\n이 건은 ${b.date} 대량이체 묶음에 들어 있어요. 묶음에서 빼고 합계를 다시 계산해요.\n이미 은행에 파일을 올렸다면 은행에서도 이 건을 빼 주세요.` : ''))) return;
      return busy(async () => {

/* ---------- 세금계산서 업로드 ---------- */
async function parseInvFiles(files) {
  await loadVendorsCfg();
  const invs = [], skipped = [], headers = {}, fileStats = []; let manualYm = null;
  for (const file of files) {
  const before = invs.length;
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    const hi = rows.findIndex(r => r.map(x => String(x).trim()).includes('승인번호') && r.map(x => String(x).trim()).includes('합계금액'));
    const mi = rows.findIndex(r => r.map(x => String(x).trim()).includes('업체명') && r.map(x => String(x).trim()).includes('이체금액'));
    if (hi >= 0) {
      const H = rows[hi].map(h => String(h).trim()); headers[sn] = H;
      const ix = n => H.indexOf(n), supI = ix('상호'), buyI = H.indexOf('상호', supI + 1), ceoI = ix('대표자명'), ceo2I = H.indexOf('대표자명', ceoI + 1);
      const ourSet = new Set(MCFG.ourBiz.map(o => bizKey(o.biz)));
      for (const r of rows.slice(hi + 1)) {
        const g = n => { const k = ix(n); return k < 0 ? '' : r[k]; };
        const appr = String(g('승인번호')).trim(); if (!appr) continue;
        const supBiz = String(g('공급자사업자등록번호')), buyBiz = String(g('공급받는자사업자등록번호'));
        const kind = sn.includes('매출') ? 'sell' : sn.includes('매입') ? 'buy' : (ourSet.has(bizKey(supBiz)) ? 'sell' : 'buy');
        const date = normDate(g('작성일자'));
        const flag = v => String(v || '').trim();
        invs.push({
          id: appr.replace(/\//g, '-'), approvalNo: appr, sheet: sn, kind, type: String(g('전자세금계산서분류') || (sn.includes('계산서') && !sn.includes('세금') ? '계산서' : '세금계산서')),
          date, ym: date.slice(0, 7), issueDate: normDate(g('발급일자')), sendDate: normDate(g('전송일자')), total: num(g('합계금액')), supply: num(g('공급가액')), tax: num(g('세액')),
          vendorBiz: kind === 'sell' ? buyBiz : supBiz, vendorName: String(kind === 'sell' ? r[buyI] : r[supI]).trim(),
          ceo: String(kind === 'sell' ? (r[ceo2I] ?? '') : (r[ceoI] ?? '')).trim(),
          ourBiz: kind === 'sell' ? supBiz : buyBiz, ourName: String(kind === 'sell' ? r[supI] : r[buyI]).trim(),
          note: String(g('비고') || ''), item: String(g('품목명') || ''), raw: r.map(x => x === null || x === undefined ? '' : x),
          fileAccount: flag(g('계정명')), filePaid: flag(g('기지급여부')), fileExcl: flag(g('미지급외 처리'))
        });
      }
    } else if (mi >= 0) {
      const H = rows[mi].map(h => String(h).trim()), ix = n => H.indexOf(n); manualYm = IV.ym; headers[sn] = H;
      rows.slice(mi + 1).forEach((r, k) => {
        const g = n => { const c = ix(n); return c < 0 ? '' : r[c]; };
        const name = String(g('업체명')).trim(); if (!name) return;
        invs.push({
          id: `M-${IV.ym}-${String(g('NO') || k + 1)}-${normName(name).slice(0, 10)}`, sheet: sn, kind: 'buy', type: '수기', date: `${IV.ym}-01`, ym: IV.ym,
          total: num(g('이체금액')), vendorName: name, vendorBiz: '', item: String(g('내용') || ''), note: String(g('특이사항') || ''),
          bankName: String(g('은행') || '').trim(), bankCode: bankCodeOf(g('은행'), ''), acct: String(g('계좌') || '').trim(), holder: String(g('예금주') || '').trim(),
          raw: r.map(x => x === null || x === undefined ? '' : x), filePaid: String(g('완료여부') || '').trim(), fileExcl: '', fileAccount: ''
        });
      });
    } else skipped.push(`${file.name} › ${sn}`);
  }
  fileStats.push({ name: file.name, count: invs.length - before });
  }
  const seen = new Set(); for (let k = invs.length - 1; k >= 0; k--) { if (seen.has(invs[k].id)) invs.splice(k, 1); else seen.add(invs[k].id); }
  if (!invs.length) throw new Error('승인번호·합계금액 머리글이 있는 시트를 찾지 못했어요');
  const yms = [...new Set(invs.map(i => i.ym))], exist = new Set();
  for (const ym of yms) (await db.collection('invoices').where('ym', '==', ym).get()).forEach(d => exist.add(d.id));
  IV.pending = { fileName: fileStats.map(f => f.name).join(', '), fileStats, invs, headers, skipped, manualYm, newIds: new Set(invs.filter(i => !exist.has(i.id)).map(i => i.id)) };
  renderInv();
}

async function registerBatchFiles(files, date) {
  refreshBizMap();
  // 열려 있는 달과 상관없이, 아직 지급되지 않은 모든 매입 계산서에서 찾아요

  pool.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const used = new Set(), results = [];

    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' })
      .filter(r => digits(r[1]).length >= 8 && num(r[2]) > 0);
    if (!rows.length) { results.push({ name: file.name, rows: 0, linked: 0, total: 0, miss: ['은행코드·계좌번호·금액 순서의 이체 줄을 찾지 못했어요'] }); continue; }
    const items = [], learn = [], linkedIds = [], miss = [];
    for (const r of rows) {
      const code = digits(r[0]).padStart(3, '0'), acct = String(r[1]).trim(), amt = num(r[2]), holder = String(r[3] || '').trim(), memo = String(r[7] || '').trim();
      const nh = normName(holder);
      let inv = pool.find(i => !used.has(i.id) && num(i.total) === amt && bankOf(i) && digits(bankOf(i).acct) === digits(acct));
      if (!inv) inv = pool.find(i => !used.has(i.id) && num(i.total) === amt && nh && invNames(i, vendorOf(i)).some(n => n === nh || nh.includes(n) || n.includes(nh)));
      if (inv) {
        used.add(inv.id); linkedIds.push(inv.id);
        const v = vendorOf(inv); if (v && !v.acct) { v.acct = acct; v.bankCode = code; v.bank = v.bank || bankNameOf(code); v.holder = v.holder || holder; learn.push(v); }
      } else miss.push(`${holder} ${won(amt)}`);
      items.push({ invId: inv ? inv.id : null, amt, code, acct, holder, memo });
    }
    const total = items.reduce((s, x) => s + x.amt, 0), ref = db.collection('batches').doc();
    const yms = {}; linkedIds.forEach(id => { const y = pool.find(i => i.id === id).ym; yms[y] = (yms[y] || 0) + 1; });
    const ym = Object.entries(yms).sort((a, b) => b[1] - a[1])[0]?.[0] || IV.ym;
    const b = { ym, date, items, total, status: 'planned', createdAt: TS(), by: S.user.email, fileName: file.name };
    await ref.set(b);
    await commitBatches(linkedIds.map(id => x => x.update(db.collection('invoices').doc(id), { status: 'planned', batchId: ref.id })));
    await commitBatches([...new Set(learn)].map(v => x => x.update(db.collection('vendors').doc(v.id), { acct: v.acct, bankCode: v.bankCode, bank: v.bank, holder: v.holder })));
    linkedIds.forEach(id => { const i = pool.find(v => v.id === id); i.status = 'planned'; i.batchId = ref.id; });
    results.push({ name: file.name, rows: rows.length, linked: linkedIds.length, total, miss });
  }

  renderInv();
}

async function exportInvList(silent) {
  const cur = IV.invs.filter(i => i.ym === IV.ym);
  const sheets = [...new Set(cur.map(i => i.sheet))];
  const hdrDocs = await Promise.all(sheets.map(sn => db.collection('invoiceHeaders').doc(sn.replace(/\//g, '-')).get()));
  const wb = new ExcelJS.Workbook();
  const txOf = id => IV.txns.find(t => t.id === id);
  const order = ['고지서', '매입세금', '매입계산서', '매출세금', '매출계산서'];
  sheets.sort((a, b) => (order.findIndex(k => a.includes(k)) + 99) % 99 - (order.findIndex(k => b.includes(k)) + 99) % 99);
  sheets.forEach((sn, si) => {
    const H = hdrDocs[si].exists ? [...hdrDocs[si].data().headers] : [];
    const isManual = cur.some(i => i.sheet === sn && i.type === '수기');
    const kind = (cur.find(i => i.sheet === sn) || {}).kind;
    const need = isManual ? ['완료여부'] : ['미지급외 처리', '기지급여부', '계정명'];

    const extra = [kind === 'sell' ? '입금일' : '지급일', '매칭 내역', '상태', '품의서 확인', ...(kind === 'buy' ? ['이체 메모'] : [])];

    cur.filter(i => i.sheet === sn).sort((a, b) => String(a.date).localeCompare(b.date)).forEach(i => {

      else { set('기지급여부', i.status === 'paid' ? 'V' : ''); set('미지급외 처리', i.voided ? '발행 취소' : i.status === 'excluded' ? (i.manualNote || 'V') : ''); set('계정명', i.account || ''); }
      const tx = txOf((i.matchTxIds || [])[0]);
      const row = ws.addRow([...vals, i.status === 'paid' ? (i.matchDate || (tx && tx.date) || '') : '', i.status === 'excluded' ? (i.manualNote || '') : (i.matchText || '') + (i.matchType === 'manual' ? (i.bankMatch ? ' · 은행 내역 일치' : ' · 은행 내역 없음') : ''), L[i.status] || '', i.approval ? `V (${initialOf(i.approval.by)} ${shortTime(i.approval.at)})` : '', ...(kind === 'buy' ? [i.memo || ''] : [])]);

    });
    ['합계금액', '공급가액', '세액', '이체금액', '품목공급가액', '품목세액'].forEach(n => { const k = H.indexOf(n); if (k >= 0) ws.getColumn(k + 1).numFmt = '#,##0'; });

    const hr = ws.addRow(cols); hr.font = { bold: true }; hr.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } });
    let tot = 0;

async function parseVendorFile(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let rows = null, H = null, hi = -1;
  for (const sn of wb.SheetNames) {
    const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
    const i = r.findIndex(x => x.map(y => String(y).trim()).includes('거래처명') && (x.map(y => String(y).trim()).includes('계좌번호') || x.some(y => String(y).includes('사업자'))));
    if (i >= 0) { rows = r; hi = i; H = r[i].map(y => String(y).trim()); break; }
  }
  if (!rows) throw new Error('거래처명과 계좌번호(또는 사업자번호) 머리글이 있는 시트를 찾지 못했어요');
  const c = n => H.indexOf(n), extraCodes = {};
  // 사업자번호 열: 제목에 '사업자'가 있으면 그 열, 없으면 000-00-00000 모양 값이 많은 열
  let bizCol = H.findIndex(x => x.includes('사업자'));
  if (bizCol < 0) {
    let best = -1, bestN = 0;
    H.forEach((_, j) => { if (j === c('계좌번호')) return; const n = rows.slice(hi + 1).filter(r => /^\d{3}-?\d{2}-?\d{5}$/.test(String(r[j] || '').trim())).length; if (n > bestN) { bestN = n; best = j; } });
    if (bestN >= 3) bizCol = best;
  }
  const ci = c('대표코드'), ni = c('참가기관명');
  if (ci >= 0) rows.slice(hi + 1).forEach(r => { const nm = String(r[ci - 1] || '').trim(); if (nm && r[ci]) extraCodes[nm] = digits(r[ci]).padStart(3, '0'); });
  const byAcct = new Map(VENDORS.filter(v => digits(v.acct)).map(v => [digits(v.acct), v]));
  VENDORS.forEach(v => (v.bizNos || []).forEach(b => { if (!digits(v.acct) && bizKey(b)) byAcct.set('biz:' + bizKey(b), v); }));
  const creates = new Map(); let merges = 0, dupes = 0, bizAdded = 0; const mergeOps = [];
  for (const r of rows.slice(hi + 1)) {
    const name = String(r[c('거래처명')] || '').trim(), acct = c('계좌번호') >= 0 ? String(r[c('계좌번호')] || '').trim() : '';
    const biz = bizCol >= 0 ? bizKey(r[bizCol]) : '';
    if (!name || (!digits(acct) && biz.length !== 10)) continue;
    const bank = String(r[c('은행')] || '').trim(), code = bankCodeOf(bank, r[c('은행코드')]) || extraCodes[bank] || '';
    const holder = c('예금주') >= 0 ? String(r[c('예금주')] || '').trim() : '';
    const key = digits(acct) || 'biz:' + biz, ex = byAcct.get(key);
    if (ex) {
      let changed = false;
      if (normName(ex.name) !== normName(name) && !(ex.aliases || []).some(a => normName(a) === normName(name))) { ex.aliases = [...(ex.aliases || []), name]; changed = true; merges++; }
      if (biz.length === 10 && !(ex.bizNos || []).some(b => bizKey(b) === biz)) { ex.bizNos = [...(ex.bizNos || []), fmtBiz(biz)]; changed = true; bizAdded++; }
      if (holder && !ex.holder) { ex.holder = holder; changed = true; }
      if (changed) mergeOps.push(ex); continue;
    }
    if (creates.has(key)) { const x = creates.get(key); if (normName(x.name) !== normName(name) && !x.aliases.includes(name)) x.aliases.push(name); if (biz.length === 10 && !x.bizNos.some(b => bizKey(b) === biz)) x.bizNos.push(fmtBiz(biz)); dupes++; continue; }
    creates.set(key, { name, aliases: [], bizNos: biz.length === 10 ? [fmtBiz(biz)] : [], bank, bankCode: code, acct, holder, outNames: [], inNames: [], account: '', autoPay: !digits(acct) });
  }
  VD.pending = { fileName: file.name, creates: [...creates.values()], merges, dupes, bizAdded, bizCol, bizFound: [...creates.values()].filter(v => v.bizNos.length).length + bizAdded, mergeOps: [...new Set(mergeOps)] };
  renderVendors();
}
async function saveVendorImport() {
  const p = VD.pending;
  const ops2 = p.creates.map(v => { const ref = db.collection('vendors').doc(); return b => b.set(ref, { ...v, createdAt: TS() }); });
  await commitBatches([...ops2, ...p.mergeOps.map(v => b => b.update(db.collection('vendors').doc(v.id), { aliases: v.aliases || [], bizNos: v.bizNos || [], holder: v.holder || '' }))]);
  VD.pending = null; VENDORS = null; refreshBizMap();
  toast(`${p.creates.length}곳을 등록했어요`); renderVendors();
}

const apDayOk = (ap, t) => { const d = num(ap.day); if (!d) return true; const diff = Math.abs(Number(t.date.slice(8, 10)) - Math.min(d, lastDay(t.date.slice(0, 7)))); return diff <= 3 || diff >= 27; };
const apHit = (ap, t) => num(t.outAmt) > 0 && (!ap.acct6 || ap.acct6 === t.acct6) && apDayOk(ap, t) && nameHit(apNames(ap), t);
const _apLabel = t => { if (!AP.list || !(num(t.outAmt) > 0)) return ''; const ap = AP.list.find(a => a.label && apHit(a, t)); return ap ? ap.label : ''; };

  return _apLabel(t);
};

// 직접 정한 날짜 > 업체별 이체일(계산서 같은 달 n일, 작성일보다 앞이면 다음 달). 둘 다 없으면 예약이체일 없음. 주말이면 전 금요일.
function payDateOf(inv) {
  if (inv.kind !== 'buy') return '';
  if (inv.payDate) return inv.payDate;
  const base = inv.date || `${inv.ym}-01`, v = vendorOf(inv), day = v && num(v.payDay);
  if (day) {
    let ym = base.slice(0, 7), d = `${ym}-${pad(Math.min(day, lastDay(ym)))}`;
    if (d < base) { ym = ymAdd(ym, 1); d = `${ym}-${pad(Math.min(day, lastDay(ym)))}`; }
    return prevBizDay(d);
  }
  return '';
}

async function loadAutoTxns(force) {

function autoMonthsData() {

  const rows = AP.list.map(ap => {

      const hits = AP.txns.filter(t => t.date.slice(0, 7) === ym && !used.has(t.id) && apHit(ap, t));
      hits.forEach(t => used.add(t.id));
      return { ym, n: hits.length, amt: hits.reduce((s, t) => s + num(t.outAmt), 0), dates: hits.map(t => t.date).sort() };
    });
    cells.forEach((c, i) => { const p = cells[i - 1]; c.diff = p && p.n && c.n ? c.amt - p.amt : null;
      const dueDay = num(ap.day), dueDate = `${c.ym}-${pad(Math.min(dueDay, lastDay(c.ym)))}`;

}

function findRecos() {

    const g = groups[gk] = groups[gk] || { key: k, label: String(t.party || t.memo1).normalize('NFKC').replace(/^\d+월/, '').replace(/\s*\d+월?$/, '').replace(/\d+$/, '').trim(), months: new Set(), n: 0, amt: 0, last: '', acct6: t.acct6 };

}

    <h2>업체별 이체일</h2>
    <p class="hint">등록한 업체는 계산서가 나온 <b>같은 달</b> 그날에 이체해요 (계산서가 그 날짜 뒤에 나오면 다음 달). 등록하지 않은 업체는 예약이체일이 비어 있고, 세금계산서 화면에서 건별로 직접 정할 수도 있어요. 주말이면 전 금요일로 당겨요.</p>
    <div id="pdList">${list.map(v => `<div class="row" style="margin-bottom:6px"><input class="in" data-pd="name" data-suggest="vendors" style="flex:1;max-width:340px" value="${esc(v.name)}"><span class="hint">매월</span><input class="in" data-pd="day" inputmode="numeric" style="width:64px;text-align:right" value="${v.payDay}"><span class="hint">일</span><button class="btn ghost sm" data-pddel>삭제</button></div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="pdAdd">업체 추가</button><button class="btn primary" id="pdSave">이체일 저장하기</button></div></div>`;
}
async function savePayDays() {
  const rows = [...document.querySelectorAll('#pdList .row')].map(r => ({ name: r.querySelector('[data-pd=name]').value.trim(), day: Math.min(31, num(r.querySelector('[data-pd=day]').value)) })).filter(r => r.name);
  const want = new Map(), miss = [];
  rows.forEach(r => { const v = VENDORS.find(x => x.name === r.name) || VENDORS.find(x => normName(x.name) === normName(r.name)); if (!v) miss.push(r.name); else if (r.day) want.set(v.id, r.day); });
  if (miss.length) return toast(`거래처 목록에 없는 이름이 있어요: ${miss.join(', ')}`);
  const ops = [];
  VENDORS.forEach(v => { const nd = want.get(v.id) || ''; if (String(v.payDay || '') !== String(nd)) { v.payDay = nd; ops.push(b => b.update(db.collection('vendors').doc(v.id), { payDay: nd })); } });
  await commitBatches(ops); IV.invs = null; toast(`업체별 이체일을 저장했어요 (${want.size}곳)`); refreshDue(); renderSettings();
}

/* ---------- 엑셀 다운로드: 이체일별 이체 파일 ---------- */
const PF = { date: '', list: null };
async function loadPayFileList() {
  await loadVendorsCfg();
  const s = await db.collection('invoices').where('status', '==', 'unpaid').get();
  const all = []; s.forEach(d => { const i = { id: d.id, ...d.data() }; if (i.kind === 'buy') all.push({ ...i, pd: payDateOf(i) }); });
  PF.all = all;
  if (!PF.date) { const t = today(); const up = all.map(i => i.pd).filter(d => d && d >= t).sort(); PF.date = up[0] || all.map(i => i.pd).filter(Boolean).sort().pop() || t; }
}
function payFileHtml() {
  const all = PF.all || [], list = all.filter(i => i.pd === PF.date), sum = list.reduce((s, i) => s + num(i.total), 0);
  const noAcct = list.filter(i => !bankOf(i)).length;
  const dates = [...new Set(all.map(i => i.pd).filter(Boolean))].sort().slice(-12);
  return `<div class="panel">
    <h2>이체 파일 (예약이체일 기준)</h2>
    <p class="hint">고른 날짜가 예약이체일인 <b>미지급 매입 계산서</b>를 모아 국민은행 대량이체 파일을 만들어요. 만들면 그 건들은 ‘이체 예정’으로 바뀌어 중복 이체를 막아요.</p>
    <div class="row"><input type="date" class="in" id="pfDate" value="${PF.date}">
      ${dates.map(d => `<button class="btn sm ${d === PF.date ? 'primary' : ''}" data-pfd="${d}">${md(d)} · ${all.filter(i => i.pd === d).length}건</button>`).join('')}</div>
    <div class="chips" style="margin-top:10px"><span class="chip"><b>${list.length}</b>건</span><span class="chip">합계 <b class="outC">${won(sum)}</b>원</span>${noAcct ? `<span class="chip"><span class="diff">계좌 없음 ${noAcct}건 (파일에서 빠져요)</span></span>` : ''}</div>
    ${list.length ? `<div class="scroll"><table class="t ivt"><thead><tr><th>거래처</th><th>품목</th><th>계산서</th><th class="num">금액</th><th>계좌</th></tr></thead><tbody>
      ${list.map(i => { const bk = bankOf(i); return `<tr><td class="vcell"><div class="vname">${esc(i.vendorName)}</div></td><td><div class="icell">${esc(i.item || '')}</div></td><td class="dcell">${md(i.date)}</td><td class="num"><b>${won(i.total)}</b></td><td class="hint">${bk ? esc(`${bankNameOf(bk.code)} ${bk.acct}`) : '<span class="diff">계좌 없음</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="pfMake">국민은행 대량이체 파일 받기</button><button class="btn" id="pfList">목록 엑셀 받기</button></div>` : '<p class="hint">이 날짜가 예약이체일인 미지급 계산서가 없어요. 예약이체일은 설정의 ‘업체별 이체일’이나 세금계산서 화면의 예약이체 칸에서 정해요.</p>'}
  </div>`;
}
async function makePayFile() {
  const list = PF.all.filter(i => i.pd === PF.date && bankOf(i) && num(i.total));
  if (!list.length) return toast('계좌가 있는 미지급 건이 없어요');
  if (!confirm(`${PF.date} 이체분 ${list.length}건, ${won(list.reduce((s, i) => s + num(i.total), 0))}원으로 대량이체 파일을 만들까요?\n만들면 이 건들은 ‘이체 예정’으로 바뀌어요.`)) return;
  const ref = db.collection('batches').doc();
  const items = list.map(i => { const bk = bankOf(i); return { invId: i.id, amt: num(i.total), code: bk.code, acct: bk.acct, holder: bk.holder, memo: i.memo || String(i.item || '').slice(0, 20) }; });
  const yms = {}; list.forEach(i => yms[i.ym] = (yms[i.ym] || 0) + 1);
  const b = { ym: Object.entries(yms).sort((a, c) => c[1] - a[1])[0][0], date: PF.date, items, total: items.reduce((s, x) => s + x.amt, 0), status: 'planned', createdAt: TS(), by: S.user.email };
  await ref.set(b);
  await commitBatches(list.map(i => x => x.update(db.collection('invoices').doc(i.id), { status: 'planned', batchId: ref.id })));
  const wb = new ExcelJS.Workbook(); writeTransferSheet(wb, items, (MCFG || DEFAULT_MATCH).myDisplay);
  await saveWb(wb, `미지급금_이체내역_업로드용_${PF.date.replace(/-/g, '')}.xlsx`);
  IV.invs = null; await loadPayFileList(); refreshDue(); toast(`${list.length}건 이체 파일을 만들었어요`); renderExport();
}
async function payListExcel() {
  const list = PF.all.filter(i => i.pd === PF.date), wb = new ExcelJS.Workbook(), ws = wb.addWorksheet(`${PF.date} 이체`);
  const hr = ws.addRow(['예약이체일', '거래처', '사업자번호', '품목', '작성일자', '합계금액', '은행', '은행코드', '계좌번호', '예금주', '이체 메모', '계정명']);
  hr.font = { bold: true }; hr.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } });
  list.forEach(i => { const bk = bankOf(i); ws.addRow([i.pd, i.vendorName, fmtBiz(i.vendorBiz), i.item, i.date, num(i.total), bk ? bankNameOf(bk.code) : '', bk ? bk.code : '', bk ? bk.acct : '계좌 없음', bk ? bk.holder : '', i.memo || '', i.account || '']); });
  const tr = ws.addRow(['합계', '', '', '', '', list.reduce((s, i) => s + num(i.total), 0)]); tr.font = { bold: true };
  ws.getColumn(6).numFmt = '#,##0'; [12, 26, 14, 30, 12, 14, 10, 8, 20, 20, 20, 12].forEach((w, k) => ws.getColumn(k + 1).width = w);
  await saveWb(wb, `이체목록_${PF.date.replace(/-/g, '')}.xlsx`);
}

/* ---------- 이벤트 (설정 · 업체별 이체 · 엑셀 다운로드) ---------- */
document.addEventListener('click', e => {
  const t = e.target; if (!t.closest) return;
  // 자동이체 목록 (설정)
  if (t.closest('#apSettings')) {
    if (t.id === 'apAdd') return apDialog(null);
    if (t.dataset.apedit) return apDialog(AP.list.find(x => x.id === t.dataset.apedit));
    if (t.dataset.apdel) { const a = AP.list.find(x => x.id === t.dataset.apdel); if (!confirm(`${a.name} 자동이체를 목록에서 뺄까요?`)) return; return busy(async () => { await db.collection('autopays').doc(a.id).delete(); AP.list = AP.list.filter(x => x.id !== a.id); renderSettings(); }); }
    if (t.id === 'apReco') return busy(async () => { await loadAutoTxns(); AP.recos = findRecos(); renderSettings(); });
    if (t.id === 'recoClose') { AP.recos = null; return renderSettings(); }
    if (t.id === 'recoAll') { document.querySelectorAll('[data-reco]').forEach(c => c.checked = t.checked); return; }
    if (t.id === 'recoSave') {
      const pick = [...document.querySelectorAll('[data-reco]')].filter(c => c.checked).map(c => AP.recos[+c.dataset.reco]);
      if (!pick.length) return toast('등록할 곳을 골라 주세요');
      return busy(async () => {
        await commitBatches(pick.map(g => b => { const ref = db.collection('autopays').doc(); const data = { name: g.label, match: g.key, acct6: g.acct6, day: g.day || '', vendorId: '', account: '', memo: '', label: '', updatedAt: TS(), by: S.user.email }; AP.list.push({ id: ref.id, ...data }); b.set(ref, data); }));
        AP.recos = null; toast(`${pick.length}곳을 자동이체로 등록했어요`); renderSettings();
      });
    }
  }
  // 업체별 이체일 (설정)
  if (t.closest('#pdSettings')) {
    if (t.id === 'pdAdd') { $('#pdList').insertAdjacentHTML('beforeend', `<div class="row" style="margin-bottom:6px"><input class="in" data-pd="name" data-suggest="vendors" style="flex:1;max-width:340px" placeholder="거래처 이름"><span class="hint">매월</span><input class="in" data-pd="day" inputmode="numeric" style="width:64px;text-align:right" placeholder="25"><span class="hint">일</span><button class="btn ghost sm" data-pddel>삭제</button></div>`); $('#pdList').lastElementChild.querySelector('input').focus(); return; }
    if (t.closest('[data-pddel]')) { t.closest('.row').remove(); return; }
    if (t.id === 'pdSave') return busy(savePayDays);
  }
  // 자동이체 현황 (업체별 이체 탭)
  if (t.id === 'apDl') return busy(async () => {
    const { months, rows } = autoMonthsData(), wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('자동이체 현황');
    const hr = ws.addRow(['업체', '은행 표시 이름', '출금일', ...months.flatMap(m => [m, '전월 대비'])]); hr.font = { bold: true };
    hr.eachCell(c => c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE3F4F2' } });
    rows.forEach(({ ap, cells }) => ws.addRow([ap.name, apNames(ap).join(', '), ap.day ? `매월 ${ap.day}일` : '', ...cells.flatMap(c => [c.n ? c.amt : (c.missing ? '미출금' : ''), c.diff || ''])]));
    ws.columns.forEach((c, i) => { c.width = i < 2 ? 22 : 12; if (i >= 3) c.numFmt = '#,##0'; });
    await saveWb(wb, `자동이체_현황_${today().replace(/-/g, '')}.xlsx`);
  });
  // 이체 파일 (엑셀 다운로드)
  const pfd = t.closest('[data-pfd]'); if (pfd) { PF.date = pfd.dataset.pfd; return renderExport(); }
  if (t.id === 'pfMake') return busy(makePayFile);
  if (t.id === 'pfList') return busy(payListExcel);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'apMonths') { AP.months = +t.value; busy(async () => { await db.collection('settings').doc('autopayView').set({ months: AP.months }); await loadAutoTxns(true); renderVpay(); }); }
  if (t.id === 'pfDate' && t.value) { PF.date = t.value; renderExport(); }
});
</script>
