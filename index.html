<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUETTA 자금일보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#EEF3F2; --paper:#FFFFFF; --ink:#1B2928; --muted:#5E716F; --line:#D5E0DE; --line2:#E6EDEC;
  --teal:#2BADA0; --teal-deep:#0F5C55; --teal-soft:#E3F4F2;
  --gold:#D4BE52; --gold-deep:#8A7618; --gold-soft:#F7F1D4;
  --navy:#34507A; --navy-soft:#E7ECF4;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--teal-deep);color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;height:56px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:500;opacity:.7;margin-left:6px}
.top nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.top nav button{background:none;border:0;color:#cfe9e5;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.top nav button[aria-current="true"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.top nav button:hover{color:#fff}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:#cfe9e5;white-space:nowrap}
.who button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}

main{max-width:1320px;margin:0 auto;padding:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 12px}
.panel h3{font-size:14px;margin:18px 0 8px}
.hint{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.btn.primary:hover{background:#249a8e}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}
input.in,select.in{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;min-width:0}
input.in:focus,select.in:focus,.btn:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

/* day header */
.dayhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.dayhead h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dayhead .navbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.spacer{flex:1}

/* bankbook strip */
.book{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.book-top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line2)}
.book-top b{font-size:15px}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;border:3px double var(--gold);color:var(--gold-deep);font-weight:800;font-size:13px;line-height:1.15;text-align:center;transform:rotate(-12deg);background:var(--gold-soft)}
.stamp.pending{border-color:var(--line);color:var(--muted);background:#f6f8f8}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:#F8FAFA;white-space:nowrap}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t th.num,table.t td.num{text-align:right}
table.t tr.sum td{font-weight:700;background:#F8FAFA}
.inC{color:var(--teal-deep)}
.outC{color:var(--navy)}
.diff{color:var(--gold-deep);font-weight:600}
.okC{color:var(--teal-deep)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.tag.cash{background:var(--gold-soft);color:var(--gold-deep)}

/* ledgers */
.ledgers{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.ledgers{grid-template-columns:1fr}.top{gap:12px;padding:0 12px}main{padding:14px}}
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.ledger-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:3px solid var(--teal)}
.ledger.out .ledger-h{border-bottom-color:var(--navy)}
.ledger-h b{font-size:15px}
.ledger-h .num{font-size:16px;font-weight:700}
.entry{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;padding:10px 16px;border-bottom:1px solid var(--line2);align-items:center}
.entry.sel{background:var(--teal-soft)}
.entry .meta{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .lbl{grid-column:2/3}
.entry .lbl input{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 8px;background:#F6F9F9;font-weight:600}
.entry .lbl input:hover{border-color:var(--line)}
.entry .lbl input:focus{background:#fff;border-color:var(--teal);outline:none}
.entry .lbl input.edited{background:var(--gold-soft)}
.entry .amt{font-weight:700;font-variant-numeric:tabular-nums}
.entry .src{font-size:11px;padding:0 6px;border-radius:4px}
.src.manual{background:var(--gold-soft);color:var(--gold-deep)}
.src.rule{background:var(--teal-soft);color:var(--teal-deep)}
.entry.group{background:#FAFCFC}
.members{grid-column:2/4;font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-top:4px}
.members div{display:flex;justify-content:space-between;gap:10px}
.ledger-f{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.manualform{display:grid;grid-template-columns:130px 1fr 130px auto;gap:6px;padding:10px 16px;border-top:1px dashed var(--line);background:#FBFCFC}
@media (max-width:600px){.manualform{grid-template-columns:1fr 1fr}}

.toolbar{position:sticky;top:64px;z-index:10;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;margin-bottom:12px}
.toolbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}

details.extra summary{cursor:pointer;font-weight:600;padding:4px 0}
.grid-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid-in label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.grid-in input{text-align:right}

.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;background:#FBFCFC;cursor:pointer;margin:14px 0}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.filechips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mpanel h2{display:flex;align-items:center;gap:10px}
.mlist{width:100%;border-collapse:collapse;margin-bottom:12px}
.mlist td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.mlist td.item{white-space:nowrap;color:var(--muted);font-size:13px;width:1%}
.mlist input{width:100%}
.mlist td.amt{width:150px}
.madd{display:grid;grid-template-columns:minmax(180px,240px) auto 140px 1fr auto;gap:8px;align-items:center;background:var(--teal-soft);border-radius:10px;padding:10px}
.madd .acct[hidden]{display:none}
@media (max-width:760px){.madd{grid-template-columns:1fr 1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(27,41,40,.35);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:14px;padding:22px;width:min(460px,100%);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal h3{margin:0 0 12px;font-size:16px}
.people{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 20px;margin-bottom:18px}
.people.todo{background:var(--gold-soft);border-color:#E8DA9A}
.people b{font-size:15px}
.people label{display:flex;align-items:center;gap:6px}
.people input{width:80px;text-align:right}
.people .todo-msg{color:var(--gold-deep);font-weight:600;font-size:13px}
.entry.auto{background:#FAFCFC}
.entry.auto.checked{background:#F3FAF9}
.members .mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0}
.members .mrow .btn{padding:0 8px}
.checked-badge{color:var(--teal-deep);font-weight:700}
.recheck{color:var(--gold-deep);font-weight:600}
.sugg{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:260px;overflow:auto;min-width:200px}
.sugg div{padding:7px 12px;cursor:pointer;white-space:nowrap}
.sugg div.on,.sugg div:hover{background:var(--teal-soft)}
.sugg mark{background:none;color:var(--teal-deep);font-weight:700}
.mrows{display:flex;flex-direction:column;gap:8px}
.mrows .madd{grid-template-columns:96px minmax(170px,230px) auto 130px 1fr auto}
.mrows .madd .gname{font-weight:700;color:var(--teal-deep);font-size:13px}
@media (max-width:760px){.mrows .madd{grid-template-columns:1fr 1fr}}
.newb{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);border-radius:4px;padding:0 5px;vertical-align:1px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.presets button{border:1px solid var(--teal);background:#fff;color:var(--teal-deep);border-radius:99px;padding:5px 12px;cursor:pointer}
.presets button:hover{background:var(--teal-soft)}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--line2);border-radius:99px;padding:4px 12px;font-size:12.5px}
.chip b{font-variant-numeric:tabular-nums}
.warn{background:var(--gold-soft);border:1px solid #E8DA9A;color:#5d500f;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:600}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px;max-width:420px;width:100%}
.login h1{margin:0 0 6px;font-size:22px}
.login .btn{width:100%;margin-top:18px;padding:11px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.busy{position:fixed;inset:0;background:rgba(238,243,242,.6);display:grid;place-items:center;z-index:50;font-weight:600}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <h1>QUETTA 자금일보</h1>
    <p class="hint">행정실에 등록된 Google 계정으로 로그인하세요.</p>
    <p id="loginMsg" class="warn" hidden></p>
    <button id="loginBtn" class="btn primary">Google 계정으로 로그인</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">QUETTA 자금일보<small>강남대성기숙</small></div>

      <button data-view="day">일보</button>
      <button data-view="txns">거래내역</button>
      <button data-view="upload">업로드</button>
      <button data-view="inv">세금계산서</button>
      <button data-view="vendors">거래처</button>
      <button data-view="export">엑셀 다운로드</button>
      <button data-view="settings">설정</button>
    </nav>
    <div class="who"><span id="who"></span><button id="logoutBtn">로그아웃</button></div>
  </header>
  <main>
    <section id="v-day"></section>
    <section id="v-txns" hidden></section>
    <section id="v-upload" hidden></section>
    <section id="v-export" hidden></section>
    <section id="v-settings" hidden></section>
    <section id="v-inv" hidden></section>
    <section id="v-vendors" hidden></section>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

const num = v => { if (v == null || v === '') return 0; if (typeof v === 'number') return v; const n = Number(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const ymOf = s => s.slice(0, 7);

const defaultLabel = t => { const m1 = (t.memo1 || t.memo || '').trim(); const p = (t.party || '').trim(); return (!p || p === m1) ? m1 : `${m1} / ${p}`; };

const splitList = s => String(s || '').split(/\s*,\s*/).map(x => x.trim()).filter(Boolean);
function isCardTx(t, cfg) {
  if (!(num(t.inAmt) > 0)) return false;
  const party = String(t.party || '').normalize('NFKC').replace(/\s/g, '');
  const memo = `${t.memo || ''} ${t.memo1 || ''} ${t.memo2 || ''}`.normalize('NFKC');

/* ---------- 엑셀 생성 (기존 자금일보 양식 재현) ---------- */
const XFONT = '바탕', NF = '#,##0_ ';
const colN = s => s.split('').reduce((a, c) => a * 26 + c.charCodeAt(0) - 64, 0);
const colL = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
function cellsIn(range) {
  const [a, b] = range.split(':'); if (!b) return [a];
  const p = s => { const m = s.match(/^([A-Z]+)(\d+)$/); return [colN(m[1]), +m[2]]; };
  const [c1, r1] = p(a), [c2, r2] = p(b), out = [];
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) out.push(colL(c) + r);
  return out;
}
function put(ws, range, v, o = {}) {
  const cells = cellsIn(range);
  if (cells.length > 1) ws.mergeCells(range);
  const top = ws.getCell(cells[0]);
  if (v !== undefined && v !== null && v !== '') top.value = (typeof v === 'object' && v.f !== undefined && !(v instanceof Date)) ? { formula: v.f, result: v.r } : v;
  for (const a of cells) {
    const c = ws.getCell(a);
    c.font = { name: XFONT, size: o.sz || 11, bold: !!o.b };
    c.alignment = { horizontal: o.h || (o.num ? 'right' : 'center'), vertical: o.v || 'center', wrapText: !!o.wrap, shrinkToFit: !!o.shrink };
    if (o.num) c.numFmt = o.fmt || NF; else if (o.fmt) c.numFmt = o.fmt;
    if (o.border !== false) c.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
  }
}
function outline(ws, range, style) {
  const [a, b] = range.split(':');
  const p = s => { const m = s.match(/^([A-Z]+)(\d+)$/); return [colN(m[1]), +m[2]]; };
  const [c1, r1] = p(a), [c2, r2] = p(b);
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    const cell = ws.getCell(colL(c) + r); const bd = Object.assign({}, cell.border);
    if (r === r1) bd.top = { style }; if (r === r2) bd.bottom = { style };
    if (c === c1) bd.left = { style }; if (c === c2) bd.right = { style };
    cell.border = bd;
  }
}
const nz = v => (v ? v : undefined);

// 시트 행 위치 계산 (계좌 수·차입처 수·거래 행 수에 따라 가변)
function dayLayout(accN, borN, txN) {
  const L = { accStart: 24 };
  L.accEnd = L.accStart + accN - 1; L.bo = L.accEnd + 1;
  L.bondHead = L.bo + 2; L.bondRow = L.bondHead + 2; L.bondSum = L.bondRow + 1;
  L.loanHead = L.bondSum + 2; L.loanRow = L.loanHead + 2; L.loanSum = L.loanRow + 1;
  L.borHead = L.loanSum + 2; L.borStart = L.borHead + 2; L.borEnd = L.borStart + Math.max(borN, 1) - 1; L.borSum = L.borEnd + 1;
  L.txHead = L.borSum + 2; L.txStart = L.txHead + 2; L.txN = Math.max(16, txN); L.txEnd = L.txStart + L.txN - 1; L.tot = L.txEnd + 1; L.sign = L.tot + 1;
  return L;
}

/* c = { date, prevName, accounts, borrow, extra, open:{acc,cash,bond,loan,people,salesCum,bor}, f:dayFlows 결과, closeAcc } */

  const [y, m, d] = c.date.split('-').map(Number);

  const sales = f.sales || {};

    [['H', 'D', 'cash'], ['I', 'E', 'dep'], ['J', 'F', 'card']].forEach(([col, src, key]) => {

  'DEFGHIJKLMNO'.split('').forEach(col => put(ws, col + 12, { f: `SUM(${col}9:${col}11)` }, { num: true, b: true, shrink: true }));

  put(ws, 'B15', '과목', { b: true }); put(ws, 'C15', '학원', { b: true }); put(ws, 'D15:F15', '전일이월', { b: true });
  put(ws, 'G15:H15', '입 금', { b: true }); put(ws, 'I15:J15', '출 금', { b: true }); put(ws, 'K15:M15', '차일이월', { b: true }); put(ws, 'N15:O15', '비  고', { b: true });

  tot.forEach(([sub, sch, op, gi, go], i) => {

    put(ws, `G${r}:H${r}`, gi, { num: true }); put(ws, `I${r}:J${r}`, go, { num: true });
    put(ws, `K${r}:M${r}`, { f: `D${r}+G${r}-I${r}`, r: num(op) + num(gi.r) - num(go.r) }, { num: true });
    put(ws, `N${r}:O${r}`, '');
  });
  put(ws, 'B20:C20', '계', { b: true });
  put(ws, 'D20:F20', { f: 'SUM(D16:F19)' }, { num: true, b: true });
  put(ws, 'G20:H20', { f: 'SUM(G16:H17)' }, { num: true, b: true });
  put(ws, 'I20:J20', { f: 'SUM(I16:J17)' }, { num: true, b: true });
  put(ws, 'K20:M20', { f: 'SUM(K16:M19)' }, { num: true, b: true });
  put(ws, 'N20:O20', '');
  put(ws, 'Q14', { f: `IF(AND(D17=F${L.bo},G17=H${L.bo},I17=J${L.bo},K17=L${L.bo},G20=G${L.tot},I20=N${L.tot},D16+D17+G20-I20=K16+K17),"OK","바보-_-")`, r: 'OK' }, { b: true, sz: 10 });

  // 예금 내역

    .forEach(s => { const [rg, t] = s.split('|'); put(ws, rg, t, { b: true }); });
  let gStart = L.accStart;
  accounts.forEach((a, i) => {
    const r = L.accStart + i;

    const critO = `$I$${L.txStart}:$I$${L.txEnd},"${a.subject}",$M$${L.txStart}:$M$${L.txEnd},"(${a.acct6})"`;

    put(ws, `F${r}:G${r}`, P ? { f: `${P}L${r}`, r: accOpen(a) } : accOpen(a), { num: true });
    put(ws, `H${r}:I${r}`, { f: `SUMIFS($G$${L.txStart}:$G$${L.txEnd},${crit})`, r: accIn(a) }, { num: true });
    put(ws, `J${r}:K${r}`, { f: `SUMIFS($N$${L.txStart}:$N$${L.txEnd},${critO})`, r: accOut(a) }, { num: true });

  put(ws, `B${L.bo}:E${L.bo}`, '보통예금 계', { b: true });
  ['F', 'H', 'J', 'L'].forEach(col => { const c2 = colL(colN(col) + 1); put(ws, `${col}${L.bo}:${c2}${L.bo}`, { f: `SUM(${col}${L.accStart}:${c2}${L.accEnd})` }, { num: true, b: true }); });
  put(ws, `N${L.bo}:O${L.bo}`, '');

  // 채권·대여금

    const hr = head + 1;

    put(ws, `N${sum}:O${sum}`, '');
  };
  sec(L.bondHead, L.bondRow, L.bondSum, ' - 채권 및 적금 내역', '채권 및 적금 계', extra.bondName, extra.bondNote, open.bond, bond);
  sec(L.loanHead, L.loanRow, L.loanSum, ' - 대여금 내역', '대여금 계', extra.loanName, extra.loanNote, open.loan, loan);

  [`B${bh}:C${bh}|승인번호`, `D${bh}:E${bh}|전일이월`, `F${bh}:G${bh}|차입금`, `H${bh}:I${bh}|상환금`, `J${bh}:K${bh}|이자비용`, `L${bh}:M${bh}|차입금 잔액`, `N${bh}|이율`, `O${bh}|비고`]
    .forEach(s => { const [rg, t] = s.split('|'); put(ws, rg, t, { b: true }); });
  const bors = borrow.length ? borrow : [{ name: '', rate: 0, note: '' }];
  bors.forEach((b, i) => {
    const r = L.borStart + i, io = (f.borrow || {})[b.name] || {}, op = num((open.bor || {})[b.name]);
    put(ws, `B${r}:C${r}`, b.name, { shrink: true });
    put(ws, `D${r}:E${r}`, P ? { f: `${P}L${r}`, r: op } : op, { num: true });
    put(ws, `F${r}:G${r}`, num(io.in), { num: true }); put(ws, `H${r}:I${r}`, num(io.repay), { num: true }); put(ws, `J${r}:K${r}`, num(io.interest), { num: true });
    put(ws, `L${r}:M${r}`, { f: `D${r}+F${r}-H${r}`, r: op + num(io.in) - num(io.repay) }, { num: true });

  });
  put(ws, `B${L.borSum}:C${L.borSum}`, '차입금 계', { b: true });
  ['D', 'F', 'H', 'J', 'L'].forEach(col => { const c2 = colL(colN(col) + 1); put(ws, `${col}${L.borSum}:${c2}${L.borSum}`, { f: `SUM(${col}${L.borStart}:${c2}${L.borEnd})` }, { num: true, b: true }); });
  put(ws, `N${L.borSum}`, ''); put(ws, `O${L.borSum}`, '');

  // 입/출금 내역
  put(ws, 'B' + L.txHead, ' - 입/출금 내역', { b: true, h: 'left', border: false });
  const th = L.txHead + 1;
  put(ws, `B${th}:F${th}`, '입   금   내   역', { b: true }); put(ws, `G${th}:H${th}`, '입   금   금   액', { b: true });
  put(ws, `I${th}:M${th}`, '출   금   내   역', { b: true }); put(ws, `N${th}:O${th}`, '출   금   금   액', { b: true });
  for (let i = 0; i < L.txN; i++) {
    const r = L.txStart + i, a = f.inRows[i], b = f.outRows[i];
    put(ws, 'B' + r, a ? a.subject : ''); put(ws, `C${r}:E${r}`, a ? a.label : '', { shrink: true });
    put(ws, 'F' + r, a && a.acct6 ? `(${a.acct6})` : '', { fmt: '@' }); put(ws, `G${r}:H${r}`, a ? a.amt : undefined, { num: true });
    put(ws, 'I' + r, b ? b.subject : ''); put(ws, `J${r}:L${r}`, b ? b.label : '', { shrink: true });
    put(ws, 'M' + r, b && b.acct6 ? `(${b.acct6})` : '', { fmt: '@' }); put(ws, `N${r}:O${r}`, b ? b.amt : undefined, { num: true });
  }
  const inSum = f.inRows.reduce((s, x) => s + x.amt, 0), outSum = f.outRows.reduce((s, x) => s + x.amt, 0);

  put(ws, `I${L.tot}:M${L.tot}`, '합             계', { b: true }); put(ws, `N${L.tot}:O${L.tot}`, { f: `SUM(N${L.txStart}:O${L.txEnd})`, r: outSum }, { num: true, b: true });
  outline(ws, `B${th}:O${L.tot}`, 'double');
  put(ws, `M${L.sign}:O${L.sign}`, '강남대성기숙 QUETTA', { b: true, border: false });
  return L;
}

/* 월 단위 다운로드 시 함께 넣는 자금현황 시트 */
function writeStatusSheet(wb, c) {
  const { first, last, names, lastDate, accounts, borrow, extra, L } = c;
  const ws = wb.addWorksheet('자금현황', { views: [{ showGridLines: false }], pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  [6, 14, 12, 20, 16, 10, 12, 16].forEach((w, i) => ws.getColumn(i + 1).width = w);
  const [y, m, d] = lastDate.split('-').map(Number);
  const F = `'${first}'!`, LS = `'${last}'!`, SUMS = cell => names.map(n => `'${n}'!${cell}`).join('+');
  put(ws, 'A2:H2', '강남대성기숙 QUETTA 자금현황', { sz: 16, b: true, border: false }); ws.getRow(2).height = 30;
  put(ws, 'A3:C3', '1.현금', { b: true, h: 'left', border: false });
  put(ws, 'E3:H3', `${y}년 ${m}월 ${d}일 현재`, { h: 'right', border: false });
  const hdr = r => { put(ws, `A${r}:C${r}`, '전기이월', { b: true }); put(ws, `D${r}`, '당월입금', { b: true }); put(ws, `E${r}`, '당월출금', { b: true }); put(ws, `F${r}:G${r}`, '현재잔액', { b: true }); put(ws, `H${r}`, '비  고', { b: true }); };
  hdr(4);
  put(ws, 'A5:C5', { f: `${F}D16` }, { num: true }); put(ws, 'D5', { f: SUMS('G16') }, { num: true }); put(ws, 'E5', { f: SUMS('I16') }, { num: true });
  put(ws, 'F5:G5', { f: 'A5+D5-E5' }, { num: true }); put(ws, 'H5', '');
  put(ws, 'A6:C6', '2.예금(변동성 자금)', { b: true, h: 'left', border: false });
  hdr(7);
  put(ws, 'A8:C8', { f: `${F}D17` }, { num: true }); put(ws, 'D8', { f: SUMS('G17') }, { num: true }); put(ws, 'E8', { f: SUMS('I17') }, { num: true });
  put(ws, 'F8:G8', { f: 'A8+D8-E8' }, { num: true }); put(ws, 'H8', '');
  const th = (r, cols) => cols.forEach((t, i) => put(ws, colL(i + 1) + r, t, { b: true }));
  th(10, ['NO', '예 금 처', '종     류', '계  좌  번  호', '금     액', '이 율', '비  고', '']);
  ws.mergeCells('G10:H10');
  accounts.forEach((a, i) => {
    const r = 11 + i;
    put(ws, 'A' + r, i + 1); put(ws, 'B' + r, a.bank); put(ws, 'C' + r, a.kind); put(ws, 'D' + r, a.no);
    put(ws, 'E' + r, { f: `${LS}L${L.accStart + i}` }, { num: true }); put(ws, 'F' + r, ''); put(ws, `G${r}:H${r}`, a.note || '', { shrink: true });
  });
  let r = 11 + accounts.length;
  put(ws, `A${r}:D${r}`, '합   계', { b: true }); put(ws, 'E' + r, { f: `SUM(E11:E${r - 1})` }, { num: true, b: true }); put(ws, 'F' + r, ''); put(ws, `G${r}:H${r}`, '');
  const block = (start, title, rows) => {
    put(ws, `A${start}:D${start}`, title, { b: true, h: 'left', border: false });
    th(start + 1, ['NO', '구  분', '종     류', '계  좌  번  호', '금     액', '이 율', '비  고', '']); ws.mergeCells(`G${start + 1}:H${start + 1}`);
    rows.forEach((x, i) => { const rr = start + 2 + i; put(ws, 'A' + rr, i + 1); put(ws, 'B' + rr, x.name || ''); put(ws, 'C' + rr, ''); put(ws, 'D' + rr, x.no || ''); put(ws, 'E' + rr, { f: x.f }, { num: true }); put(ws, 'F' + rr, nz(x.rate), { num: true, fmt: '0.0%', h: 'center' }); put(ws, `G${rr}:H${rr}`, x.note || ''); });
    const sr = start + 2 + rows.length;
    put(ws, `A${sr}:D${sr}`, '합   계', { b: true }); put(ws, 'E' + sr, { f: `SUM(E${start + 2}:E${sr - 1})` }, { num: true, b: true }); put(ws, 'F' + sr, ''); put(ws, `G${sr}:H${sr}`, '');
    return sr + 2;
  };
  r += 2;
  r = block(r, '3.적금 및 채권(고정성 자금)', [{ name: '', no: extra.bondName, f: `${LS}L${L.bondRow}`, note: extra.bondNote }]);
  r = block(r, '4.대여금', [{ name: '', no: extra.loanName, f: `${LS}L${L.loanRow}`, note: extra.loanNote }]);
  block(r, '5.차입금', (borrow.length ? borrow : [{ name: '' }]).map((b, i) => ({ name: b.name, f: `${LS}L${L.borStart + i}`, rate: num(b.rate), note: b.note })));
}

/* 업로드 원본 형식 그대로 (선택: 일보 내역 열 추가) */
function writeLedgerSheet(wb, name, txs, withLabel) {

  let tin = 0, tout = 0;

  const tr = ws.addRow(['', txs.length, txs.length, '', '', '', tin, tout]); tr.font = { bold: true };
  [7, 8, 9, 10, 11].forEach(i => ws.getColumn(i).numFmt = '#,##0');
  const widths = [16, 10, 18, 10, 11, 9, 14, 14, 15, 14, 14, 26, 18, 14, 9, 18, 10, 26];
  cols.forEach((_, i) => ws.getColumn(i + 1).width = widths[i] || 12);
  ws.autoFilter = { from: 'A1', to: colL(cols.length) + '1' };
  return ws;
}

<script>
/* =========================================================
   앱 로직
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => (Math.round(num(n)) || 0).toLocaleString('ko-KR');
const wonOrBlank = n => num(n) ? won(n) : '';
const WD = '일월화수목금토';
const dayLabel = s => { const d = parseD(s); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${WD[d.getDay()]})`; };
const today = () => ymd(new Date());
const clone = o => JSON.parse(JSON.stringify(o));
const ruleKey = t => encodeURIComponent(`${(t.memo1 || t.memo || '').trim()}|${(t.party || '').trim()}`).slice(0, 1400);
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600); }
async function busy(fn) { $('#busy').hidden = false; try { return await fn(); } catch (e) { console.error(e); toast('오류: ' + (e.message || e)); } finally { $('#busy').hidden = true; } }

const S = {
  user: null, accounts: [], borrow: [], extra: {}, rules: {}, months: {},
  view: 'day', date: today(), sel: new Set(), applyRule: true, open: new Set(),
  tx: { from: ymOf(today()) + '-01', to: today(), acct: 'all', dir: 'all', q: '', byParty: false, list: null },
  pending: null, openYm: ymOf(today()), exp: { mode: 'day', date: today(), from: ymOf(today()) + '-01', to: today(), ym: ymOf(today()), ledger: true }
};

/* ---------- Firebase ---------- */
let db, auth;
if (!firebaseConfig.apiKey) {
  $('#loginMsg').hidden = false;
  $('#loginMsg').textContent = 'index.html 상단의 firebaseConfig에 Firebase 웹 앱 설정값을 먼저 넣어 주세요.';
  $('#loginBtn').disabled = true;
} else {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore(); auth = firebase.auth();
  const TS = () => firebase.firestore.FieldValue.serverTimestamp();
  window.TS = TS;
  $('#loginBtn').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => toast(e.message));
  $('#logoutBtn').onclick = () => auth.signOut();
  auth.onAuthStateChanged(async u => {
    if (!u) { $('#app').hidden = true; $('#login').hidden = false; return; }
    try {
      const ok = await db.collection('allowedUsers').doc(u.email).get();
      if (!ok.exists) throw new Error('not allowed');
    } catch (e) {
      $('#loginMsg').hidden = false;
      $('#loginMsg').textContent = `${u.email} 계정은 아직 접근 권한이 없어요. 관리자가 Firestore의 allowedUsers 컬렉션에 이 이메일을 문서 ID로 추가해야 합니다.`;
      await auth.signOut(); return;
    }
    S.user = u; $('#who').textContent = u.email;
    await busy(loadSettings);
    $('#login').hidden = true; $('#app').hidden = false;
    go('day');
  });
}

async function loadSettings() {
  const docs = await Promise.all(['accounts', 'borrow', 'extra', 'groupNames', 'autoGroups'].map(k => db.collection('settings').doc(k).get()));
  const [a, b, e, gn, ag] = docs.map(d => d.exists ? d.data() : null);
  S.autoGroups = Object.assign(clone(DEFAULT_AUTOGROUPS), ag || {});
  S.groupNames = gn && gn.list ? gn.list : [];
  S.accounts = a && a.list && a.list.length ? a.list : clone(DEFAULT_ACCOUNTS);
  S.borrow = b && b.list ? b.list : clone(DEFAULT_BORROW);
  S.extra = Object.assign(clone(DEFAULT_EXTRA), e || {});
  const rs = await db.collection('rules').get(); S.rules = {};
  rs.forEach(d => S.rules[d.id] = d.data());
}
const accMap = () => new Map(S.accounts.map(a => [a.acct6, a]));
const bankShort = a => String(a.bank || '').replace(/은행|증권/g, '').trim() || '';
const accName = a => a ? `${bankShort(a)} ${a.acct6}`.trim() : '';
const accNameOf = acct6 => { const a = S.accounts.find(x => x.acct6 === acct6); return a ? accName(a) : acct6; };
const PREFIX_BY_SCHOOL = { '기숙 QUETTA': '학원_', '퀀텀1': '퀀텀1_', '퀀텀2': '퀀텀2_', '이천DS연수원': '이천DS_', '양양DS연수원': '양양DS_' };
const defaultPrefix = a => PREFIX_BY_SCHOOL[String(a.school || '').trim()] || '';
const prefixOfAcc = a => a ? (a.prefix !== undefined && a.prefix !== null ? a.prefix : defaultPrefix(a)) : '';
const allPrefixes = () => [...new Set(S.accounts.map(prefixOfAcc).filter(Boolean))];
PREFIX_OF.fn = t => {
  const a = S.accounts.find(x => x.acct6 === t.acct6), p = prefixOfAcc(a), d = defaultLabel(t);
  if (!p || allPrefixes().some(x => d.startsWith(x))) return '';
  return p;
};
const ruleLabelFor = (rule, t) => (rule.pfx ? prefixOfAcc(S.accounts.find(x => x.acct6 === t.acct6)) : '') + rule.label;
const accOrder = () => new Map(S.accounts.map((a, i) => [a.acct6, i]));

async function getMonth(ym, force) {
  if (S.months[ym] && !force) return S.months[ym];
  const days = daysOf(ym), from = days[0], to = days[days.length - 1];
  const docId = firebase.firestore.FieldPath.documentId();
  const [ts, ms, op] = await Promise.all([
    db.collection('txns').where('date', '>=', from).where('date', '<=', to).get(),
    db.collection('manual').where(docId, '>=', from).where(docId, '<=', to).get(),
    db.collection('openings').doc(ym).get()
  ]);
  const m = { txns: new Map(), manual: {}, opening: op.exists ? op.data() : null };
  ts.forEach(d => m.txns.set(d.id, { id: d.id, ...d.data() }));
  ms.forEach(d => m.manual[d.id] = d.data());
  S.months[ym] = m; return m;
}
function findTx(id) { for (const m of Object.values(S.months)) if (m.txns.has(id)) return m.txns.get(id); if (S.tx.list) return S.tx.list.find(t => t.id === id); }

/* ---------- 하루치 집계 ---------- */
function dayFlows(ym, date) {
  const m = S.months[ym], am = accMap(), order = accOrder();
  const txs = [...m.txns.values()].filter(t => t.date === date && am.has(t.acct6)).sort(cmpTx);
  const man = m.manual[date] || {};
  const acctIn = {}, acctOut = {}; let cashIn = 0, cashOut = 0;
  const inRows = [], outRows = [], groups = {};
  for (const t of txs) {
    const a = am.get(t.acct6);
    for (const [dir, amt, rows, bucket] of [['in', num(t.inAmt), inRows, acctIn], ['out', num(t.outAmt), outRows, acctOut]]) {
      if (!amt) continue;
      bucket[t.acct6] = (bucket[t.acct6] || 0) + amt;
      const ar = dir === 'in' && !t.groupId && !t.autoOut ? (S.autoGroups.rules || []).find(x => x.acct6 === t.acct6) : null;
      if (ar && isCardTx(t, S.autoGroups)) {
        const k = 'auto:' + t.acct6;
        if (!groups[k]) { groups[k] = { dir, subject: a.subject, label: ar.name, acct6: t.acct6, amt: 0, ord: order.get(t.acct6), time: t.time, members: [], autoKey: k }; rows.push(groups[k]); }
        groups[k].amt += amt; groups[k].members.push(t);
      } else if (t.groupId) {
        const k = dir + t.groupId;
        if (!groups[k]) { groups[k] = { dir, subject: a.subject, label: t.groupLabel || rowLabel(t), acct6: t.acct6, amt: 0, ord: order.get(t.acct6), time: t.time, members: [], groupId: t.groupId }; rows.push(groups[k]); }
        groups[k].amt += amt; groups[k].members.push(t);
      } else rows.push({ dir, subject: a.subject, label: rowLabel(t), acct6: t.acct6, amt, ord: order.get(t.acct6), time: t.time, members: [t], pulledOut: !!t.autoOut });
    }
  }
  for (const [dir, list, rows, bucket] of [['in', man.inRows || [], inRows, acctIn], ['out', man.outRows || [], outRows, acctOut]]) {
    for (const r of list) {
      const amt = num(r.amt); if (!amt && !r.label) continue;
      const isCash = r.acct6 === 'cash' || !am.has(r.acct6);
      if (isCash) { if (dir === 'in') cashIn += amt; else cashOut += amt; }
      else bucket[r.acct6] = (bucket[r.acct6] || 0) + amt;
      rows.push({ dir, subject: isCash ? '현금' : am.get(r.acct6).subject, label: r.label || '', acct6: isCash ? '' : r.acct6, amt, ord: isCash ? 999 : order.get(r.acct6), time: '99', manual: r });
    }
  }
  const sorter = (a, b) => a.ord - b.ord || String(a.time).localeCompare(String(b.time));
  inRows.sort(sorter); outRows.sort(sorter);
  const ex = { sales: clone(man.sales || {}), people: clone(man.people || {}), bond: clone(man.bond || {}), loan: clone(man.loan || {}), borrow: clone(man.borrow || {}) };
  (man.entries || []).forEach(en => {
    const [top, ...rest] = en.key.split('.'), keys = rest.map(decodeURIComponent);
    let o = ex[top]; if (!o) return;
    keys.slice(0, -1).forEach(k => o = o[k] = o[k] || {});
    const last = keys[keys.length - 1]; o[last] = num(o[last]) + num(en.amt);
  });
  return { acctIn, acctOut, cashIn, cashOut, inRows, outRows, ...ex, txs, man };
}

function timeline(ym) {
  const m = S.months[ym], op = m.opening || {};
  const acc = {}; S.accounts.forEach(a => acc[a.acct6] = num((op.accts || {})[a.acct6]));
  let cash = num(op.cash), bond = num(op.bond), loan = num(op.loan), people = num(op.people);
  const sales = {}; SALES_ROWS.forEach(([k]) => sales[k] = { cash: 0, dep: 0, card: 0 });
  const bor = {}; S.borrow.forEach(b => bor[b.name] = num((op.borrow || {})[b.name]));
  const days = {};
  for (const date of daysOf(ym)) {
    const f = dayFlows(ym, date);
    days[date] = { date, f, open: { acc: { ...acc }, cash, bond, loan, people, salesCum: clone(sales), bor: { ...bor } } };
    S.accounts.forEach(a => acc[a.acct6] += num(f.acctIn[a.acct6]) - num(f.acctOut[a.acct6]));
    cash += f.cashIn - f.cashOut;
    bond += num(f.bond.in) - num(f.bond.out); loan += num(f.loan.in) - num(f.loan.out);
    people += num(f.people.reg) - num(f.people.refund);
    SALES_ROWS.forEach(([k]) => ['cash', 'dep', 'card'].forEach(x => sales[k][x] += num((f.sales[k] || {})[x])));
    S.borrow.forEach(b => { const io = f.borrow[b.name] || {}; bor[b.name] += num(io.in) - num(io.repay); });
  }
  return { days, close: { acc, cash, bond, loan, people, bor }, hasOpening: !!m.opening };
}
function lastBalances(ym, date) {
  const out = {};
  [...S.months[ym].txns.values()].filter(t => t.date === date).sort(cmpTx).forEach(t => out[t.acct6] = num(t.bal));
  return out;
}

/* ---------- 네비게이션 ---------- */
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) go(b.dataset.view); });
function go(v) {
  S.view = v;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view === v));
  ['day', 'txns', 'upload', 'export', 'settings', 'inv', 'vendors'].forEach(k => $('#v-' + k).hidden = k !== v);
  ({ day: renderDay, txns: renderTxns, upload: renderUpload, export: renderExport, settings: renderSettings, inv: renderInv, vendors: renderVendors })[v]();
}

/* =========================================================
   일보 화면
   ========================================================= */
async function renderDay() {
  const el = $('#v-day'), ym = ymOf(S.date);
  await busy(() => getMonth(ym));
  const tl = timeline(ym), day = tl.days[S.date], f = day.f, op = day.open;
  const bank = lastBalances(ym, S.date), am = accMap();
  let allOk = true, anyBank = false;
  const accRows = S.accounts.map(a => {
    const o = num(op.acc[a.acct6]), i = num(f.acctIn[a.acct6]), x = num(f.acctOut[a.acct6]), c = o + i - x;
    const b = bank[a.acct6]; let chk = '<span class="hint">-</span>';
    if (b !== undefined) { anyBank = true; const d = c - b; if (d === 0) chk = '<span class="okC">일치</span>'; else { allOk = false; chk = `<span class="diff">차이 ${won(d)}</span>`; } }
    return `<tr><td><span class="tag">${esc(accName(a))}</span> <span class="hint">${esc(a.school)}</span></td><td class="num">${won(o)}</td><td class="num inC">${wonOrBlank(i)}</td><td class="num outC">${wonOrBlank(x)}</td><td class="num"><b>${won(c)}</b></td><td class="num hint">${b !== undefined ? won(b) : ''}</td><td>${chk}</td></tr>`;
  }).join('');
  const sum = k => S.accounts.reduce((s, a) => s + num(k(a)), 0);
  const tO = sum(a => op.acc[a.acct6]), tI = sum(a => f.acctIn[a.acct6]), tX = sum(a => f.acctOut[a.acct6]);
  const cashClose = op.cash + f.cashIn - f.cashOut;
  const stamp = !tl.hasOpening ? '<span class="stamp pending">이월<br>미설정</span>' : (!anyBank ? '<span class="stamp pending">거래<br>없음</span>' : (allOk ? '<span class="stamp">잔액<br>일치</span>' : '<span class="stamp pending">잔액<br>확인</span>'));

  el.innerHTML = `
  <div class="dayhead">
    <button class="navbtn" data-act="prev" aria-label="전날">‹</button>
    <h1>${dayLabel(S.date)}</h1>
    <button class="navbtn" data-act="next" aria-label="다음날">›</button>
    <input type="date" class="in" data-act="pick" value="${S.date}">
    <button class="btn sm" data-act="today">오늘</button>
    <span class="spacer"></span>
    <label class="row hint"><input type="checkbox" data-act="rule" ${S.applyRule ? 'checked' : ''}> 수정한 내역을 같은 적요·거래처에 자동 적용</label>
    <button class="btn" data-act="dl-day">이 날짜 엑셀 받기</button>
  </div>
  ${!tl.hasOpening ? `<div class="warn">${ym.replace('-', '년 ')}월 월초 이월잔액이 아직 없어요. 전일이월이 0원으로 계산됩니다. <button class="btn sm" data-act="go-open">이월잔액 설정하기</button></div>` : ''}
  ${peopleHtml(f, op)}
  <div class="book">
    <div class="book-top"><div><b>계좌별 잔액</b><div class="hint">차일이월과 은행 잔액(그날 마지막 거래 기준)을 비교해요.</div></div>${stamp}</div>
    <div class="scroll"><table class="t">
      <thead><tr><th>계좌</th><th class="num">전일이월</th><th class="num">입금</th><th class="num">출금</th><th class="num">차일이월</th><th class="num">은행 잔액</th><th>확인</th></tr></thead>

/* 예전에 쓴 내역 이름 (자동 추천) */
function labelHints() {
  const s = new Set();
  Object.values(S.rules).forEach(r => r.label && s.add(r.label));
  (S.groupNames || []).forEach(x => s.add(x));
  (S.autoGroups.rules || []).forEach(r => r.name && s.add(r.name));
  Object.values(S.months).forEach(m => {
    m.txns.forEach(t => { if (t.label) s.add(t.label); if (t.groupLabel) s.add(t.groupLabel); });
    Object.values(m.manual).forEach(d => ['inRows', 'outRows', 'entries'].forEach(k => (d[k] || []).forEach(r => r.label && s.add(r.label))));
  });
  return [...s];
}
/* 두 글자 이상 치면 예전에 쓴 내역 추천 */
const SG = { el: null, input: null, idx: -1, items: [] };
function hideSugg() { if (SG.el) SG.el.remove(); SG.el = null; SG.input = null; SG.idx = -1; }
function showSugg(input) {
  const v = input.value.trim();
  if (v.length < 2) return hideSugg();
  const low = v.toLowerCase();
  const items = labelHints().filter(x => x.toLowerCase().includes(low) && x !== v)
    .sort((a, b) => (a.toLowerCase().indexOf(low) - b.toLowerCase().indexOf(low)) || a.length - b.length).slice(0, 8);
  if (!items.length) return hideSugg();
  if (!SG.el) { SG.el = document.createElement('div'); SG.el.className = 'sugg'; document.body.appendChild(SG.el); }
  SG.input = input; SG.items = items; SG.idx = -1;
  const r = input.getBoundingClientRect();
  Object.assign(SG.el.style, { left: (r.left + window.scrollX) + 'px', top: (r.bottom + window.scrollY + 2) + 'px', minWidth: r.width + 'px' });
  SG.el.innerHTML = items.map((x, i) => { const k = x.toLowerCase().indexOf(low); return `<div data-i="${i}">${esc(x.slice(0, k))}<mark>${esc(x.slice(k, k + v.length))}</mark>${esc(x.slice(k + v.length))}</div>`; }).join('');
  SG.el.onmousedown = e => { const d = e.target.closest('[data-i]'); if (!d) return; e.preventDefault(); pickSugg(+d.dataset.i); };
}
function pickSugg(i) {
  const input = SG.input, val = SG.items[i]; hideSugg();
  if (!input) return;
  input.value = val; input.focus();
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('[data-suggest]')) showSugg(e.target); });
document.addEventListener('focusout', e => { if (e.target === SG.input) setTimeout(() => { if (document.activeElement !== SG.input) hideSugg(); }, 120); });
document.addEventListener('keydown', e => {
  if (!SG.el || e.target !== SG.input) return;
  const n = SG.items.length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SG.idx = (SG.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; SG.el.querySelectorAll('[data-i]').forEach((d, i) => d.classList.toggle('on', i === SG.idx)); }
  else if (e.key === 'Enter' && SG.idx >= 0) { e.preventDefault(); e.stopImmediatePropagation(); pickSugg(SG.idx); }
  else if (e.key === 'Escape') hideSugg();
}, true);
window.addEventListener('scroll', hideSugg, true);

const itemLabel = key => { if (key === 'people.reg') return '인원 · 등록'; if (key === 'people.refund') return '인원 · 환불'; for (const [, list] of manualItems()) for (const [k, l] of list) if (k === key) return l; return key; };

function manualPanelHtml(f, op) {

  (man.entries || []).forEach(r => rows.push({ kind: 'entry', r, item: itemLabel(r.key) }));
  // 이전 방식으로 입력한 값 (칸 입력)

  const walk = (obj, path) => Object.entries(obj || {}).forEach(([k, val]) => { if (val && typeof val === 'object') walk(val, [...path, k]); else if (num(val)) legacy.push({ key: [path[0], ...path.slice(1).map(encodeURIComponent), encodeURIComponent(k)].join('.'), amt: num(val) }); });
  ['sales', 'bond', 'loan', 'borrow'].forEach(t => walk(man[t], [t]));

  const list = rows.map(({ kind, r, item }) => {

  const lines = manualItems().filter(([, items]) => items.length).map(([g, items], gi) => {

      <input class="in" data-m="label" data-suggest placeholder="내역" aria-label="내역">

  }).join('');
  return `<div class="mpanel">
    <h2>직접 입력 <span class="hint" style="font-weight:400">현금·매출·채권처럼 은행 내역에 없는 항목</span></h2>
    ${rows.length || legacy.length ? `<div class="scroll"><table class="mlist"><tbody>${list}</tbody></table></div>` : '<p class="hint">아직 직접 입력한 항목이 없어요.</p>'}

}

async function saveLabel(id, raw) {
  const t = findTx(id); if (!t) return;
  const val = raw.trim(), def = autoLabel(t);
  if (!val || val === def) {
    if (!t.label) return;
    await db.collection('txns').doc(id).update({ label: null, labelSrc: null });
    t.label = null; t.labelSrc = null; toast('원래 내역으로 되돌렸어요'); return renderDay();
  }
  if (val === t.label) return;
  await db.collection('txns').doc(id).update({ label: val, labelSrc: 'manual' });
  t.label = val; t.labelSrc = 'manual';
  let msg = '저장했어요';
  if (S.applyRule) {
    const k = ruleKey(t);
    const pfxNow = PREFIX_OF.fn(t), pfx = !!pfxNow && val.startsWith(pfxNow);
    const rule = { label: pfx ? val.slice(pfxNow.length) : val, pfx, memo1: (t.memo1 || t.memo || '').trim(), party: (t.party || '').trim(), updatedAt: TS(), by: S.user.email };
    await db.collection('rules').doc(k).set(rule); S.rules[k] = rule;
    const targets = [];
    for (const m of Object.values(S.months)) for (const x of m.txns.values()) if (x.id !== id && !x.label && ruleKey(x) === k) targets.push(x);
    await commitBatches(targets.map(x => ref => ref.update(db.collection('txns').doc(x.id), { label: ruleLabelFor(rule, x), labelSrc: 'rule' })));
    targets.forEach(x => { x.label = ruleLabelFor(rule, x); x.labelSrc = 'rule'; });
    msg = targets.length ? `저장했어요. 같은 내역 ${targets.length}건에도 적용했어요` : '저장했어요. 다음 업로드부터 같은 내역에 자동 적용돼요';
  }
  toast(msg); renderDay();
}

async function commitBatches(ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const batch = db.batch(); ops.slice(i, i + 400).forEach(op => op(batch)); await batch.commit();
  }
}

async function groupSelected() {

function pickGroupName(def, n, sum) {
  return new Promise(resolve => {

    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="묶기 이름">

function normDate(v) {
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; }
  const s = String(v).trim(), m = s.match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
}
function normTime(v) {
  if (typeof v === 'number') { const t = Math.round((v % 1) * 86400); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; }
  return String(v || '').trim();
}

async function parseOneUpload(file, fi) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  const hi = rows.findIndex(r => r.map(x => String(x).trim()).includes('계좌번호') && r.map(x => String(x).trim()).includes('입금액'));
  if (hi < 0) throw new Error('계좌번호·입금액 머리글이 없어요');
  const H = rows[hi].map(h => String(h).trim()), col = n => H.indexOf(n);
  const data = rows.slice(hi + 1).filter(r => String(r[col('계좌번호')] || '').trim() && String(r[col('거래일자')] || '').trim());
  const N = data.length, seen = new Set();
  return data.map((r, i) => {
    const g = n => { const k = col(n); return k < 0 ? '' : r[k]; }, s = n => String(g(n) ?? '').trim();
    const t = { site: s('사업장'), bank: s('금융기관'), acctNo: s('계좌번호'), acct6: acct6(g('계좌번호')), alias: s('계좌별칭'),
      date: normDate(g('거래일자')), time: normTime(g('거래시간')), inAmt: num(g('입금액')), outAmt: num(g('출금액')), bal: num(g('잔액')),
      dayBal: num(g('일자잔액')), periodBal: num(g('기간잔액')), memo: s('적요'), memo1: s('적요1'), memo2: s('적요2'), branch: s('취급점'),
      party: s('의뢰인/수취인'), note: s('비고'), ord: N - i, fi };
    let id = makeId(t); while (seen.has(id)) id += '_d'; seen.add(id); t.id = id;
    return t;
  }).filter(t => t.date);
}
async function parseUploads(fileList) {
  const am = accMap(), unknown = new Set(), files = [], errors = [], byId = new Map();
  for (const [fi, file] of fileList.entries()) {
    try {
      const txs = await parseOneUpload(file, fi);
      files.push({ name: file.name, count: txs.length });
      txs.forEach(t => { if (!byId.has(t.id)) byId.set(t.id, t); if (!am.has(t.acct6)) unknown.add(`${t.acctNo}${t.alias ? ' (' + t.alias + ')' : ''}`); });
    } catch (e) { errors.push(`${file.name} (${e.message})`); files.push({ name: file.name, count: 0 }); }
  }
  const txs = [...byId.values()].sort((a, b) => -cmpTx(a, b));
  if (!txs.length) throw new Error('읽을 수 있는 거래가 없어요. 수시입출계좌 원본 파일인지 확인해 주세요');
  const dates = txs.map(t => t.date).sort(), min = dates[0], max = dates[dates.length - 1];
  const exist = new Set(); (await db.collection('txns').where('date', '>=', min).where('date', '<=', max).get()).forEach(d => exist.add(d.id));
  const newIds = new Set(txs.filter(t => !exist.has(t.id)).map(t => t.id));
  S.pending = { files, errors, txs, newIds, newCount: newIds.size, min, max, unknown: [...unknown] };
  renderUpload();
}

async function saveUpload() {
  const p = S.pending;
  const refs = p.files.map(() => db.collection('uploads').doc());
  const ops = p.txs.map(t => {
    const ref = db.collection('txns').doc(t.id), up = refs[t.fi];
    if (!p.newIds.has(t.id)) return b => b.update(ref, { uploadIds: firebase.firestore.FieldValue.arrayUnion(up.id) });
    const { id, fi, ...data } = t, rule = S.rules[ruleKey(t)];
    return b => b.set(ref, { ...data, uploadIds: [up.id], label: rule ? ruleLabelFor(rule, t) : null, labelSrc: rule ? 'rule' : null, groupId: null, groupLabel: null, createdAt: TS(), by: S.user.email });
  });
  await commitBatches(ops);
  await Promise.all(p.files.map((f, i) => {
    const mine = p.txs.filter(t => t.fi === i); if (!mine.length) return null;
    const ds = mine.map(t => t.date).sort();
    return refs[i].set({ fileName: f.name, at: TS(), by: S.user.email, count: mine.length, newCount: mine.filter(t => p.newIds.has(t.id)).length, minDate: ds[0], maxDate: ds[ds.length - 1] });
  }));
  new Set(p.txs.map(t => ymOf(t.date))).forEach(ym => delete S.months[ym]);
  S.tx.list = null; IV.invs = null;
  toast(`${p.files.length}개 파일에서 새 거래 ${p.newCount}건을 저장했어요`);
  S.pending = null; S.date = p.max; go('day');
}

async function doExport() {
  const e = S.exp; let from, to;
  if (e.mode === 'day') from = to = e.date;
  else if (e.mode === 'range') { from = e.from; to = e.to; }
  else { const d = daysOf(e.ym); from = d[0]; to = d[d.length - 1]; }
  if (!from || !to || from > to) return toast('날짜를 확인해 주세요');
  const dates = []; for (let d = from; d <= to; d = addDays(d, 1)) dates.push(d);
  if (dates.length > 92) return toast('한 번에 92일까지 받을 수 있어요');
  const yms = [...new Set(dates.map(ymOf))];
  for (const ym of yms) await getMonth(ym);
  const tls = Object.fromEntries(yms.map(ym => [ym, timeline(ym)]));
  const multiMonth = yms.length > 1;
  const wb = new ExcelJS.Workbook(); wb.creator = 'QUETTA 자금일보'; wb.calcProperties.fullCalcOnLoad = true;
  let prev = null, L = null; const names = [];
  for (const date of dates) {
    const ym = ymOf(date), day = tls[ym].days[date], [, mm, dd] = date.split('-').map(Number);
    const name = multiMonth ? `${mm}.${dd}` : String(dd);
    const prevName = prev && ymOf(prev.date) === ym && addDays(prev.date, 1) === date ? prev.name : null;
    L = writeDaySheet(wb, name, { date, prevName, accounts: S.accounts, borrow: S.borrow, extra: S.extra, open: day.open, f: day.f });
    prev = { date, name }; names.push(name);
  }
  if (e.mode === 'month') writeStatusSheet(wb, { first: names[0], last: names[names.length - 1], names, lastDate: to, accounts: S.accounts, borrow: S.borrow, extra: S.extra, L });
  if (e.ledger) {
    const list = []; yms.forEach(ym => S.months[ym].txns.forEach(t => { if (t.date >= from && t.date <= to) list.push(t); }));
    list.sort((a, b) => -cmpTx(a, b));
    writeLedgerSheet(wb, '통합내역', list, true);
  }
  const [y, m] = from.split('-');
  const fname = e.mode === 'month' ? `강남대성_QUETTA_${y.slice(2)}년_${+m}월_자금일보.xlsx`
    : e.mode === 'day' ? `강남대성_QUETTA_자금일보_${from.replace(/-/g, '')}.xlsx`
    : `강남대성_QUETTA_자금일보_${from.replace(/-/g, '')}-${to.replace(/-/g, '')}.xlsx`;
  await saveWb(wb, fname);
  if (yms.some(ym => !tls[ym].hasOpening)) toast('월초 이월잔액이 없는 달이 있어 전일이월이 0원으로 들어갔어요');
}
async function saveWb(wb, name) {
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    if (!S.months[pym].opening) toast('전월 이월잔액도 비어 있어서 전월 거래만 반영됐어요. 값을 확인해 주세요');
    fillOp({ accts: c.acc, cash: c.cash, bond: c.bond, loan: c.loan, people: c.people, borrow: c.bor });
  });
  $('#opBank').onclick = () => {
    const first = {};
    [...S.months[ym].txns.values()].sort(cmpTx).forEach(t => { if (!(t.acct6 in first)) first[t.acct6] = num(t.bal) - num(t.inAmt) + num(t.outAmt); });
    const n = Object.keys(first).length;
    if (!n) return toast('이 달에 업로드된 거래가 없어요');
    const cur = {}; $('#opForm').querySelectorAll('[data-op^="accts."]').forEach(i => { const k = i.dataset.op.split('.')[1]; if (k in first) i.value = won(first[k]); });
    toast(`${n}개 계좌를 은행 잔액 기준으로 채웠어요. 저장해야 반영돼요`);
  };
  function fillOp(o) {
    $('#opForm').querySelectorAll('[data-op]').forEach(inp => {
      const [a, b] = inp.dataset.op.split('.');
      const val = b !== undefined ? (o[a] || {})[decodeURIComponent(b)] : o[a];
      inp.value = wonOrBlank(val);
    });
    toast('채웠어요. 확인 후 저장해 주세요');
  }
  el.querySelectorAll('[data-rule]').forEach(inp => inp.onchange = async () => {
    const k = inp.dataset.rule, label = inp.value.trim(); if (!label) return;
    await db.collection('rules').doc(k).update({ label, updatedAt: TS(), by: S.user.email }); S.rules[k].label = label; toast('규칙을 고쳤어요. 앞으로 올리는 거래부터 적용돼요');
  });
  el.querySelectorAll('[data-rdel]').forEach(b => b.onclick = async () => {
    if (!confirm('이 규칙을 삭제할까요? 이미 들어간 일보 내역은 그대로 남아요.')) return;
    await db.collection('rules').doc(b.dataset.rdel).delete(); delete S.rules[b.dataset.rdel]; toast('삭제했어요'); renderSettings();
  });
  $('#accAdd').onclick = () => { $('#accTbl tbody').insertAdjacentHTML('beforeend', accRowHtml({ subject: '보통예금', school: '기숙 QUETTA' }, S.accounts.length + Math.random())); };
  $('#accTbl').onclick = e => { const b = e.target.closest('[data-adel]'); if (b && confirm('이 계좌를 목록에서 뺄까요? 저장해야 반영돼요.')) b.closest('tr').remove(); };
  $('#accSave').onclick = () => busy(async () => {
    const list = [...$('#accTbl tbody').querySelectorAll('tr')].map(tr => {
      const o = {}; tr.querySelectorAll('[data-a]').forEach(i => o[i.dataset.a] = i.value.trim()); o.acct6 = acct6(o.acct6); return o;
    }).filter(a => a.acct6.length === 6);
    if (new Set(list.map(a => a.acct6)).size !== list.length) throw new Error('끝 6자리가 같은 계좌가 있어요');
    list.forEach(a => { const old = S.accounts.find(x => x.acct6 === a.acct6); if (old && old.short) a.short = old.short; });
    await db.collection('settings').doc('accounts').set({ list, updatedAt: TS(), by: S.user.email });
    S.accounts = list; toast('계좌 목록을 저장했어요'); renderSettings();
  });
  $('#borAdd').onclick = () => $('#borList').insertAdjacentHTML('beforeend', `<div class="row" style="margin-bottom:6px"><input class="in" data-b="name" placeholder="차입처"><input class="in" data-b="rate" style="width:90px" placeholder="이율 %"><input class="in" data-b="note" placeholder="비고"><button class="btn ghost sm" data-bdel>삭제</button></div>`);
  $('#borList').onclick = e => { const b = e.target.closest('[data-bdel]'); if (b) b.closest('.row').remove(); };
  $('#exSave').onclick = () => busy(async () => {
    const extra = { bondName: $('#exBondName').value.trim(), bondNote: $('#exBondNote').value.trim(), loanName: $('#exLoanName').value.trim(), loanNote: $('#exLoanNote').value.trim() };
    const borrow = [...$('#borList').querySelectorAll('.row')].map(r => ({ name: r.querySelector('[data-b=name]').value.trim(), rate: num(r.querySelector('[data-b=rate]').value) / 100, note: r.querySelector('[data-b=note]').value.trim() })).filter(b => b.name);
    await Promise.all([db.collection('settings').doc('extra').set({ ...extra, updatedAt: TS(), by: S.user.email }), db.collection('settings').doc('borrow').set({ list: borrow, updatedAt: TS(), by: S.user.email })]);
    S.extra = extra; S.borrow = borrow; toast('저장했어요'); renderSettings();
  });
}
function accRowHtml(a, i) {
  const f = (k, w) => `<input class="in" data-a="${k}" style="width:${w}px" value="${esc(a[k] || '')}">`;
  return `<tr><td>${f('acct6', 80)}</td><td><select class="in" data-a="subject"><option ${a.subject === '보통예금' ? 'selected' : ''}>보통예금</option><option ${a.subject === '기타제예금' ? 'selected' : ''}>기타제예금</option></select></td>
    <td>${f('school', 110)}</td><td>${f('disp', 180)}</td><td>${f('bank', 90)}</td><td>${f('kind', 80)}</td><td>${f('no', 150)}</td><td><input class="in" data-a="prefix" style="width:90px" value="${esc(prefixOfAcc(a))}" placeholder="없음"></td><td>${f('note', 130)}</td><td><button class="btn ghost sm" data-adel="${i}">빼기</button></td></tr>`;
}

<script>
// ==MATCH START==
/* ---------- 세금계산서 매칭 핵심 로직 ---------- */
const BANK_CODES = { '산업': '002', '기업': '003', '국민': '004', '수협': '007', '농협': '011', '지역농협': '012', '농축협': '012', '우리': '020', 'SC제일': '023', '제일': '023', '씨티': '027', '대구': '031', '부산': '032', '광주': '034', '제주': '035', '전북': '037', '경남': '039', '새마을': '045', '새마을금고': '045', '신협': '048', '저축': '050', '우체국': '071', '하나': '081', '신한': '088', '케이뱅크': '089', '카카오': '090', '카카오뱅크': '090', '토스': '092', '토스뱅크': '092', '산림': '064' };
const DEFAULT_MATCH = {
  buyDay: 10, sellDay: 31, myDisplay: '기숙QUETTA',
  ourBiz: [
    { biz: '607-85-41094', name: '강남대성기숙학원', accts: '' },
    { biz: '729-85-01903', name: '이천DS퀀텀라이브러리2', accts: '' },
    { biz: '711-85-01557', name: '이천DS연수원', accts: '566238' },
    { biz: '476-85-01673', name: '양양DS연수원', accts: '566225' }
  ]
};
const bizKey = s => String(s || '').replace(/\D/g, '');
const digits = s => String(s || '').replace(/\D/g, '');
const normName = s => String(s || '').normalize('NFKC').toLowerCase()
  .replace(/주식회사|유한회사|사단법인|재단법인|\(주\)|\(유\)|\(사\)|\(재\)|^주\)|^주\s|\s주\)|주\)$/g, '')
  .replace(/외\s*\d+\s*인/g, '').replace(/[\s()\[\]{}.,·:;\-_/\\'"&]+/g, '');
const learnName = s => normName(s).replace(/\d+$/, '');
const codeTokens = note => [...new Set((String(note || '').normalize('NFKC').toUpperCase().match(/[A-Z]\d{5,}/g) || []).map(t => t.slice(0, 5)))];
const txCodeText = t => `${t.party || ''}${t.memo1 || ''}${t.memo2 || ''}`.normalize('NFKC').toUpperCase().replace(/[\s()（）]/g, '');
const bankCodeOf = (name, code) => { const c = digits(code); if (c) return c.padStart(3, '0'); const n = String(name || '').replace(/은행$/, '').trim(); return BANK_CODES[n] || ''; };
const nextMonthDay = (date, day) => { const [y, m] = date.split('-').map(Number); const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1; const last = new Date(ny, nm, 0).getDate(); return `${ny}-${String(nm).padStart(2, '0')}-${String(Math.min(day, last)).padStart(2, '0')}`; };
function invWindow(inv, cfg) { const start = inv.date || `${inv.ym}-01`; return [start, nextMonthDay(start, inv.kind === 'sell' ? cfg.sellDay : cfg.buyDay)]; }

function invNames(inv, v) {
  const list = [inv.vendorName, inv.holder, ...String(inv.ceo || '').split(/[,/]/)];
  if (v) list.push(v.name, v.holder, ...(v.aliases || []), ...(inv.kind === 'sell' ? (v.inNames || []) : (v.outNames || [])));
  return [...new Set(list.map(normName).filter(n => n.length >= 2))];
}
function nameHit(names, t) {
  const fields = [normName(t.party), normName(t.memo1)];
  return names.some(n => fields.some((f, i) => f && (f.includes(n) || (f.length >= 3 && n.includes(f) && (i === 0 || f.length >= 4)))));
}
function codeHit(inv, t) { const toks = codeTokens(inv.note); if (!toks.length) return false; const tx = txCodeText(t); return toks.some(k => tx.includes(k)); }

/* invs: 해당 월 계산서 / txns: 기간 내 거래 / vendorOf(inv) / batches / cfg
   반환: { inv: Map(id→patch), batch: Map(id→patch), suggest: {batchId:[{txId,amt,missing:[invIds]}]} } */
function runMatch(invs, txns, vendorOf, batches, cfg) {
  const out = { inv: new Map(), batch: new Map(), suggest: {} };
  const st = new Map(invs.map(i => [i.id, { ...i }]));
  const patch = (id, p) => { Object.assign(st.get(id), p); out.inv.set(id, { ...(out.inv.get(id) || {}), ...p }); };
  const used = new Set();
  invs.forEach(i => { if (i.status === 'paid') (i.matchTxIds || []).forEach(x => used.add(x)); });
  batches.forEach(b => { if (b.txId) used.add(b.txId); });
  const sorted = [...txns].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || (a.ord || 0) - (b.ord || 0));
  const outs = sorted.filter(t => t.outAmt > 0), ins = sorted.filter(t => t.inAmt > 0);
  const amtOf = (t, kind) => kind === 'sell' ? t.inAmt : t.outAmt;
  const siteAccts = biz => { const o = (cfg.ourBiz || []).find(x => bizKey(x.biz) === bizKey(biz)); return o && o.accts ? String(o.accts).split(/[,\s]+/).filter(Boolean) : null; };
  const txOk = (inv, t) => { if (inv.kind !== 'sell') return true; const a = siteAccts(inv.ourBiz); return !a || a.includes(t.acct6); };
  const descr = t => `${t.date} ${t.party || t.memo1 || ''} ${Number(amtOf(t, t.inAmt > 0 ? 'sell' : 'buy')).toLocaleString('ko-KR')}`;

  // 0단계: 대량이체 묶음 = 합계와 같은 출금 한 줄
  for (const b of batches) {
    if (b.status !== 'planned') continue;
    const from = addDays(b.date, -3), to = addDays(b.date, 40);
    const inRange = t => !used.has(t.id) && t.date >= from && t.date <= to;
    const hit = outs.find(t => inRange(t) && t.outAmt === b.total);
    if (hit) {
      used.add(hit.id);
      out.batch.set(b.id, { status: 'paid', txId: hit.id, payDate: hit.date });
      b.items.forEach(it => { if (it.invId && st.has(it.invId)) patch(it.invId, { status: 'paid', matchType: 'batch', matchTxIds: [hit.id], matchDate: hit.date, matchText: `대량이체 ${b.items.length}건 일괄 (${hit.date})`, batchId: b.id }); });
      continue;
    }
    // 합계가 다르면: 빠진 건(1~2건) 추정
    const items = b.items.filter(it => it.invId);
    const sug = [];
    outs.filter(t => inRange(t) && t.outAmt < b.total && t.outAmt > b.total * 0.3).forEach(t => {
      const diff = b.total - t.outAmt;
      items.forEach((x, i) => { if (x.amt === diff) sug.push({ txId: t.id, txDate: t.date, amt: t.outAmt, missing: [x.invId] }); });
      if (!sug.some(s => s.txId === t.id)) for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) if (items[i].amt + items[j].amt === diff) sug.push({ txId: t.id, txDate: t.date, amt: t.outAmt, missing: [items[i].invId, items[j].invId] });
    });
    if (sug.length) out.suggest[b.id] = sug.slice(0, 5);
  }

  const open = () => [...st.values()].filter(i => !i.lock && (i.status === 'unpaid' || i.status === 'review' || !i.status));
  const vkey = i => { const v = vendorOf(i); return v ? 'v:' + v.id : 'n:' + normName(i.vendorName); };
  const prevYm = ym => { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; };
  // 계산서가 끊긴 달의 정기 이체일(1~N일) 무렵 출금 → 전월분일 수 있음
  const earlyRisk = (inv, t) => inv.kind === 'buy' && inv.type !== '수기' && t.date.slice(0, 7) === inv.ym && Number(t.date.slice(8, 10)) <= cfg.buyDay;
  const earlySafe = (inv, t) => {
    const prev = [...st.values()].filter(p => p.kind === inv.kind && p.ym === prevYm(inv.ym) && vkey(p) === vkey(inv) && p.total === inv.total);
    return prev.length > 0 && prev.every(p => p.status === 'paid' && !(p.matchTxIds || []).includes(t.id));
  };
  // 1단계: 단건 (이름·고객번호 + 금액) — 오래된 계산서부터
  const order = open().sort((a, b) => String(a.date).localeCompare(String(b.date)) || (codeTokens(b.note).length - codeTokens(a.note).length));
  for (const inv of order) {
    const [from, to] = invWindow(inv, cfg), names = invNames(inv, vendorOf(inv)), rej = new Set(inv.rejectTx || []);
    const pool = (inv.kind === 'sell' ? ins : outs).filter(t => !used.has(t.id) && !rej.has(t.id) && t.date >= from && t.date <= to && amtOf(t, inv.kind) === inv.total && txOk(inv, t));
    let best = null, score = 0;
    for (const t of pool) {
      let s = codeHit(inv, t) ? 3 : nameHit(names, t) ? 2 : 0;
      if (s && earlyRisk(inv, t) && !earlySafe(inv, t)) s = 0;
      if (s > score) { best = t; score = s; }
    }
    if (best) { used.add(best.id); patch(inv.id, { status: 'paid', matchType: score === 3 ? 'code' : 'single', matchTxIds: [best.id], matchDate: best.date, matchText: descr(best), reviewTxId: null }); }
  }
  // 2단계: 같은 거래처 여러 장 합산
  const groups = {};
  open().filter(i => i.status !== 'paid').forEach(i => { const v = vendorOf(i); const k = i.kind + '|' + (v ? v.id : normName(i.vendorName)); (groups[k] = groups[k] || []).push(i); });
  for (const list of Object.values(groups)) {
    if (list.length < 2) continue;
    const g = list.slice(0, 16), kind = g[0].kind, names = invNames(g[0], vendorOf(g[0]));
    const from = g.map(i => invWindow(i, cfg)[0]).sort()[0], to = g.map(i => invWindow(i, cfg)[1]).sort().pop();
    const sum = g.reduce((s, i) => s + i.total, 0);
    const pool = (kind === 'sell' ? ins : outs).filter(t => !used.has(t.id) && t.date >= from && t.date <= to && nameHit(names, t) && amtOf(t, kind) <= sum && txOk(g[0], t));
    const taken = new Set();
    for (const t of pool) {
      const target = amtOf(t, kind), n = g.length; let found = 0;
      for (let mask = 1; mask < (1 << n) && !found; mask++) {
        if ((mask & (mask - 1)) === 0) continue; // 2장 이상
        let s = 0, ok = true;
        for (let i = 0; i < n; i++) if (mask & (1 << i)) { if (taken.has(i)) { ok = false; break; } s += g[i].total; }
        if (ok && s === target) found = mask;
      }
      if (!found) continue;
      used.add(t.id);
      for (let i = 0; i < n; i++) if (found & (1 << i)) { taken.add(i); patch(g[i].id, { status: 'paid', matchType: 'combo', matchTxIds: [t.id], matchDate: t.date, matchText: `${descr(t)} (여러 장 합산)`, reviewTxId: null }); }
    }
  }
  // 3단계: 금액만 같은 건 → 확인 필요
  for (const inv of open()) {
    if (st.get(inv.id).status === 'paid') continue;
    const [from, to] = invWindow(inv, cfg), rej = new Set(inv.rejectTx || []);
    const c = (inv.kind === 'sell' ? ins : outs).find(t => !used.has(t.id) && !rej.has(t.id) && t.date >= from && t.date <= to && amtOf(t, inv.kind) === inv.total && txOk(inv, t));
    if (c) { const txt = descr(c) + (earlyRisk(inv, c) ? ' · 전월분일 수 있음' : ''); if (inv.status !== 'review' || inv.reviewTxId !== c.id || inv.matchText !== txt) patch(inv.id, { status: 'review', reviewTxId: c.id, matchText: txt }); }
    else if (inv.status !== 'unpaid') patch(inv.id, { status: 'unpaid', reviewTxId: null, matchText: '' });
  }
  return out;
}

/* 국민은행 대량이체 업로드 양식 (머리글 없음: A 은행코드, B 계좌번호, C 금액, D 받는분, E 내 표시, H 메모) */
function writeTransferSheet(wb, rows, myDisplay) {
  const ws = wb.addWorksheet('Sheet1');
  rows.forEach((r, i) => {
    const row = ws.getRow(i + 1);
    row.getCell(1).value = String(r.code || '').padStart(3, '0');
    row.getCell(2).value = String(r.acct || '');
    row.getCell(3).value = Number(r.amt) || 0; row.getCell(3).numFmt = '###,##0';
    row.getCell(4).value = String(r.holder || ''); row.getCell(4).numFmt = '@';
    row.getCell(5).value = String(myDisplay || ''); row.getCell(5).numFmt = '@';
    row.getCell(8).value = String(r.memo || '').slice(0, 20); row.getCell(8).numFmt = '@';
  });
  [6, 18, 12, 28, 12, 4, 4, 24].forEach((w, i) => ws.getColumn(i + 1).width = w);
  return ws;
}
// ==MATCH END==
</script>
<script>
/* =========================================================
   세금계산서 · 미지급금 · 미수금 / 거래처 계좌
   ========================================================= */
const initialOf = email => (String(email || '').match(/[A-Za-z]/) || ['?'])[0].toUpperCase();
const shortTime = ms => { if (!ms) return ''; const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const STATUS_LABEL = { paid: '기지급', review: '확인 필요', unpaid: '미지급', planned: '이체 예정', excluded: '미지급외' };
const STATUS_LABEL_SELL = { paid: '입금완료', review: '확인 필요', unpaid: '미수', planned: '-', excluded: '미수외' };
const prevYm = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return ymOf(ymd(d)); };
const IV = { ym: prevYm(), kind: 'buy', status: 'all', sortBy: 'date', onlyNew: false, lastUpload: null, q: '', sel: new Set(), invs: null, batches: null, txns: null, suggest: {}, pending: null, showCfg: false };
let VENDORS = null, MCFG = null;

async function loadVendorsCfg(force) {
  if (VENDORS && MCFG && !force) return;
  const [vs, cfg] = await Promise.all([db.collection('vendors').get(), db.collection('settings').doc('match').get()]);
  VENDORS = []; vs.forEach(d => VENDORS.push({ id: d.id, ...d.data() }));
  VENDORS.sort((a, b) => String(a.name).localeCompare(String(b.name)));
  MCFG = Object.assign(clone(DEFAULT_MATCH), cfg.exists ? cfg.data() : {});
}
const vById = id => VENDORS.find(v => v.id === id);
function bizMap() { const m = new Map(); VENDORS.forEach(v => (v.bizNos || []).forEach(b => m.set(bizKey(b), v))); return m; }
let _bizMap = null;
const vendorOf = inv => (inv.vendorId && vById(inv.vendorId)) || (_bizMap || (_bizMap = bizMap())).get(bizKey(inv.vendorBiz)) || null;
const refreshBizMap = () => { _bizMap = null; };
function bankOf(inv) {
  if (inv.acct) return { code: bankCodeOf(inv.bankName, inv.bankCode), acct: inv.acct, holder: inv.holder || inv.vendorName };
  const v = vendorOf(inv);
  if (v && v.acct) return { code: bankCodeOf(v.bank, v.bankCode), acct: v.acct, holder: v.holder || v.name };
  return null;
}

/* ---------- 데이터 로드 & 매칭 ---------- */
async function loadInvData() {
  await loadVendorsCfg();
  const shift = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const yms = [shift(IV.ym, -1), IV.ym, shift(IV.ym, 1)];
  const [is, bs, lu] = await Promise.all([
    db.collection('invoices').where('ym', 'in', yms).get(),
    db.collection('batches').where('ym', 'in', yms).get(),
    db.collection('invoiceUploads').orderBy('at', 'desc').limit(1).get()
  ]);
  IV.invs = []; is.forEach(d => IV.invs.push({ id: d.id, ...d.data() }));
  IV.batches = []; bs.forEach(d => IV.batches.push({ id: d.id, ...d.data() }));
  IV.lastUpload = null; lu.forEach(d => IV.lastUpload = { id: d.id, ...d.data() });
  const from = yms[0] + '-01';
  let to = nextMonthDay(nextMonthDay(IV.ym + '-01', 1), 31);
  IV.batches.forEach(b => { const e = addDays(b.date, 40); if (e > to) to = e; });
  const s = await db.collection('txns').where('date', '>=', from).where('date', '<=', to).get();
  IV.txns = []; s.forEach(d => IV.txns.push({ id: d.id, ...d.data() }));
  IV.sel.clear();
}
async function doMatch(silent) {
  refreshBizMap();
  const r = runMatch(IV.invs, IV.txns, vendorOf, IV.batches, MCFG);
  IV.suggest = r.suggest;
  const ops = [];
  for (const [id, p] of r.inv) { ops.push(b => b.update(db.collection('invoices').doc(id), p)); Object.assign(IV.invs.find(i => i.id === id), p); }
  for (const [id, p] of r.batch) { ops.push(b => b.update(db.collection('batches').doc(id), p)); Object.assign(IV.batches.find(x => x.id === id), p); }
  await commitBatches(ops);
  if (!silent) toast(r.inv.size ? `${r.inv.size}건의 상태가 바뀌었어요` : '새로 맞춰진 건이 없어요');
}
async function setInv(inv, p) { await db.collection('invoices').doc(inv.id).update(p); Object.assign(inv, p); }
async function learnVendorName(inv, tx) {
  const v = vendorOf(inv); if (!v || !tx) return;
  const n = learnName(tx.party || tx.memo1); if (n.length < 2) return;
  const key = inv.kind === 'sell' ? 'inNames' : 'outNames';
  if ((v[key] || []).includes(n)) return;
  v[key] = [...(v[key] || []), n];
  await db.collection('vendors').doc(v.id).update({ [key]: v[key] });
}

  if (t.id === 'brCancel') { IV.batchReg = false; return renderInv(); }

  if (t.id === 'ivSelClear') { IV.sel.clear(); return renderInv(); }

/* ---------- 기지급·입금 직접 체크 (지급일 선택 + 은행 내역 대조) ---------- */
function manualPaidDialog(inv) {

      <label>방법<select class="in" id="mpWay">${['계좌이체', '법인카드', '현금', '상계', '기타'].map(w => `<option>${w}</option>`).join('')}</select></label>

  document.body.appendChild(bg);
  const usedIds = new Set(IV.invs.filter(i => i.id !== inv.id && i.status === 'paid').flatMap(i => i.matchTxIds || []));

async function linkAllSuggested() {
  const ops = [];

async function parseInvFiles(files) {
  await loadVendorsCfg();
  const invs = [], skipped = [], headers = {}, fileStats = []; let manualYm = null;
  for (const file of files) {
  const before = invs.length;
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    const hi = rows.findIndex(r => r.map(x => String(x).trim()).includes('승인번호') && r.map(x => String(x).trim()).includes('합계금액'));
    const mi = rows.findIndex(r => r.map(x => String(x).trim()).includes('업체명') && r.map(x => String(x).trim()).includes('이체금액'));

      const ix = n => H.indexOf(n), supI = ix('상호'), buyI = H.indexOf('상호', supI + 1), ceoI = ix('대표자명'), ceo2I = H.indexOf('대표자명', ceoI + 1);
      const ourSet = new Set(MCFG.ourBiz.map(o => bizKey(o.biz)));
      for (const r of rows.slice(hi + 1)) {
        const g = n => { const k = ix(n); return k < 0 ? '' : r[k]; };
        const appr = String(g('승인번호')).trim(); if (!appr) continue;
        const supBiz = String(g('공급자사업자등록번호')), buyBiz = String(g('공급받는자사업자등록번호'));
        const kind = sn.includes('매출') ? 'sell' : sn.includes('매입') ? 'buy' : (ourSet.has(bizKey(supBiz)) ? 'sell' : 'buy');
        const date = normDate(g('작성일자'));
        const flag = v => String(v || '').trim();
        invs.push({
          id: appr.replace(/\//g, '-'), approvalNo: appr, sheet: sn, kind, type: String(g('전자세금계산서분류') || (sn.includes('계산서') && !sn.includes('세금') ? '계산서' : '세금계산서')),
          date, ym: date.slice(0, 7), issueDate: normDate(g('발급일자')), sendDate: normDate(g('전송일자')), total: num(g('합계금액')), supply: num(g('공급가액')), tax: num(g('세액')),
          vendorBiz: kind === 'sell' ? buyBiz : supBiz, vendorName: String(kind === 'sell' ? r[buyI] : r[supI]).trim(),
          ceo: String(kind === 'sell' ? (r[ceo2I] ?? '') : (r[ceoI] ?? '')).trim(),
          ourBiz: kind === 'sell' ? supBiz : buyBiz, ourName: String(kind === 'sell' ? r[supI] : r[buyI]).trim(),
          note: String(g('비고') || ''), item: String(g('품목명') || ''), raw: r.map(x => x === null || x === undefined ? '' : x),
          fileAccount: flag(g('계정명')), filePaid: flag(g('기지급여부')), fileExcl: flag(g('미지급외 처리'))
        });
      }
    } else if (mi >= 0) {
      const H = rows[mi].map(h => String(h).trim()), ix = n => H.indexOf(n); manualYm = IV.ym; headers[sn] = H;
      rows.slice(mi + 1).forEach((r, k) => {
        const g = n => { const c = ix(n); return c < 0 ? '' : r[c]; };
        const name = String(g('업체명')).trim(); if (!name) return;
        invs.push({
          id: `M-${IV.ym}-${String(g('NO') || k + 1)}-${normName(name).slice(0, 10)}`, sheet: sn, kind: 'buy', type: '수기', date: `${IV.ym}-01`, ym: IV.ym,
          total: num(g('이체금액')), vendorName: name, vendorBiz: '', item: String(g('내용') || ''), note: String(g('특이사항') || ''),
          bankName: String(g('은행') || '').trim(), bankCode: bankCodeOf(g('은행'), ''), acct: String(g('계좌') || '').trim(), holder: String(g('예금주') || '').trim(),
          raw: r.map(x => x === null || x === undefined ? '' : x), filePaid: String(g('완료여부') || '').trim(), fileExcl: '', fileAccount: ''

  }

  }
  const seen = new Set(); for (let k = invs.length - 1; k >= 0; k--) { if (seen.has(invs[k].id)) invs.splice(k, 1); else seen.add(invs[k].id); }

  renderInv();
}

/* ---------- 대량이체 묶음 ---------- */
async function makeBatch() {
  const list = [...IV.sel].map(id => IV.invs.find(i => i.id === id)).filter(i => i && i.status === 'unpaid');
  const ok = list.filter(bankOf), miss = list.filter(i => !bankOf(i)), zero = ok.filter(i => !num(i.total));
  const use = ok.filter(i => num(i.total));
  if (!use.length) return toast('계좌가 등록된 미지급 건이 없어요. 거래처 화면에서 계좌를 등록해 주세요');
  const total = use.reduce((s, i) => s + num(i.total), 0);
  const msg = `${use.length}건, ${won(total)}원으로 대량이체 파일을 만들까요?` + (miss.length ? `\n\n계좌가 없어 빠지는 건 ${miss.length}건: ${miss.slice(0, 5).map(i => i.vendorName).join(', ')}${miss.length > 5 ? ' 외' : ''}` : '') + (zero.length ? `\n금액이 0원인 ${zero.length}건도 빠져요.` : '');
  if (!confirm(msg)) return;
  await busy(async () => {
    const ref = db.collection('batches').doc();
    const items = use.map(i => { const bk = bankOf(i); return { invId: i.id, amt: num(i.total), code: bk.code, acct: bk.acct, holder: bk.holder, memo: i.memo || String(i.item || '').slice(0, 20) }; });
    const b = { ym: IV.ym, date: today(), items, total, status: 'planned', createdAt: TS(), by: S.user.email };
    await ref.set(b);
    await commitBatches(use.map(i => x => x.update(db.collection('invoices').doc(i.id), { status: 'planned', batchId: ref.id })));
    use.forEach(i => { i.status = 'planned'; i.batchId = ref.id; });
    IV.batches.push({ id: ref.id, ...b }); IV.sel.clear();
    await downloadBatch({ id: ref.id, ...b });
    await exportInvList(true);
    renderInv();
  });
}
async function downloadBatch(b) {

  await saveWb(wb, `${+IV.ym.slice(5)}월_미지급금_이체내역_업로드용_${b.date.replace(/-/g, '')}.xlsx`);

async function cancelBatch(b) {

async function applySuggestion(b) {
  const s = IV.suggest[b.id][0], miss = new Set(s.missing);
  const items = b.items.filter(x => !miss.has(x.invId)), total = items.reduce((t, x) => t + x.amt, 0);
  await db.collection('batches').doc(b.id).update({ items, total });
  await commitBatches([...miss].map(id => x => x.update(db.collection('invoices').doc(id), { status: 'unpaid', batchId: null })));
  Object.assign(b, { items, total });
  miss.forEach(id => { const i = IV.invs.find(v => v.id === id); if (i) { i.status = 'unpaid'; i.batchId = null; } });
  await doMatch(true); toast('빠진 건은 미지급으로 돌리고, 나머지는 지급 확인했어요'); renderInv();
